<!doctype html>
<!--
  Estate — a Driftland theme. An enchanted ink plan of an old town on stained parchment.
  The town is grown procedurally in a worker (roads → angled districts → lots → marching squares, walls
  written in tiny letters). It stays put: windows push the ink aside live (a GPU pass with a soft, wavy
  edge), and when the town does change, the new ink spreads in blotches while the old fades. Never a blink.
  Perf: the GPU pass runs only while a window moves or a change is spreading; otherwise nothing redraws.
-->
<html>
<head>
<meta charset="utf-8">
<title>Marauders</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e9d8b4; }
  canvas.layer { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .decor { transition: opacity 3.2s cubic-bezier(.4, 0, .2, 1); }
  .step { position: fixed; left: 0; top: 0; pointer-events: none; opacity: 0; will-change: opacity;
          animation: step 5.2s cubic-bezier(.33, 0, .25, 1) forwards; }
  .step.mine { animation-duration: 3.4s; }
  @keyframes step { 0% { opacity: 0; } 12% { opacity: .8; } 45% { opacity: .64; } 100% { opacity: 0; } }
  @keyframes gone { from { opacity: var(--from, .55); } to { opacity: 0; } }
  .tag { position: fixed; left: 0; top: 0; pointer-events: none; opacity: 0; will-change: transform, opacity;
         transition: opacity 1.2s ease, transform 1.1s cubic-bezier(.25, .1, .25, 1); }
</style>
</head>
<body>
<canvas id="paper" class="layer"></canvas>
<canvas id="ink" class="layer"></canvas>
<canvas id="decorA" class="layer decor" style="opacity:0"></canvas>
<canvas id="decorB" class="layer decor" style="opacity:0"></canvas>
<script>
'use strict';
window.__opaque = false; window.__noMask = true;      // the ink layer needs alpha; no host stencil here
const INK = 'rgba(70,44,26,0.9)', INK_SOFT = 'rgba(70,44,26,0.5)', RED = 'rgba(118,34,26,0.88)';
const SCRIPT = '"Apple Chancery", "Snell Roundhand", "Iowan Old Style", serif';
const P = { quality: 2 };
let W = innerWidth, H = innerHeight, K = devicePixelRatio, fpsEMA = 0, fieldMs = 0, paused = false;
const $ = id => document.getElementById(id);
const cv = $('paper');

function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- names ---------- */
const pick = (R, a) => a[Math.floor(R() * a.length)];
const N = {

  place: ['Stair', 'Gallery', 'Passage', 'Tower', 'Cloister', 'Chamber', 'Hall', 'Library', 'Court', 'Vault', 'Archive', 'Landing', 'Undercroft', 'Belfry', 'Study', 'Observatory', 'Scriptorium'],
  of: ['Echoes', 'Lost Keys', 'Quiet Ink', 'Old Maps', 'the Small Hours', 'Borrowed Light', 'Forgotten Names', 'Unsent Letters', 'Moving Stairs', 'Seven Doors', 'Folded Paper', 'Patient Clocks'],
  pre: ['Ash', 'Bram', 'Cinder', 'Dusk', 'Elder', 'Fern', 'Gloam', 'Ivy', 'Moss', 'North', 'Oak', 'Quill', 'Raven', 'Salt', 'Thistle', 'Umber', 'Wick', 'Yew', 'Thorn', 'Lark', 'Crow', 'Mallow', 'Hearth'],
  suf: ['wood', 'combe', 'ford', 'by', 'well', 'moor', 'shaw', 'stead', 'field', 'brook', 'worth', 'gate', 'ley', 'hurst', 'mere', 'wick'],
  fa: ['Al', 'Bel', 'Cor', 'Dun', 'El', 'Fen', 'Gil', 'Hal', 'Is', 'Jas', 'Kel', 'Lor', 'Mer', 'Nim', 'Ol', 'Per', 'Quil', 'Ros', 'Sel', 'Tam', 'Ver', 'Wil', 'Pip', 'Wren'],
  fb: ['a', 'ric', 'wen', 'ith', 'o', 'an', 'eth', 'ys', 'ia', 'mund', 'ard', 'ella', 'in', 'ora', 'us', 'ette', 'wyn', ''],

function compassRose(x, cx, cy, R) {

    x.beginPath(); x.moveTo(0, 0); x.lineTo(...tip); x.lineTo(...l); x.closePath(); x.fillStyle = RED; x.fill(); x.stroke();
    x.beginPath(); x.moveTo(0, 0); x.lineTo(...tip); x.lineTo(...r); x.closePath(); x.fillStyle = 'rgba(239,226,198,.9)'; x.fill(); x.stroke(); };
  for (let i = 0; i < 4; i++) arm(Math.PI / 4 + i * Math.PI / 2, R * .6, R * .1);
  for (let i = 0; i < 4; i++) arm(-Math.PI / 2 + i * Math.PI / 2, R, R * .15);
  x.font = `${R * .3}px ${SCRIPT}`; x.fillStyle = RED; x.textAlign = 'center'; x.textBaseline = 'middle';
  [['N', 0, -1.22], ['E', 1.22, 0], ['S', 0, 1.22], ['W', -1.22, 0]].forEach(([t, a, b]) => x.fillText(t, a * R, b * R));
  x.restore();
}

/* ---------- the town: shape field lives in a worker; walls come back as letters every frame ---------- */
const worker = new Worker('estate-worker.js');
let deskI = 0, roads = [], citySeed = 1, generation = 0, building = false, townSeed = 1, morphStart = -1e9, MORPH_MS = 4200;
let inflight = false, frameMs = 0, needFrame = true, inflightT0 = 0;
worker.onerror = e => { try { webkit.messageHandlers.host.postMessage('JSERR worker ' + e.message + ' :' + e.lineno); } catch (_) {} };

  if (d.town && d.failed) { building = false; try { webkit.messageHandlers.host.postMessage('JSERR town ' + d.failed); } catch (_) {} return; }
  if (d.town) {

    // labels, round towers, splats: cross-fade between the old and new decor (after any cross-fade still running)
    const apply = () => {
    const back = decorFront === $('decorA') ? $('decorB') : $('decorA');
    back.width = d.bitmap.width; back.height = d.bitmap.height;
    const x = back.getContext('2d'); x.drawImage(d.bitmap, 0, 0); d.bitmap.close(); decorate(x, d.rings, d.spots);
    const old = decorFront; back.style.opacity = 1; old.style.opacity = 0; decorFront = back;
    clearTimeout(old._free); old._free = setTimeout(() => { if (old !== decorFront) { old.width = old.height = 1; } }, 3600);   // free ~24 MB
    };

    if (at > nowD) setTimeout(apply, at - nowD); else apply();

    morphStart = performance.now(); needFrame = true; wake();

    pending = d; if (!running) { running = true; lastT = 0; requestAnimationFrame(loop); } return; }

let decorFront = $("decorB"), pending = null, decorNext = 0;
function grow(seed) {
  if (building) { growQueued = { seed }; return; } building = true; buildT0 = performance.now();
  townSeed = seed ?? hash(`${citySeed}:${generation++}`);
  const tm = Math.min(1, (performance.now() - morphStart) / MORPH_MS); tFrozen = ease3(tm);
  worker.postMessage({ town: true, W, H, K, seed: townSeed, t: tFrozen });

let growQueued = null, tFrozen = 0, townGen = 0, buildT0 = 0;
// labels go only into open ground the town reported, and never overlap each other, the towers or the compass
function decorate(x, rings, spots = []) {
  x.setTransform(K, 0, 0, K, 0, 0);
  const boxes = [[W * .09 - 70, H * .15 - 70, W * .09 + 70, H * .15 + 70]];
  for (const rg of rings) boxes.push([rg.cx - rg.r - 8, rg.cy - rg.r - 8, rg.cx + rg.r + 8, rg.cy + rg.r + 8]);
  const fits = (cx, cy, text, size) => {
    x.font = `${size}px ${SCRIPT}`; const w = x.measureText(text).width + size * 4.6, h = size * 2.6;
    const b = [cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2];
    if (b[0] < 8 || b[1] < 8 || b[2] > W - 8 || b[3] > H - 8) return null;
    return boxes.some(o => b[0] < o[2] + 14 && b[2] > o[0] - 14 && b[1] < o[3] + 14 && b[3] > o[1] - 14) ? null : b;
  };
  for (const rg of rings) {                          // a tower's name sits just beneath it
    const name = placeName(rng(hash(`ring${townSeed}${rg.cx | 0}`))), cy = rg.cy + rg.r + 22, b = fits(rg.cx, cy, name, 11);
    if (b) { boxes.push(b); banner(x, name, rg.cx, cy, 11); }
  }
  let placed = 0; const want = Math.round(W * H / 260000);
  for (const [px, py] of spots) {
    if (placed >= want) break;
    const name = placeName(rng(hash(`b${townSeed}${px | 0}:${py | 0}`))), b = fits(px, py, name, 11.5);
    if (!b) continue; boxes.push(b); banner(x, name, px, py, 11.5); placed++;
  }

}

/* ---------- GPU lettering: one instanced quad per letter, from a glyph atlas ---------- */
const GLYPHS = 'ABCDEFGHILMNOPQRSTVX', AC = 8, AR = 3, CELL = 48, FONT_PX = 34;
const gl = $('ink').getContext('webgl2', { premultipliedAlpha: true, antialias: true });
const atlasCv = document.createElement('canvas'); atlasCv.width = AC * CELL; atlasCv.height = AR * CELL;
const adv = (() => { const x = atlasCv.getContext('2d'); x.font = `${FONT_PX}px "Iowan Old Style", "Hoefler Text", Baskerville, serif`; x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
  return [...GLYPHS].map((ch, i) => { x.fillText(ch, (i % AC + .5) * CELL, (Math.floor(i / AC) + .5) * CELL + 1); return x.measureText(ch).width / FONT_PX; }); })();
worker.postMessage({ init: true, adv });
const VS = `#version 300 es
in vec2 aCorner; in vec4 aA; in vec2 aB;          // aA: x, y, angle, glyph   aB: alpha, size
uniform vec2 uRes, uAtlas; uniform float uScale;
out vec2 vUV; out float vA;
void main() {
  float c = cos(aA.z), s = sin(aA.z), sz = aB.y * uScale;
  vec2 q = aCorner * sz, p = aA.xy + vec2(c * q.x - s * q.y, s * q.x + c * q.y);
  gl_Position = vec4(p.x / uRes.x * 2. - 1., 1. - p.y / uRes.y * 2., 0., 1.);
  float g = aA.w; vUV = (vec2(mod(g, uAtlas.x), floor(g / uAtlas.x)) + aCorner + .5) / uAtlas; vA = aB.x;
}`;
const FS = `#version 300 es
precision mediump float;
uniform sampler2D uTex; in vec2 vUV; in float vA; out vec4 o;
void main() { float a = texture(uTex, vUV).a * vA * .86; o = vec4(vec3(.245, .15, .085) * a, a); }`;
function program(vs, fs) {

const PR = program(VS, FS); gl.useProgram(PR);
const U = {}; for (const k of ['uRes', 'uAtlas', 'uScale', 'uTex']) U[k] = gl.getUniformLocation(PR, k);
const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
const quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-.5, -.5, .5, -.5, -.5, .5, .5, .5]), gl.STATIC_DRAW);
const locC = gl.getAttribLocation(PR, 'aCorner'), locA = gl.getAttribLocation(PR, 'aA'), locB = gl.getAttribLocation(PR, 'aB');
gl.enableVertexAttribArray(locC); gl.vertexAttribPointer(locC, 2, gl.FLOAT, false, 0, 0);

const instBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);

gl.enableVertexAttribArray(locB); gl.vertexAttribPointer(locB, 2, gl.FLOAT, false, 24, 16); gl.vertexAttribDivisor(locB, 1);

function drawGlyphs(inst, n) {
  ST.draws++; { const nw = performance.now(); if (ST.lastDraw && nw - ST.lastDraw < 500) ST.dgap = Math.max(ST.dgap || 0, nw - ST.lastDraw); ST.lastDraw = nw; }

/* ---------- windows: eased toward where they really are; new ones push in, closed ones let go ---------- */
let cur = [];
function setTargets(list) {

  for (const t of list) {
    let best = null, bd = 1e9;
    for (const c of cur) { if (used.has(c)) continue;
      if (c.owner !== t.owner || !c.alive && c.life < .2) continue;   // only the same app's window can take this slot
      const d = Math.hypot(c.tx + c.tw / 2 - t.x - t.w / 2, c.ty + c.th / 2 - t.y - t.h / 2) + Math.abs(c.tw - t.w) * .5 + Math.abs(c.th - t.h) * .5;
      if (d < bd) { bd = d; best = c; } }
    if (best) {                     // same app → same slot, however far it jumped (minimise → Stage Manager strip)
      used.add(best);
      // velocity of the real window (for a little look-ahead while you drag)
      const now = performance.now(), dtv = Math.max(1, now - (best.tT || now - 16)) / 1000;
      // a jump (reveal-desktop click, minimise to the strip, Stage Manager shuffle) is not a drag: glide it
      if (Math.hypot(t.x - best.tx, t.y - best.ty) > 60 || Math.abs(t.w - best.tw) > 40 || Math.abs(t.h - best.th) > 40) { best.glideUntil = now + 700; best.vx = best.vy = 0; best.tT = now; }

      if (!(best.glideUntil > now)) { best.vx = (best.vx || 0) * .4 + vx * .6; best.vy = (best.vy || 0) * .4 + vy * .6; } best.tT = now;

  }

}
let liveUntil = 0, animating = false, morphTick = 0;
function stepWins(dt) {

  const live = performance.now() < liveUntil;

  // visible glide (~⅓ s) so the court flies with the window and the town grows back behind it.

const hallTags = new Map();
function drawHalls() {   // a red scroll naming each app's hall: a small sprite moved by the compositor
  const seen = new Set(), best = new Map();

    seen.add(c.owner);

      const name = placeName(rng(hash('hall:' + c.owner))), m = document.createElement('canvas').getContext('2d'); m.font = `14px ${SCRIPT}`;
      const tw = Math.ceil(m.measureText(name).width) + 52, th = 34; el = document.createElement('canvas');
      el.width = tw * K; el.height = th * K; el.style.cssText = `position:fixed;left:0;top:0;width:${tw}px;height:${th}px;pointer-events:none;will-change:transform,opacity`;
      const x = el.getContext('2d'); x.scale(K, K); banner(x, name, tw / 2, th / 2, 14, RED); el._w = tw; el._h = th;
      document.body.appendChild(el); hallTags.set(c.owner, el);
    }
    const spots = [[c.x + c.w / 2, c.y - 26], [c.x + c.w / 2, c.y + c.h + 28], [c.x + 20 + el._w / 2, c.y - 26], [c.x + c.w - 20 - el._w / 2, c.y + c.h + 28],

/* ---------- the loop: only while windows glide or the town is morphing ---------- */

/* ---------- shoeprints, walkers ---------- */
function shoe(left) {

const SHOES = [shoe(true), shoe(false)];
function makeTag(name, color) {

  const tw = Math.ceil(m.measureText(name).width) + 44, th = 28; c.width = tw * K; c.height = th * K; c.style.width = tw + 'px'; c.style.height = th + 'px'; c.className = 'tag';
  const x = c.getContext('2d'); x.scale(K, K); banner(x, name, tw / 2, th / 2, 12, color); document.body.appendChild(c); return c;
}
const SPREAD = 3.4;
let liveSteps = 0;
class Walker {

  }

// you: a walker who follows the cursor at walking pace, leaving a short trail
let me = null, target = null, chasing = false, chaseT = 0;
function chase(now) {

  const dt = chaseT ? Math.min((now - chaseT) / 1000, .05) : 1 / 60; chaseT = now;
  const dx = target.x - me.sm.x, dy = target.y - me.sm.y, d = Math.hypot(dx, dy);

// strangers: they walk the streets, turning onto the nearest connecting street at each end
const strangers = [];
function nearestOnRoads(p, skip) {

function onScreen(q) { return q[0] > 10 && q[1] > 10 && q[0] < W - 10 && q[1] < H - 10; }
