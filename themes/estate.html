<!doctype html>
<!--
  Estate — a Tidewall theme. An enchanted ink plan of an old town on stained parchment.
  The town is grown procedurally in a worker (roads → angled districts → lots → marching squares, walls
  written in tiny letters). It stays put: windows push the ink aside live (a GPU pass with a soft, wavy
  edge), and when the town does change, the new ink spreads in blotches while the old fades. Never a blink.
  Perf: the GPU pass runs only while a window moves or a change is spreading; otherwise nothing redraws.
-->
<html>
<head>
<meta charset="utf-8">
<title>Marauders</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e9d8b4; }
  canvas.layer { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .decor { transition: opacity 1.6s cubic-bezier(.4, 0, .2, 1); }
  /* the decor sheets are opaque parchment stacked at z 1–2 (the ink above at 3): every sprite goes above them all, or it
     is drawn but never seen (the shoeprints, the walkers' names and the halls' scrolls all were) */
  .step { position: fixed; left: 0; top: 0; z-index: 4; pointer-events: none; opacity: 0; will-change: opacity;
          animation: step 5.2s cubic-bezier(.33, 0, .25, 1) forwards; }
  .step.mine { animation-duration: 3.4s; }
  @keyframes step { 0% { opacity: 0; } 12% { opacity: .8; } 45% { opacity: .64; } 100% { opacity: 0; } }
  @keyframes gone { from { opacity: var(--from, .55); } to { opacity: 0; } }
  .tag { position: fixed; left: 0; top: 0; z-index: 5; pointer-events: none; opacity: 0; will-change: transform, opacity;
         transition: opacity 1.2s ease, transform 1.1s cubic-bezier(.25, .1, .25, 1); }
</style>
</head>
<body>
<canvas id="decorA" class="layer decor" style="opacity:0"></canvas>
<canvas id="decorB" class="layer decor" style="opacity:0"></canvas>
<canvas id="ink" class="layer" style="z-index:3"></canvas>
<script src="span.js"></script>

  let best = null, bd = 1e9;
  for (const r of roads) { if (r === skip) continue; for (let i = 0; i < r.length; i++) { const d = Math.hypot(r[i][0] - p.x, r[i][1] - p.y); if (d < bd) { bd = d; best = { r, i }; } } }
  return best ? { ...best, d: bd } : null;
}
function onScreen(q) { return onOneW([q[0], q[1], q[0], q[1]], 10); }
// in sight: on the screen and not under one of your windows (the streets run on under them; a stranger who walked under
// one or off the edge left no prints anyone could see)
const inSight = q => onScreen(q) && !cur.some(c => c.alive && c.owner !== '__icons' && q[0] > c.x + 4 && q[0] < c.x + c.w - 4 && q[1] > c.y + 4 && q[1] < c.y + c.h - 4);
function newRoute(s) {
  if (!roads.length) return;
  if (!s.p) { const r = roads[Math.floor(s.R() * roads.length)], i = Math.floor(s.R() * r.length); if (!inSight(r[i])) return; s.p = { x: r[i][0], y: r[i][1] }; s.w.place(s.p.x, s.p.y); s.out = 0; }
  const near = nearestOnRoads(s.p, null); if (!near) return;
  s.route = near.r; s.i = near.i; s.dir = s.R() < .5 ? 1 : -1;
}
function startStrangers(seed) {
  const R = rng(seed);
  for (let i = 0; i < 4; i++) strangers.push({ w: new Walker(personName(R), INK, { stride: 28 }), v: 10 + R() * 6, R: rng(seed + i + 1), p: null, route: null });
  let last = performance.now();
  setInterval(() => {
    const now = performance.now(), dt = Math.min((now - last) / 1000, .2); last = now;
    if (paused || !roads.length || (Span.world && !Span.leader())) return;   // one world: the leader walks them
    for (const s of strangers) {
      if (!s.route) { newRoute(s); continue; }
      let budget = s.v * dt;
      while (budget > 0) {
        const n = s.route[s.i];
        if (!n) {                                        // end of this street: turn onto a nearby one, or turn back
          const next = nearestOnRoads(s.p, s.route);
          // (onto the new street the way it runs on: joined at its end and sent off that end, a stranger flipped between
          // the two streets' ends, tick after tick, and stood still)
          if (next && next.d < 26) { s.route = next.r; s.i = next.i; s.dir = next.i < 2 ? 1 : next.i > next.r.length - 3 ? -1 : s.R() < .5 ? 1 : -1; }
          else { s.dir = -s.dir; s.i = Math.max(0, Math.min(s.route.length - 1, s.i + s.dir * 2)); }
          break;
        }
        const dx = n[0] - s.p.x, dy = n[1] - s.p.y, d = Math.hypot(dx, dy);
        if (d <= budget) { s.p.x = n[0]; s.p.y = n[1]; budget -= d; s.i += s.dir; }
        else { s.p.x += dx / d * budget; s.p.y += dy / d * budget; budget = 0; }
      }
      // out of sight: turn back once, and keep on back until in sight again (turned every tick while out, a stranger off
      // the edge paced on the spot there for good); still out after 6 s (a street that only runs on out of sight), it
      // starts again on a street in sight, its prints from there
      if (!inSight([s.p.x, s.p.y])) {
        if (!s.out) { s.out = now; s.dir = -s.dir; s.i += s.dir * 2; }
        else if (now - s.out > 6000) { s.p = null; s.route = null; s.out = 0; continue; }
      } else s.out = 0;
      // two who've fallen into step on one street (both turned back at the same window, say) read as one pair of
      // prints: the later one turns round
      const hx = s.p.x - (s.lx ?? s.p.x), hy = s.p.y - (s.ly ?? s.p.y); s.lx = s.p.x; s.ly = s.p.y;
      if (!(now < s.sepT) && strangers.some(o => o !== s && o.p && strangers.indexOf(o) < strangers.indexOf(s) && Math.hypot(o.p.x - s.p.x, o.p.y - s.p.y) < 12 && (o.hx || 0) * hx + (o.hy || 0) * hy > 0)) {
        s.dir = -s.dir; s.i += s.dir * 2; s.sepT = now + 5000; }
      s.hx = hx; s.hy = hy;
      s.w.move(s.p.x, s.p.y);
    }
    sendWalk();
  }, 100);
}

/* ---------- boot + host protocol ---------- */
function size() {
  W = innerWidth; H = innerHeight;
  { const c = $('ink'); c.width = Math.round(W * K); c.height = Math.round(H * K); }
  needFrame = true; if (typeof wake === 'function') wake();
}
size();
const paperMsg = () => Object.assign({ paper: true, W, H, K, seed: citySeed }, worldArgs());
let rz = null; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { size(); worker.postMessage(paperMsg()); grow(townSeed); }, 250); });
let FB = null; function commit() { } function refresh() { }
window.__dbg = () => `steps=${document.querySelectorAll('.step').length} me=${!!(me && me.sm)} town=${fieldMs}ms frame=${frameMs}ms wins=${cur.length}`;
let booted = false, deskKey = '', meSeed = null, lastWinMsg = null, deskIc = [], iconsKey = '';
function cursorAt(x, y) {
  if (paused || !me) return; target = { x, y };
  if (!me.sm) me.place(target.x, target.y);
  if (Span.world && !Span.leader()) return;                         // the leader walks you; the others lay your prints from its word
  if (!chasing) { chasing = true; chaseT = 0; requestAnimationFrame(chase); }
}
Span.on('cur', m => cursorAt(m.x, m.y));
const handle0 = m => {
  if (m.t === 'pause') { paused = !!m.v; Span.paused(paused); if (!paused) wake(); return; }
  if (m.t === 'desk') { const dk = [m.x, m.y, m.w, m.h, JSON.stringify(m.fr || [])].join('|'); if (dk === deskKey) return; deskKey = dk;
    Span.desk(m); OX = Span.x; OY = Span.y; deskI = Span.world ? 0 : m.i | 0;      // one world: every display grows the same town
    if (booted && meSeed != null) { citySeed = ((meSeed >>> 0) ^ Math.imul(deskI, 0x9E3779B9)) >>> 0 || 1; layoutKey = ''; size(); worker.postMessage(paperMsg()); grow(); }
    if (lastWinMsg) handle0(lastWinMsg); return; }
  if (m.t === 'me') {
    meSeed = m.seed; citySeed = ((m.seed >>> 0) ^ Math.imul(deskI, 0x9E3779B9)) >>> 0 || 1;   // each display grows its own town (one world: one town)
    if (!booted) { booted = true; worker.postMessage(paperMsg());
      // alone, the boot town is the one this arrangement of windows grows, as every later one is (it was another town
      // each boot, so a hide and show came back to a different town than you had)
      if (Span.world) grow(); else setTimeout(() => { layoutKey = winKey(); grow(hash(`${citySeed}|${layoutKey}`)); }, lastWinMsg ? 0 : 300);
    }
    if (!me) { me = new Walker(personName(rng(citySeed)), RED, { stride: 30, trail: 9, mine: true }); startStrangers(citySeed + 7); }
    return;
  }
  if (m.t === 'cursor' && m.w) return;                                // over one of your windows (dragging it by its title bar, say): you're working there, not walking the map; your prints wait where you left it
  if (m.t === 'cursor') { const x = m.x / K + OX, y = m.y / K + OY; Span.post('cur', { x, y }); cursorAt(x, y); return; }
  if (m.t === 'windows') { ST.msgs++; const nw = performance.now(); if (ST.lastMsg) ST.gap = Math.max(ST.gap || 0, nw - ST.lastMsg); ST.lastMsg = nw; liveUntil = m.live ? nw + 250 : 0; heldAt = m.live ? nw : 0; }
  if (m.t === 'dicons') { deskIc = (m.c || []).map(([l, t, r, b]) => ({ x: Math.round(l / K + OX), y: Math.round(t / K + OY), w: Math.round((r - l) / K), h: Math.round((b - t) / K), owner: '__icons' }));   // (whole points: every display's worker sees the same numbers)   // your desktop icons: a courtyard each
    const ik = deskIc.map(d => [d.x, d.y, d.w, d.h].map(Math.round).join(',')).join(';');
    if (ik !== iconsKey) { iconsKey = ik; if (booted) grow(townSeed); }            // the same town, its names and towers redrawn clear of them
    if (lastWinMsg) handle0(lastWinMsg); return; }
  if (m.t === 'windows') { lastWinMsg = m; setTargets(m.r.map(([l, t, r, b], i) => ({ x: l / K + OX, y: t / K + OY, w: (r - l) / K, h: (b - t) / K, owner: (m.n || [])[i] })).concat(deskIc)); }
};
const handle = m => { const t0 = performance.now(); handle0(m); ST.busy = (ST.busy || 0) + performance.now() - t0; };
const host = window.chrome && window.chrome.webview;
if (host) { host.addEventListener('message', ev => handle(JSON.parse(ev.data))); host.postMessage('ready'); }
else {
  handle({ t: 'me', seed: 42 });
  handle({ t: 'windows', r: [[W * .35 * K, H * .3 * K, W * .7 * K, H * .66 * K]], n: ['Slack'] });
  addEventListener('mousemove', e => handle({ t: 'cursor', x: e.clientX * K, y: e.clientY * K }));
}
