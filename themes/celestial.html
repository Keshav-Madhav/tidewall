<!doctype html>
<!--
  Celestial Atlas — a Tidewall theme. An antique star chart in gold on deep navy, and every window is a
  black hole: the sky is gravitationally lensed around it (stars smeared into arcs along an Einstein ring,
  light from behind wrapped into view), with a dark horizon, a thin photon ring and a lopsided accretion glow.
  Your cursor is a tiny black hole too, exactly where the pointer is. Ordinary app windows bend the starlight only a
  little, a few px right at their edges (the full lens round every window was distracting); Stage Manager thumbnails
  (round the turned shape each is drawn in, and each app badge round its icon) and Notification Centre keep the full one.
  Perf: the sky is painted once into a texture; the lensing pass runs only while a window or the cursor moves.
  The names are small text elements over it, placed round your windows without repainting the sky; at rest they cost nothing.
-->
<html>
<head>
<meta charset="utf-8">
<title>Celestial Atlas</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1730; }
  canvas.layer { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  /* a meteor: a bright head and a tail that tapers to nothing; it burns out by the tail drawing into the head */
  .shoot { position: fixed; left: 0; top: 0; height: 2.2px; pointer-events: none; transform-origin: 100% 50%; opacity: 0;
           background: linear-gradient(90deg, rgba(255,240,200,0), rgba(255,244,215,.75) 88%, #fffaf0);
           clip-path: polygon(0 50%, 100% 0, 100% 100%); }
  /* the names: each its own little element over the chart, so one can come or go without touching the rest */
  #names { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  #names > div { position: absolute; left: 0; top: 0; white-space: pre; opacity: 0; }
</style>
</head>
<body>
<canvas id="gl" class="layer"></canvas>
<div id="names"></div>
