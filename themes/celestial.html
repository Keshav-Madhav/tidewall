  Celestial Atlas — a Tidewall theme. An antique star chart in gold on deep navy, and every window is a
  black hole: the sky is gravitationally lensed around it (stars smeared into arcs along an Einstein ring,
  light from behind wrapped into view), with a dark horizon, a thin photon ring and a lopsided accretion glow.
  Your cursor is a tiny black hole too, exactly where the pointer is.
  Perf: the sky is painted once into a texture; the lensing pass runs only while a window or the cursor moves.

  for (const f of list) {
    const [ra, de] = f.geometry.coordinates, [px, py, alt] = P(ra, de);

    x.fillStyle = GOLD + '.7)'; x.font = `600 11px ${SERIF}`; x.textAlign = 'center'; x.textBaseline = 'middle';
    [['N', 0, -1], ['S', 0, 1], ['E', -1, 0], ['W', 1, 0]].forEach(([t, dx, dy]) => { x.fillText(t, rx + dx * 44, ry + dy * 44); x.beginPath(); x.moveTo(rx + dx * 30, ry + dy * 30); x.lineTo(rx + dx * 36, ry + dy * 36); x.stroke(); }); }

  x.strokeStyle = GOLD + '.55)'; x.lineWidth = .9; x.strokeRect(tx - 150, ty - 40, 300, 80); x.strokeRect(tx - 145, ty - 35, 290, 70);
  x.fillStyle = GOLD + '.85)'; x.font = `600 15px ${SERIF}`; x.textAlign = 'center'; x.textBaseline = 'middle';
  const title = 'CAELUM HODIERNUM'; let tw = -2.5; for (const ch of title) tw += x.measureText(ch).width + 2.5; let px2 = tx - tw / 2;

  const deg = (v, p, n) => `${Math.abs(v).toFixed(1)}°${v >= 0 ? p : n}`;
  x.font = `italic 11px ${SERIF}`; x.fillStyle = GOLD + '.65)';
  x.fillText(`${SITE.name} · ${deg(SITE.lat, 'N', 'S')} ${deg(SITE.lon, 'E', 'W')}`, tx, ty + 6); x.fillText(when, tx, ty + 22);

}

// the cartouche hangs in whichever corner no black hole is near (it would be lensed to pieces)
function cartoucheSpot(list = cur.filter(c => c.alive)) {
  const spots = [[W - 175, H - 68], [175, H - 68], [W - 175, 92]];   // the top spot clears the menu bar
  const near = ([tx, ty]) => list.some(c => tx + 150 + 150 > c.tx && tx - 150 - 150 < c.tx + c.tw && ty + 40 + 150 > c.ty && ty - 40 - 150 < c.ty + c.th);

let cartAt = null, cartT = null;
/* ---------- windows → black holes (eased like everything else) ---------- */
let cur = [], liveUntil = 0;
function setTargets(list) {

    for (const c of cur) { if (used.has(c) || c.owner !== t.owner) continue; const d = Math.hypot(c.tx + c.tw / 2 - t.x - t.w / 2, c.ty + c.th / 2 - t.y - t.h / 2); if (d < bd) { bd = d; best = c; } }
    if (best) { used.add(best); Object.assign(best, { tx: t.x, ty: t.y, tw: t.w, th: t.h, alive: true }); }
    else { const c = { x: t.x, y: t.y, w: t.w, h: t.h, tx: t.x, ty: t.y, tw: t.w, th: t.h, owner: t.owner, life: 0, alive: true }; cur.push(c); used.add(c); }

// the cursor's own little black hole: exactly at the pointer, fading in and out with it
let curs = { x: -999, y: -999, a: 0, target: 0, lastMove: 0 };

/* ---------- the lensing pass ---------- */
const gl = cv.getContext('webgl2', { antialias: false });

uniform sampler2D uSky, uSkyB; uniform float uSkyMix; uniform vec4 uWin[16]; uniform float uLife[16]; uniform int uN; uniform vec2 uRes; uniform float uK;

  // ring (stars smeared into tangential arcs); inside it, light from behind wraps round into view.

const U = {}; for (const k of ['uSky', 'uSkyB', 'uSkyMix', 'uWin', 'uLife', 'uN', 'uRes', 'uK', 'uCur']) U[k] = gl.getUniformLocation(LENS, k);

}
const wf = new Float32Array(64), lf = new Float32Array(16);
function render() {

/* ---------- shooting stars, now and then, where the sky is clear ---------- */
function shootingStar() {
  setTimeout(shootingStar, 25000 + Math.random() * 45000);
  if (paused) return;
  for (let tries = 0; tries < 20; tries++) {
    const x = Math.random() * W * .8 + W * .1, y = Math.random() * H * .5 + 30, a = .35 + Math.random() * .5, len = 160 + Math.random() * 160;
    if (cur.some(w => x > w.x - 200 && x < w.x + w.w + 200 && y > w.y - 200 && y < w.y + w.h + 200)) continue;
    const el = document.createElement('div'); el.className = 'shoot'; el.style.width = `${len}px`; document.body.appendChild(el);

      { transform: `translate(${x + Math.cos(a) * 260}px,${y + Math.sin(a) * 260}px) rotate(${a}rad) scaleX(1)`, opacity: 0 }], { duration: 1100, easing: 'cubic-bezier(.3,0,.4,1)' });

/* ---------- loop: only while a black hole is moving, growing or fading ---------- */
let running = false, lastT = 0, dirty = false;

function loop0(now) {

  const moving = stepWins(dt);

  curs.target = curs.here ? 1 : 0;                   // stays while the pointer is on this screen, even when still
  const da = curs.target - curs.a, fading = Math.abs(da) > .002;
  if (fading) curs.a += da * (1 - Math.exp(-dt * (curs.target ? 6 : 1.5))); else curs.a = curs.target;
  const skyFading = now - skyFadeT0 < SKY_FADE_MS;
  if (skyFading) { const u = (now - skyFadeT0) / SKY_FADE_MS; skyMix = u * u * (3 - 2 * u); }
  else if (skyMix > 0) { [skyTex, skyTexB] = [skyTexB, skyTex]; skyMix = 0; dirty = true;
    gl.bindTexture(gl.TEXTURE_2D, skyTexB); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4)); }   // the old sky goes (~32 MB)
  if (moving || fading || dirty || skyFading) render();

/* ---------- boot + host protocol ---------- */
function build() { W = innerWidth; H = innerHeight; cv.width = Math.round(W * K); cv.height = Math.round(H * K); uploadSky(paintSky(), false); render(); }
loadSky().then(() => { const t0 = performance.now(); const c = paintSky(); fieldMs = Math.round(performance.now() - t0); uploadSky(c, true); }).catch(e => { try { webkit.messageHandlers.host.postMessage('JSERR sky data ' + e); } catch (_) {} });
// the sky turns: repaint for the new minute and cross-fade (≈0.25° of rotation per minute)
setTimeout(function tickMinute() { if (!paused && SKY) uploadSky(paintSky(), true); setTimeout(tickMinute, 60000 - Date.now() % 60000 + 50); }, 60000 - Date.now() % 60000 + 50);

  if (m.t === 'cursor') { curs.x = m.x / K; curs.y = m.y / K; curs.here = true; curs.lastMove = performance.now(); dirty = true; wake(); return; }
  if (m.t === 'cursorOff') { curs.here = false; wake(); return; }        // the pointer went to another screen

  if (m.t === 'windows') { if (m.live) liveUntil = performance.now() + 250;
    setTargets(m.r.map(([l, t, r, b], i) => ({ x: l / K, y: t / K, w: (r - l) / K, h: (b - t) / K, owner: (m.n || [])[i], sm: !!(m.sm && m.sm[i]) }))

else { handle({ t: 'windows', r: [[W * .35 * K, H * .3 * K, W * .7 * K, H * .66 * K]], n: ['Slack'] }); addEventListener('mousemove', e => handle({ t: 'cursor', x: e.clientX * K, y: e.clientY * K })); }
