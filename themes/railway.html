<!doctype html>
<!--
  Model Railway — a Tidewall theme. Your desktop is a toy railway diorama: soft green baseboard in a timber frame,
  hills built up in layers like cut foam (grass, then rock, then snow on the peaks), a sunken river with sandy banks,
  fields, forests and farms. Your windows are towns: a road round each (little cars drive it), two rows of toy houses.

  The railway is one network. The main line runs round the board in easy curves, through tunnels where the ground rises
  and over red girder bridges at the river. Towns beside it get a station with a passing loop (the express stops at the
  platform while the freight takes the loop and overtakes; the switches and their lamps change for it). Towns out in
  the country get a branch line that leaves the main line at a junction and runs to a terminus by the town, worked by a
  little push-pull shuttle. Rest your cursor beside any line and a signal stops the next train.

  Cheap by design: the board is one picture, redrawn only when something on it changes; while windows move it is
  redrawn a few times a second and each new picture blends over the last (no per-frame rebuilds). Trains, cars, boats,
  steam and the balloon are small pictures the compositor slides around. Buildings and trees are generated toy-model
  renders (see THIRD_PARTY_NOTICES.md).
-->

<title>Model Railway</title>

  .sprite { position: fixed; left: 0; top: 0; pointer-events: none; will-change: transform; z-index: 2; }
  .puff { position: fixed; left: 0; top: 0; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; border-radius: 50%; pointer-events: none; z-index: 3; opacity: 0;
    background: radial-gradient(circle at 38% 34%, #fff 0%, #f6f6f3 38%, #dcdcd6 64%, rgba(215,215,208,0) 71%);
    animation: puff 2.3s cubic-bezier(.2,.7,.3,1) forwards; }
  .xl { position: fixed; left: 0; top: 0; width: 3.4px; height: 3.4px; margin: -1.7px 0 0 -1.7px; border-radius: 50%; pointer-events: none; z-index: 3; background: #ff4b3a; box-shadow: 0 0 4px 1.5px rgba(255,75,58,.7); opacity: 0; transition: opacity .3s; }

  .xl.on.b { animation-delay: .45s; }
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: .08; } }
  /* (a puff starts half see-through: at full white it sat on the chimney like a ball) */
  @keyframes puff { from { opacity: .58; transform: translate(var(--x0), var(--y0)) scale(.45); } to { opacity: 0; transform: translate(var(--x1), var(--y1)) scale(2.2); } }
</style>

  if (Span.leader()) { stepTrains(dt, false); stepRoadCars(dt); stepBoats(dt); stepBalloon(dt, now); sendMovers(now); }   // one world: one page runs them
  else applyMovers();
  stepCrossings(); stepCars(dt); stepSignal();
  requestAnimationFrame(loop);
}

/* ======================= boot + host protocol ======================= */
let lastWinMsg = null, frameDT = 1 / 30, settleRoads = 0;
const dragging = () => !!(lastWinMsg && lastWinMsg.live);               // frameDT: the real frame time (steam puffs used a fixed 1/30 s, so their rate followed the frame rate)
function build() { SW = innerWidth; SH = innerHeight; W = Span.uw; H = Span.uh; OX = Span.x; OY = Span.y; K = devicePixelRatio;
  cv.width = Math.round(SW * K); cv.height = Math.round(SH * K); prep(); clearMovers(); buildStatic(); first = true; dirty = true; wake();
  if (lastWinMsg) handle(lastWinMsg); }                                // the screen's scale may have changed
let deskKey = '', deskIc = [], deskIcR = [], dKey = '';
const handle = m => {
  if (m.t === 'pause') { paused = !!m.v; Span.paused(paused); if (!paused) wake(); return; }
  if (m.t === 'desk') { const k = [m.i, m.n, m.w, m.h, m.x, m.y, JSON.stringify(m.fr || [])].join('|'); if (k === deskKey) return; deskKey = k;
    Span.desk(m); SEED = Span.world ? 7 : m.i | 0;                     // one world: every page the same seed (it lays out the same board)
    VIS.clear(); visOf = [null, null, null]; lastKey = ''; build(); return; }
  if (m.t === 'cursor') { const x = m.x / K + OX, y = m.y / K + OY; curAt(x, y, -1); Span.post('cur', { x, y }); return; }
  if (m.t === 'cursorOff') { if (curFrom === -1) { cur.on = false; Span.post('curoff', {}); } return; }
  if (m.t === 'dicons') { const k = devicePixelRatio, key = JSON.stringify([m.r, m.c, OX, OY]); if (key === dKey) return; dKey = key;   // your desktop icons, cluster by cluster (the same again: nothing to do)
    deskIc = (m.c || []).map(([l, t, r, b]) => ({ x: l / k + OX, y: t / k + OY, w: (r - l) / k, h: (b - t) / k, owner: '__icons' }));
    deskIcR = (m.r || []).map(([l, t, r, b]) => [l / k + OX, t / k + OY, r / k + OX, b / k + OY]);   // each icon, for the shape of its green
    dirty = true; wake();                                               // (the green's shape can change while the clusters don't)
    if (lastWinMsg) handle(lastWinMsg); return; }
  if (m.t === 'windows') { lastWinMsg = m; const K = devicePixelRatio;
    const list = m.r.map(([l, t, r, b], i) => ({ x: l / K + OX, y: t / K + OY, w: (r - l) / K, h: (b - t) / K, owner: (m.n || [])[i] || '?', sm: !!(m.sm && m.sm[i]) }));
    if (Span.world) {                                                  // what no display shows, and each lower display's menu bar
      for (const g of Span.gaps()) list.push({ x: g.x, y: g.y, w: g.w, h: g.h, owner: '__gap' });
      for (const F of Span.frames()) if (F[1] > 1) list.push({ x: F[0], y: F[1], w: F[2], h: MENU, owner: '__gap' });
    }
    for (const d of deskIc) list.push(d);
    setTargets(list); }
};
build();
let rz = null; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { lastKey = ''; build(); }, 200); });
window.__dbg = () => `worst=${(worst * 1000) | 0}ms slow=${slow}${JSON.stringify(SL)} ${(worst = 0, slow = 0, SL = {}, '')}job=${roadJob ? roadJob.k + '/' + roadJob.edges.length : '-'} vil=${villages.length} roads=${roads.length} xings=${crossings.length}${crossings.filter(c => c.down).length ? '(' + crossings.filter(c => c.down).length + ' down)' : ''} rcars=${rcars.length} TM=${TM} brd=${BRD.slice(-6).join(',')} nLand=${nLand} nDraw=${nDraw} main=${mainL ? (mainL.len | 0) + 't' + Math.round(100 * mainL.tun.filter(Boolean).length / mainL.pts.length) : '-'} br=${branches.map(b => (b.len | 0)).join(',')} st=${stations.filter(s => s.ok).map(s => s.kind[0]).join('')} scen=${scen.filter(o => o.ok).length}/${scen.length} marks=${scen.filter(o => o.ok && o.id[0] === 'm').length} fields=${fields.filter(f => f.ok).length} cars=${[...cars.values()].reduce((a, l) => a + l.length, 0)} trains=${trains.map(t => `${t.spec.kind[0]}@${t.s | 0}v${t.v.toFixed(0)}`).join(' ')} land=${landMs.toFixed(1)} draw=${fieldMs.toFixed(1)}`;
window.__balloon = () => { nextBalloon = 0; };
const host = window.chrome && window.chrome.webview;
if (host) { host.addEventListener('message', ev => handle(JSON.parse(ev.data))); host.postMessage('ready'); }
else { handle({ t: 'windows', r: [[W * .3 * K, H * .3 * K, W * .62 * K, H * .66 * K]], n: ['Slack'] }); addEventListener('mousemove', e => handle({ t: 'cursor', x: e.clientX * K, y: e.clientY * K })); }
