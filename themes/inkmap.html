<!doctype html>
<!--
  Ink Map — a Driftland theme. Pen-and-ink archipelago on parchment: your windows are islands.
  Land field adapted from Deskland's Beach theme (flat.html, GPL-3.0, github.com/BLEZZ0102/Deskland).
  Perf model: the full-screen map is rendered ONLY when the land changes (morph / drag / resize).
  Everything that moves (ship, serpent, footprints) is a small compositor layer moved by transform.
-->
<html>
<head>
<meta charset="utf-8">
<title>Ink Map</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #efe4cc; }
  #map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .sprite { position: fixed; left: 0; top: 0; will-change: transform; pointer-events: none; }
  #compass { transition: opacity 1.2s ease; }
  .step { position: fixed; left: 0; top: 0; pointer-events: none; animation: stepfade 5s ease-in forwards; }
  .labels { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; transition: opacity 1.4s cubic-bezier(.4, 0, .2, 1); }
  .wake { position: fixed; left: 0; top: 0; pointer-events: none; animation: wakefade 2.2s ease-out forwards; will-change: opacity, transform; }
  @keyframes wakefade { 0% { opacity: .75; } 100% { opacity: 0; } }
  @keyframes stepfade { 0% { opacity: 0; } 6% { opacity: .85; } 55% { opacity: .7; } 100% { opacity: 0; } }
</style>
<script src="companion.js"></script>
</head>
<body>
<canvas id="map"></canvas>
<canvas id="labelsA" class="labels" style="opacity:0"></canvas>
<canvas id="labelsB" class="labels" style="opacity:0"></canvas>
<script>
'use strict';
const INK = 'rgba(58,42,28,0.92)';
const P = { quality: 2, sigma: 70, warp: 30 };            // P.quality only for bench compatibility
const STEP = 6, MORPH_MS = 1500;
const cv = document.getElementById('map');
let W = innerWidth, H = innerHeight, Gw = 1, Gh = 1;
let icons = [], paused = false, fpsEMA = 0, fieldMs = 0;
window.__noMask = true;                                    // static map: nothing to save by masking

/* ---------- noise (JS side, for the field warp) ---------- */
const h2 = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
function vnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = h2(ix, iy), b = h2(ix + 1, iy), c = h2(ix, iy + 1), d = h2(ix + 1, iy + 1);
  return (a + (b - a) * ux) * (1 - uy) + (c + (d - c) * ux) * uy;
}
const fbm = (x, y, o) => { let v = 0, a = 0.5, f = 1; for (let i = 0; i < 4; i++) { v += a * vnoise(x * f + o * 17, y * f + o * 31); f *= 2; a *= 0.5; } return v; };

/* ---------- land field (signed distance-ish, px; <0 land, >0 sea) ---------- */
let NZ = null;
function buildNoise() {
  const N = Gw * Gh; NZ = { wx: new Float32Array(N), wy: new Float32Array(N) };
  for (let gy = 0; gy < Gh; gy++) for (let gx = 0; gx < Gw; gx++) {
    const i = gy * Gw + gx, x = gx * STEP, y = gy * STEP;
    NZ.wx[i] = fbm(x * 0.0035, y * 0.0035, 1) - 0.47 + 0.45 * (fbm(x * 0.017, y * 0.017, 3) - 0.47);
    NZ.wy[i] = fbm(x * 0.0035, y * 0.0035, 2) - 0.47 + 0.45 * (fbm(x * 0.017, y * 0.017, 4) - 0.47);
  }
}
function computeField(rects) {
  const t0 = performance.now();
  const N = Gw * Gh, f1 = new Float32Array(N);
  const sig = P.sigma, is1 = 1 / (sig * sig), wa = P.warp * 2.2, wmax = wa * 0.5;
  for (const r of rects) {
    const R = 5.5 * sig + Math.max(r.hw, r.hh) * 0.5 + wmax;
    const gx0 = Math.max(0, Math.floor((r.cx - R) / STEP)), gx1 = Math.min(Gw - 1, Math.ceil((r.cx + R) / STEP));
    const gy0 = Math.max(0, Math.floor((r.cy - R) / STEP)), gy1 = Math.min(Gh - 1, Math.ceil((r.cy + R) / STEP));
    // coast (f = 0.35) lands on the rect edge: core = rect shrunk by σ·√(−ln 0.35)
    const chw = Math.max(r.hw - 1.025 * sig, 0), chh = Math.max(r.hh - 1.025 * sig, 0), wgt = r.w || 1;
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
      const i = gy * Gw + gx;
      const qx = gx * STEP + NZ.wx[i] * wa, qy = gy * STEP + NZ.wy[i] * wa;
      let dx = Math.abs(qx - r.cx) - chw, dy = Math.abs(qy - r.cy) - chh;
      if (dx < 0) dx = 0; if (dy < 0) dy = 0;
      f1[i] += wgt * Math.exp(-(dx * dx + dy * dy) * is1);
    }
  }
  const c0 = Math.sqrt(-Math.log(0.35)), s = new Float32Array(N), fMin = Math.exp(-30);
  for (let i = 0; i < N; i++) {
    const g = Math.log(Math.max(f1[i], fMin));
    s[i] = sig * (Math.sqrt(Math.max(-g, 0)) - c0) - sig * 0.6 * Math.max(g, 0);
  }
  fieldMs = performance.now() - t0;
  return { s };
}
function sampleS(F, x, y) {
  if (!F) return 999;
  const fx = Math.min(Math.max(x / STEP, 0), Gw - 1.001), fy = Math.min(Math.max(y / STEP, 0), Gh - 1.001);
  const ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy, i = iy * Gw + ix, a = F.s;
  return (a[i] * (1 - tx) + a[i + 1] * tx) * (1 - ty) + (a[i + Gw] * (1 - tx) + a[i + Gw + 1] * tx) * ty;
}

/* ---------- WebGL: the map itself ---------- */
const gl = cv.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
const VS = `#version 300 es
void main() { vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;
const FS = `#version 300 es
precision highp float;
uniform sampler2D uA, uB; uniform float uMix, uScale, uH, uStep; uniform vec2 uGrid, uCompass;
uniform vec4 uTowns[16]; uniform int uNT;          // x, y, fade, seed
out vec4 o;
float h12(vec2 p) { vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
vec2 h22(vec2 p) { return vec2(h12(p), h12(p + 19.19)); }
float vn(vec2 p) { vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(h12(i), h12(i + vec2(1, 0)), u.x), mix(h12(i + vec2(0, 1)), h12(i + vec2(1, 1)), u.x), u.y); }
float fbm(vec2 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { v += a * vn(p); p = p * 2.03 + 7.1; a *= 0.5; } return v; }
float S(vec2 p) { vec2 uv = (p / uStep + 0.5) / uGrid; return mix(texture(uA, uv).r, texture(uB, uv).r, uMix); }
float seg(vec2 p, vec2 a, vec2 b) { vec2 pa = p - a, ba = b - a; return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0)); }
float aa;                                     // ~1 output pixel in CSS px
float line(float d, float w) { return 1.0 - smoothstep(w - aa * 0.5, w + aa * 0.5, d); }

// little glyphs in local coords (y down)
float wave(vec2 q) {                          // two stacked tilde strokes
  float k = 0.0;
  for (int i = 0; i < 2; i++) {
    vec2 r = q - vec2(float(i) * 5.0, float(i) * 5.5);
    float d = abs(r.y - 2.0 * sin(r.x * 0.45)) * 0.85;
    k = max(k, line(d, 0.55) * smoothstep(9.5, 6.0, abs(r.x)));
  }
  return k;
}
float peak(vec2 q, float s) {                 // ^ mountain with hatched right flank
  vec2 a = vec2(-8.0, 5.0) * s, b = vec2(0.0, -7.0) * s, c = vec2(8.0, 5.0) * s;
  float k = line(min(seg(q, a, b), seg(q, b, c)), 0.6);
  // hatching on the right flank
  if (q.x > 0.0 && q.y > b.y && q.y < c.y) {
    float edge = mix(b.x, c.x, (q.y - b.y) / (c.y - b.y));
    if (q.x < edge - 0.8) k = max(k, line(abs(fract((q.x + q.y) * 0.32) - 0.5) * 3.1, 0.45) * 0.8);
  }
  return k;
}
float hill(vec2 q) { float d = abs(length(q - vec2(0, 3)) - 6.0); return q.y < 3.0 ? line(d, 0.55) : 0.0; }
float pine(vec2 q) {
  return line(min(min(seg(q, vec2(-4, 3), vec2(0, -7)), seg(q, vec2(0, -7), vec2(4, 3))),
             min(seg(q, vec2(-4, 3), vec2(4, 3)), seg(q, vec2(0, 3), vec2(0, 6)))), 0.55);
}
float house(vec2 q) {
  float b = min(min(seg(q, vec2(-4, 0), vec2(-4, 5)), seg(q, vec2(4, 0), vec2(4, 5))), seg(q, vec2(-4, 5), vec2(4, 5)));
  float r = min(seg(q, vec2(-5, 0.5), vec2(0, -4)), seg(q, vec2(0, -4), vec2(5, 0.5)));
  return line(min(b, r), 0.55);
}
float roundTree(vec2 q) {                     // a round canopy on a short trunk, shaded on the right
  float r = length(q - vec2(0.0, -2.6));
  float k = max(line(abs(r - 3.3), 0.5), line(seg(q, vec2(0.0, 0.8), vec2(0.0, 4.2)), 0.5));
  if (r < 2.9 && q.x > 0.4) k = max(k, line(abs(fract((q.x + q.y) * 0.65) - 0.5) * 1.5, 0.3) * 0.7);
  return k;
}
float church(vec2 q) {                        // a house with a spire and a little cross
  float k = house(q);
  k = max(k, line(min(seg(q, vec2(-1.6, -3.4), vec2(0.0, -11.0)), seg(q, vec2(0.0, -11.0), vec2(1.6, -3.4))), 0.5));
  k = max(k, line(min(seg(q, vec2(0.0, -11.0), vec2(0.0, -14.0)), seg(q, vec2(-1.3, -12.8), vec2(1.3, -12.8))), 0.45));
  return k;
}
float field(vec2 q, float a) {                 // a ploughed field: outline + furrows
  float c = cos(a), sn = sin(a); q = vec2(c * q.x - sn * q.y, sn * q.x + c * q.y);
  vec2 b = abs(q) - vec2(8.0, 5.0);
  float k = line(abs(max(b.x, b.y)), 0.42);
  if (b.x < 0.0 && b.y < 0.0) k = max(k, line(abs(fract(q.y * 0.45) - 0.5) * 2.2, 0.28) * 0.75);
  return k;
}
float lighthouse(vec2 q) {                     // a tapered tower, a lamp and its beams
  float k = line(min(min(seg(q, vec2(-2.6, 4.0), vec2(-1.4, -6.0)), seg(q, vec2(2.6, 4.0), vec2(1.4, -6.0))), seg(q, vec2(-3.4, 4.0), vec2(3.4, 4.0))), 0.5);
  k = max(k, line(abs(length(q - vec2(0.0, -7.6)) - 1.6), 0.45));
  if (q.y > -3.2 && q.y < -1.6 && abs(q.x) < 2.0) k = max(k, 0.8);
  vec2 c = vec2(0.0, -7.6);
  for (int i = 0; i < 3; i++) { float a = -0.45 + float(i) * 0.45; vec2 d = vec2(cos(a), sin(a));
    k = max(k, line(seg(q, c + d * 2.8, c + d * 6.5), 0.32) * 0.8);
    k = max(k, line(seg(q, c + vec2(-d.x, d.y) * 2.8, c + vec2(-d.x, d.y) * 6.5), 0.32) * 0.8); }
  return k;
}

void main() {
  vec2 p = vec2(gl_FragCoord.x, uH * uScale - gl_FragCoord.y) / uScale;  // CSS px, y down
  aa = 1.0 / uScale;
  vec2 pw = p + 1.4 * vec2(vn(p * 0.06) - 0.5, vn(p * 0.06 + 9.0) - 0.5);   // hand-drawn wobble
  float s = S(pw);
  vec2 g = vec2(S(pw + vec2(2, 0)) - S(pw - vec2(2, 0)), S(pw + vec2(0, 2)) - S(pw - vec2(0, 2)));
  vec2 n = g / max(length(g), 1e-4);         // points out to sea

  // parchment
  float st = fbm(p * 0.0022), st2 = fbm(p * 0.011 + 3.0);
  vec3 paper = mix(vec3(0.945, 0.902, 0.800), vec3(0.835, 0.745, 0.585), smoothstep(0.35, 0.85, st) * 0.75);
  paper *= 0.97 + 0.05 * st2;
  paper -= 0.025 * h12(floor(p * 1.5));      // fibre grain
  vec2 vc = p / vec2(uGrid * uStep) - 0.5; paper *= 1.0 - 0.28 * smoothstep(0.25, 0.75, length(vc * vec2(1.0, 1.25)));
  if (s < 0.0) paper = mix(paper, paper * vec3(1.02, 1.0, 0.95), 0.6);

  float ink = 0.0;
  // coastline: bold line + inner shadow line + hatching on the lee (south-east) side
  ink = max(ink, line(abs(s), 1.25));
  ink = max(ink, line(abs(s + 4.5), 0.5) * 0.85);
  float lee = smoothstep(0.1, 0.7, dot(-n, normalize(vec2(-1.0, -1.0))));
  if (s < -5.5 && s > -13.0) ink = max(ink, lee * line(abs(fract((p.x - p.y) * 0.28) - 0.5) * 3.6, 0.42) * smoothstep(-13.0, -7.0, s));
  // ripple rings around the coast: dotted then dashed
  float dots = step(0.55, vn(p * 0.55));
  ink = max(ink, line(abs(s - 11.0), 0.6) * dots * 0.8);
  float dash = step(0.45, fract(dot(p, vec2(-n.y, n.x)) * 0.09));
  ink = max(ink, line(abs(s - 22.0), 0.45) * dash * 0.55);

  // rocks in the shallows
  vec2 rc = floor(p / 13.0), rq = p - (rc + 0.5) * 13.0 - (h22(rc) - 0.5) * 6.0;
  float sr = S((rc + 0.5) * 13.0);
  if (sr > 9.0 && sr < 34.0 && h12(rc * 1.7) < 0.09) {
    float r = 1.6 + 2.0 * h12(rc + 4.0);
    ink = max(ink, line(abs(length(rq * vec2(1.0, 1.3)) - r), 0.5));
  }

  // sea: grid, rhumb lines from the compass, wave marks
  if (s > 4.0) {
    vec2 gq = abs(fract(p / 190.0 + 0.5) - 0.5) * 190.0;
    ink = max(ink, line(min(gq.x, gq.y), 0.35) * 0.32);
    vec2 cp = p - uCompass; float ang = atan(cp.y, cp.x);
    float sect = 3.14159265 / 8.0, da = abs(fract(ang / sect + 0.5) - 0.5) * sect;
    ink = max(ink, line(length(cp) * sin(da), 0.3) * 0.22 * step(70.0, length(cp)));
    vec2 wc = floor((p + vec2(0.0, 0.0)) / vec2(62.0, 40.0));
    vec2 wo = (wc + 0.5) * vec2(62.0, 40.0) + (h22(wc) - 0.5) * vec2(30.0, 16.0);
    if (h12(wc + 2.0) < 0.42 && S(wo) > 42.0) ink = max(ink, wave(p - wo) * 0.8);
  }
  // towns (placed by the page so they can fade): a church and its houses
  float nearTown = 1e9;
  for (int i = 0; i < 16; i++) {
    if (i >= uNT) break;
    vec4 T = uTowns[i]; vec2 d = p - T.xy; float dd = dot(d, d);
    if (T.z > 0.05) nearTown = min(nearTown, dd);
    if (dd > 1900.0 || T.z <= 0.0) continue;
    for (int j = 0; j < 7; j++) {
      float fj = float(j);
      vec2 off = j == 0 ? vec2(0.0) : (vec2(h12(vec2(T.w, fj)), h12(vec2(fj + 3.1, T.w))) - 0.5) * vec2(50.0, 32.0);
      ink = max(ink, (j == 0 ? church(p - T.xy - off) : house((p - T.xy - off) * 1.25)) * T.z);
    }
  }
  if (s < -8.0 && nearTown > 1500.0) {
    // mountain ranges: peaks packed along ridgelines, foothills on their flanks
    vec2 mc = floor(p / vec2(22.0, 17.0));
    vec2 mo = (mc + 0.5) * vec2(22.0, 17.0) + (h22(mc) - 0.5) * vec2(9.0, 6.0);
    float sm = S(mo), ridge = 1.0 - abs(vn(mo * 0.011 + 5.0) * 2.0 - 1.0);
    float mz = fbm(mo * 0.0042 + 23.0) + ridge * 0.18;
    bool range = mz > 0.74;
    if (sm < -22.0 && range && h12(mc * 1.7) < 0.88) ink = max(ink, peak(p - mo, 0.75 + 0.65 * ridge));
    else if (sm < -16.0 && mz > 0.66 && h12(mc * 2.3) < 0.45) ink = max(ink, hill(p - mo));
    if (!range) {
      // forests: dense stands of pines and round trees
      vec2 tc = floor(p / vec2(13.0, 11.0));
      vec2 to = (tc + 0.5) * vec2(13.0, 11.0) + (h22(tc + 9.0) - 0.5) * vec2(7.0, 5.0);
      float forest = fbm(to * 0.0055 + 11.0);
      if (S(to) < -13.0 && forest > 0.56 && h12(tc * 1.9) < smoothstep(0.56, 0.7, forest) * 0.92)
        ink = max(ink, h12(tc + 4.0) < fbm(to * 0.01 + 40.0) ? pine(p - to) : roundTree(p - to));
      else if (nearTown < 26000.0 && forest < 0.5 && mz < 0.62) {
        // farmland: a patchwork of fields around each town
        vec2 fc = floor(p / vec2(30.0, 24.0));
        vec2 fo = (fc + 0.5) * vec2(30.0, 24.0) + (h22(fc + 2.0) - 0.5) * vec2(8.0, 6.0);
        if (S(fo) < -16.0 && h12(fc * 3.1) < 0.62) ink = max(ink, field(p - fo, h12(fc + 8.0) * 0.5 - 0.25) * 0.72);
      }
    }
  }
  // lighthouses on headlands
  {
    vec2 lc = floor(p / 40.0); vec2 lo = (lc + 0.5) * 40.0 + (h22(lc + 5.0) - 0.5) * 20.0; float sl = S(lo);
    if (sl > -12.0 && sl < -5.0 && h12(lc * 7.7) < 0.04) ink = max(ink, lighthouse(p - lo));
  }

  vec3 inkc = vec3(0.23, 0.165, 0.11) * (0.9 + 0.2 * vn(p * 0.15));
  o = vec4(mix(paper, inkc, ink * (0.82 + 0.18 * st2)), 1.0);
}`;
function program(vs, fs) {
  const sh = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x);
    if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
  const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
const PR = program(VS, FS); gl.useProgram(PR);
const U = {}; for (const k of ['uA', 'uB', 'uMix', 'uScale', 'uH', 'uStep', 'uGrid', 'uCompass', 'uTowns', 'uNT']) U[k] = gl.getUniformLocation(PR, k);
const townBuf = new Float32Array(16 * 4);
gl.bindVertexArray(gl.createVertexArray());
const tex = [gl.createTexture(), gl.createTexture()];
function allocField() {
  for (const t of tex) {
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, Gw, Gh, 0, gl.RED, gl.FLOAT, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }
}
function uploadField(i, F) {
  gl.bindTexture(gl.TEXTURE_2D, tex[i]);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, Gw, Gh, gl.RED, gl.FLOAT, F.s);
}

/* ---------- morph state (same contract as the Deskland pages: commit / refresh / FB) ---------- */
let fromI = 0, toI = 0, morphT0 = -1e9, morphDur = MORPH_MS, FA = null, FB = null, mixNow = 1;
let ISLETS = [];
function seedIslets() {
  let z = 1337; const rnd = () => (z = (z * 16807) % 2147483647) / 2147483647;
  const n = Math.round(W * H / 52000); ISLETS = [];
  for (let i = 0; i < n; i++) {
    const big = rnd() < 0.18;
    ISLETS.push({ cx: rnd() * W, cy: rnd() * H, hw: big ? 30 + rnd() * 50 : 0, hh: big ? 20 + rnd() * 35 : 0, w: big ? 0.8 + rnd() * 0.3 : 0.37 + rnd() * 0.2 });
  }
}
const iconRects = () => icons.map(ic => ({ cx: ic.x + ic.w / 2, cy: ic.y + ic.h / 2, hw: ic.w / 2, hh: ic.h / 2 })).concat(ISLETS);
function commit(fromEmpty = false) {
  const nf = computeField(iconRects());
  const target = 1 - toI;
  if (fromEmpty) { FA = computeField([]); uploadField(toI, FA); }
  else if (FA && FB && FA !== FB && mixNow < 1 && FA.s.length === FB.s.length) {
    const s = new Float32Array(FB.s.length), a = FA.s, b = FB.s, m = mixNow;
    for (let i = 0; i < s.length; i++) s[i] = a[i] + (b[i] - a[i]) * m;
    FA = Object.assign({}, FB, { s }); uploadField(toI, FA);
  } else FA = FB;
  FB = nf; uploadField(target, FB);
  fromI = toI; toI = target; morphT0 = performance.now(); morphDur = fromEmpty ? 2200 : MORPH_MS; landMoved();
  layoutChanged(); wake();
}
function landMoved() { layoutDirty = true; lastLandChange = performance.now(); }
function refresh() {
  FA = FB = computeField(iconRects());
  uploadField(toI, FB); fromI = toI; morphT0 = -1e9; landMoved();

  const x = c.getContext('2d'); x.scale(k, k); x.strokeStyle = INK; x.lineWidth = .9; x.lineCap = 'round';
  x.beginPath(); x.moveTo(24, 8); x.quadraticCurveTo(12, 3, 2, 1); x.moveTo(24, 8); x.quadraticCurveTo(12, 13, 2, 15); x.stroke();
  x.lineWidth = .6; x.beginPath(); x.moveTo(16, 8); x.quadraticCurveTo(9, 6, 4, 5.5); x.moveTo(16, 8); x.quadraticCurveTo(9, 10, 4, 10.5); x.stroke();

let liveWake = 0;
function wakeMark(px, py, ang) {

  const img = document.createElement('img'); img.src = wakeImg; img.className = 'wake'; img.width = 26; img.height = 16;
  img.style.transform = `translate3d(${(px - 13).toFixed(1)}px,${(py - 8).toFixed(1)}px,0) rotate(${(ang * 57.2958).toFixed(1)}deg)`;

const B = { x: 0, y: 0, vx: 0, vy: 0, flip: 1, flipT: 1, tilt: 0, dist: 0, on: false };
const inkWake = DLWake('rgba(58,42,28,0.75)', 0.9, 1.8, 13);
let cursor = null;

function stepBoat(dt, t) {

  boat.style.transform = `translate3d(${(B.x - 30).toFixed(1)}px,${(B.y - 44 + bob).toFixed(1)}px,0) rotate(${B.tilt.toFixed(3)}rad) scaleX(${B.flip.toFixed(3)})`;
  if (sp > 30) inkWake.feed(B.x - B.vx / sp * 26, B.y - B.vy / sp * 26 + 4, Math.atan2(B.vy, B.vx), performance.now()); else inkWake.reset();

/* ---------- frame loop: only runs while something is due ---------- */
let rafOn = false, lastT = 0, needMap = true;

function renderMap() {

let layoutT = null;
function layoutChanged() { clearTimeout(layoutT); layoutT = setTimeout(() => { placeCompass(); }, 400); }

function resize() {
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * devicePixelRatio); cv.height = Math.round(H * devicePixelRatio);   // always native pixels
  Gw = Math.ceil(W / STEP) + 2; Gh = Math.ceil(H / STEP) + 2;

  FA = FB = null;
}
resize(); drawCompass();
addEventListener('resize', () => { resize(); commit(true); });

/* ---------- host protocol (Deskland-compatible + 'cursor') ---------- */
