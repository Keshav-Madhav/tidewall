<!doctype html>
<!--
  Snowfall — a Tidewall theme. A winter dusk; snow falls behind your windows and settles on their top
  edges, slumping into soft drifts. Move a window fast (or resize it) and the snow shakes off in clumps;
  close it and its drift is left behind to melt. Your cursor is warm: flakes swerve and melt near it, and it
  melts grooves into drifts. Backdrop drawn once; flakes, clumps and drifts in one small WebGL pass.
-->
<html>
<head>
<meta charset="utf-8">
<title>Snowfall</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b3a5c; }
  canvas.layer { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
</style>
</head>
<body>
<canvas id="bg" class="layer"></canvas>
<canvas id="gl" class="layer"></canvas>
<script>
'use strict';
window.__opaque = false; window.__noMask = true;
let W = innerWidth, H = innerHeight, K = devicePixelRatio, paused = false, fpsEMA = 0, fieldMs = 0;
const P = { quality: 2 };
const $ = id => document.getElementById(id), cv = $('bg');
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- 1. the winter dusk (drawn once) ---------- */
// the painted valley (generated for this theme): drawn to cover the screen, anchored to the bottom so the snowdrift
// along the foreground always meets the ground drift; the procedural scene below shows while it loads
// One painting per display, left to right: a triptych (lake | moonlit valley | frozen stream) whose seams fall behind
// the monitors' bezels. A single screen shows the centre panel.
const PAINT = new Image(); PAINT.decoding = 'async';

setTimeout(() => { if (!PAINT.src) showPanel(0, 1); }, 600);              // no word from the host about other screens
PAINT.onload = () => drawBackdrop();

    hg.addColorStop(0, 'rgba(200,205,235,0)'); hg.addColorStop(.5, `rgba(200,205,235,${.05 + i * .01})`); hg.addColorStop(1, 'rgba(200,205,235,0)'); x.fillStyle = hg; x.fillRect(0, hy - 60, W, 120); }

    x.fillStyle = 'rgba(232,238,252,.55)'; x.beginPath(); x.moveTo(px, py - h); x.lineTo(px + h * .1, py - h * .62); x.lineTo(px - h * .1, py - h * .62); x.closePath(); x.fill(); };

    x.lineTo(W, H); x.closePath(); const hg = x.createLinearGradient(0, H * (base - .16), 0, H);
    hg.addColorStop(0, cap); hg.addColorStop(.3, body); hg.addColorStop(1, li === 2 ? '#e3e8f6' : body); x.fillStyle = hg; x.fill();

    for (let px = 0; px < W; px += ph * .45 + R() * ph * .6) {
      if (fbm(px * .004 + li * 5, 9) < .48) continue;
      const ry = ridge(li, f, base, px) + R() * ph * 1.4; smallPine(px, ry + ph * .3, ph * (.7 + R() * .6), pineCol);
    }
  });

  const pine = (px, py, h) => { x.fillStyle = '#26325a'; x.beginPath(); x.moveTo(px, py - h);
    for (let t = 1; t <= 4; t++) { const yy = py - h + h * t / 4.4, ww = h * .13 * t; x.lineTo(px + ww, yy); x.lineTo(px + ww * .45, yy); } x.lineTo(px + 2, py); x.lineTo(px - 2, py);
    for (let t = 4; t >= 1; t--) { const yy = py - h + h * t / 4.4, ww = h * .13 * t; x.lineTo(px - ww * .45, yy); x.lineTo(px - ww, yy); } x.closePath(); x.fill();
    x.fillStyle = 'rgba(232,238,252,.85)'; for (let t = 1; t <= 4; t++) { const yy = py - h + h * t / 4.4, ww = h * .13 * t; x.beginPath(); x.ellipse(px - ww * .25, yy - 1.5, ww * .55, 1.6, -.1, 0, 7); x.fill(); } };
  for (let px = -10; px < W + 20; px += 10 + R() * 26) pine(px, H - 4 + R() * 10, 34 + R() * 60);
  x.fillStyle = '#e9eef9'; x.fillRect(0, H - 6, W, 6);
}

/* ---------- 2. windows: eased slots, each carrying its own drift ---------- */
const COL = 4;                                 // a depth sample every 4 px along the top edge

/* ---------- 4. WebGL: one pass for drifts, flakes and clumps ---------- */

  gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  if (bgTex) { gl.disable(gl.BLEND); gl.useProgram(BG); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, bgTex); gl.uniform1i(U(BG, 'uT'), 0);
    gl.bindVertexArray(bgVao); gl.drawArrays(gl.TRIANGLES, 0, 3); gl.enable(gl.BLEND); }
  // far flakes first (behind the drifts), then drifts, then near flakes and clumps
  const pts = (far) => { let n = 0; for (let i = 0; i < flakes.length; i++) { const f = flakes[i]; if ((f.layer === 0) !== far) continue;
      if (n * 4 + 4 > fArr.length) { const g = new Float32Array(fArr.length * 2); g.set(fArr); fArr = g; } const o = n * 4; fArr[o] = f.x; fArr[o + 1] = f.y; fArr[o + 2] = f.size; fArr[o + 3] = f.a; n++; } return n; };
  const drawPts = n => { if (!n) return; gl.useProgram(FLAKE); gl.uniform2f(U(FLAKE, 'uRes'), W, H); gl.uniform1f(U(FLAKE, 'uK'), K);
    gl.bindVertexArray(fVao); gl.bindBuffer(gl.ARRAY_BUFFER, fBuf); gl.bufferData(gl.ARRAY_BUFFER, fArr.subarray(0, n * 4), gl.DYNAMIC_DRAW); gl.drawArrays(gl.POINTS, 0, n); };
  drawPts(pts(true));
  // drifts: a triangle strip per profile (base at the edge, crest at the surface)
  let m = 0; const strips = [];
  const add = (cols, x0, y0) => { const start = m;
    for (let i = 0; i < cols.length; i++) { const px = x0 + i * COL, d = cols[i]; if (m * 3 + 6 > dArr.length) { const g = new Float32Array(dArr.length * 2); g.set(dArr); dArr = g; }
      const o = m * 3; dArr[o] = px; dArr[o + 1] = y0 + .5; dArr[o + 2] = 0; dArr[o + 3] = px; dArr[o + 4] = y0 - d - 1.2; dArr[o + 5] = d > .3 ? 1 : 0; m += 2; }   /* 1 at the crest: the shader feathers it */
    strips.push([start, m - start]); };
  for (const c of cur) if (c.cols.some(v => v > .2)) add(c.cols, c.x, c.y);
  for (const o of orphans) add(o.cols, o.x, o.y);
  add(ground, 0, H - 6);
  if (m) { gl.useProgram(DRIFT); gl.uniform2f(U(DRIFT, 'uRes'), W, H); gl.bindVertexArray(dVao); gl.bindBuffer(gl.ARRAY_BUFFER, dBuf); gl.bufferData(gl.ARRAY_BUFFER, dArr.subarray(0, m * 3), gl.DYNAMIC_DRAW);
    for (const [s, n] of strips) gl.drawArrays(gl.TRIANGLE_STRIP, s, n); }
  let n = pts(false);
  for (const c of clumps) { if (n * 4 + 4 > fArr.length) break; const o = n * 4; fArr[o] = c.x; fArr[o + 1] = c.y; fArr[o + 2] = c.s; fArr[o + 3] = .95; n++; }
  drawPts(n);
}

/* ---------- loop ---------- */
let running = false, lastT = 0;
function wake() { if (!running && !paused) { running = true; lastT = 0; requestAnimationFrame(loop); } }
function loop(now) { try { loop0(now); } catch (e) { try { webkit.messageHandlers.host.postMessage('JSERR loop ' + e.message + ' ' + (e.stack || '').split('\n')[0]); } catch (_) {} running = false; setTimeout(wake, 1000); } }
function loop0(now) {
  if (paused) { running = false; return; }
  if (lastT && now - lastT < 15.5) { requestAnimationFrame(loop); return; }      // 60 fps is plenty for falling snow
  const dt = lastT ? Math.min((now - lastT) / 1000, .05) : 1 / 60; lastT = now;
  if (lastT) fpsEMA = fpsEMA ? fpsEMA * .95 + .05 / dt : 1 / dt;
  stepWins(dt); stepSnow(dt, now); render();
  requestAnimationFrame(loop);
}

/* ---------- boot + host protocol ---------- */
function build() { W = innerWidth; H = innerHeight; $('gl').width = Math.round(W * K); $('gl').height = Math.round(H * K); drawBackdrop(); makeFlakes(); }
let FB = null; function commit() { } function refresh() { }
let lastWins = null, deskIc = [];
const handle = m => {
  if (m.t === 'desk') { showPanel(m.i, m.n); return; }
  if (m.t === 'pause') { paused = !!m.v; if (!paused) wake(); return; }
  if (m.t === 'cursor') { cursor = { x: m.x / K, y: m.y / K }; cursorT = performance.now(); return; }
  if (m.t === 'cursorOff') { cursor = null; return; }
  // Stage Manager draws its thumbnails tilted in 3D but reports flat rectangles: snow can't sit on them believably, so it falls behind
  if (m.t === 'dicons') {                                               // your desktop icons: snow settles in a little cap on each
    deskIc = (m.i || []).map(([l, t, r, b]) => ({ x: l / K, y: t / K, w: (r - l) / K, h: (b - t) / K, owner: '__icon', cap: 9 }));
    if (lastWins) handle(lastWins); else setTargets(deskIc); return; }
  if (m.t === 'windows') { lastWins = m; if (m.live) liveUntil = performance.now() + 250; setTargets(m.r.map(([l, t, r, b], i) => ({ x: l / K, y: t / K, w: (r - l) / K, h: (b - t) / K, owner: (m.n || [])[i] })).filter((_, i) => !(m.sm && m.sm[i])).concat(deskIc)); }
};
build(); wake();
let rz = null; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(build, 200); });
window.__dbg = () => `vis=${document.visibilityState} run=${running} paused=${paused} lastT=${lastT | 0} fps=${fpsEMA | 0} flakes=${flakes.length} clumps=${clumps.length} drifts=${cur.map(c => Math.max(...c.cols).toFixed(1)).join(',')} ground=${Math.max(...ground).toFixed(1)}`;
const host = window.chrome && window.chrome.webview;
if (host) { host.addEventListener('message', ev => handle(JSON.parse(ev.data))); host.postMessage('ready'); }
else { handle({ t: 'windows', r: [[W * .3 * K, H * .3 * K, W * .7 * K, H * .66 * K]], n: ['Slack'] }); addEventListener('mousemove', e => handle({ t: 'cursor', x: e.clientX * K, y: e.clientY * K })); }
</script>
