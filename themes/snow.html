<!doctype html>
<!--
  Snowfall — a Tidewall theme. A winter dusk; snow falls behind your windows and settles on their top
  edges, slumping into soft drifts. Move a window fast (or resize it) and the snow shakes off in clumps;
  close it and its drift is left behind to melt. Your cursor is warm: flakes swerve and melt near it, and it
  melts grooves into drifts. Backdrop drawn once; flakes, clumps and drifts in one small WebGL pass.
-->
<html>
<head>
<meta charset="utf-8">
<title>Snowfall</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b3a5c; }
  canvas.layer { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
</style>
</head>
<body>
<canvas id="bg" class="layer"></canvas>
<canvas id="gl" class="layer"></canvas>
<script>
'use strict';
window.__opaque = true;       // the backdrop covers every pixel (it's drawn into the GL scene before the first frame): the compositor copies, never blends
let W = innerWidth, H = innerHeight, K = devicePixelRatio, paused = false, fpsEMA = 0, fieldMs = 0;
const P = { quality: 2 };
const $ = id => document.getElementById(id), cv = $('bg');
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const h2 = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };

  const a = h2(ix, iy), b = h2(ix + 1, iy), c = h2(ix, iy + 1), d = h2(ix + 1, iy + 1); return (a + (b - a) * ux) * (1 - uy) + (c + (d - c) * ux) * uy; }

/* ---------- 1. the winter dusk (drawn once) ---------- */
// the painted valley (generated for this theme): drawn to cover the screen, anchored to the bottom so the snowdrift
// along the foreground always meets the ground drift; the procedural scene below shows while it loads
// One painting per display, left to right: a triptych (lake | moonlit valley | frozen stream) whose seams fall behind
// the monitors' bezels. A single screen shows the centre panel.
const PAINT = new Image(); PAINT.decoding = 'async';

const showPanel = (i, n) => { const src = `snow/${panelFor(i, n)}.jpg`; if (!PAINT.src.endsWith(src)) PAINT.src = src; };
setTimeout(() => { if (!PAINT.src) showPanel(0, 1); }, 600);              // no word from the host about other screens
PAINT.onload = () => { drawBackdrop(); findMoon(); };
// the backdrop is painted once into a 2D canvas, then handed to WebGL as a texture and the canvas freed: one layer, not two
function drawBackdrop() { paintBackdrop(); backdropToGL(); }
function paintBackdrop() {

    const x = cv.getContext('2d'), iw = PAINT.naturalWidth, ih = PAINT.naturalHeight, s = Math.max(cv.width / iw, cv.height / ih);
    x.imageSmoothingQuality = 'high'; x.drawImage(PAINT, (cv.width - iw * s) / 2, cv.height - ih * s, iw * s, ih * s);
    x.setTransform(K, 0, 0, K, 0, 0); if (/snow\/backdrop\.jpg$/.test(PAINT.src)) snowman(x); return;   // (one snowman: in the valley panel only)
  }
  cv.width = Math.round(W * K); cv.height = Math.round(H * K);

  x.fillStyle = sky; x.fillRect(0, 0, W, H);
  for (let i = 0; i < W * H / 2600; i++) { const sy = R() * H * .45; x.fillStyle = `rgba(235,240,255,${(.15 + R() * .5) * (1 - sy / (H * .45))})`; x.fillRect(R() * W, sy, .9, .9); }

  const mx = W * .78, my = H * .17, g = x.createRadialGradient(mx, my, 0, mx, my, 140);
  g.addColorStop(0, 'rgba(255,248,230,.35)'); g.addColorStop(.18, 'rgba(255,248,230,.12)'); g.addColorStop(1, 'rgba(255,248,230,0)');
  x.fillStyle = g; x.fillRect(mx - 140, my - 140, 280, 280); x.fillStyle = 'rgba(250,246,232,.92)'; x.beginPath(); x.arc(mx, my, 17, 0, 7); x.fill();

    hg.addColorStop(0, 'rgba(200,205,235,0)'); hg.addColorStop(.5, `rgba(200,205,235,${.05 + i * .01})`); hg.addColorStop(1, 'rgba(200,205,235,0)'); x.fillStyle = hg; x.fillRect(0, hy - 60, W, 120); }

  const layers = [[.62, '#9aa3c6', '#d3d8ee', .0016, '#7c86ad', 9], [.71, '#8892bb', '#cbd1ea', .0022, '#5f6a96', 15], [.8, '#9aa3c9', '#d8ddf0', .003, '#404c7a', 24]];

  const smallPine = (px, py, h, col) => { x.fillStyle = col; x.beginPath(); x.moveTo(px, py - h); x.lineTo(px + h * .32, py); x.lineTo(px - h * .32, py); x.closePath(); x.fill();

  layers.forEach(([base, body, cap, f, pineCol, ph], li) => {
    x.beginPath(); x.moveTo(0, H);
    for (let px = 0; px <= W; px += 6) x.lineTo(px, ridge(li, f, base, px));
    x.lineTo(W, H); x.closePath(); const hg = x.createLinearGradient(0, H * (base - .16), 0, H);
    hg.addColorStop(0, cap); hg.addColorStop(.3, body); hg.addColorStop(1, li === 2 ? '#e3e8f6' : body); x.fillStyle = hg; x.fill();

    }

    for (let t = 1; t <= 4; t++) { const yy = py - h + h * t / 4.4, ww = h * .13 * t; x.lineTo(px + ww, yy); x.lineTo(px + ww * .45, yy); } x.lineTo(px + 2, py); x.lineTo(px - 2, py);
    for (let t = 4; t >= 1; t--) { const yy = py - h + h * t / 4.4, ww = h * .13 * t; x.lineTo(px - ww * .45, yy); x.lineTo(px - ww, yy); } x.closePath(); x.fill();
    x.fillStyle = 'rgba(232,238,252,.85)'; for (let t = 1; t <= 4; t++) { const yy = py - h + h * t / 4.4, ww = h * .13 * t; x.beginPath(); x.ellipse(px - ww * .25, yy - 1.5, ww * .55, 1.6, -.1, 0, 7); x.fill(); } };
  for (let px = -10; px < W + 20; px += 10 + R() * 26) pine(px, H - 4 + R() * 10, 34 + R() * 60);

// a snowman in the foreground snow (painted once with the backdrop: nothing per frame). Moonlit from the upper right in
// the painting's own palette; a cranberry scarf is the one bit of colour. Its feet sink into the ground drift.
function snowman(x) {
  const h = Math.max(46, Math.min(96, H * .085)), cx = W * .23, base = Math.min(H, GY ?? H) - 12;   // (standing on the bank, above the Dock)
  x.save(); x.filter = 'blur(.45px)'; x.globalAlpha = .93;                 // painted softness, not a sticker
  const ball = (cy, r) => {
    const g = x.createRadialGradient(cx + r * .35, cy - r * .4, r * .1, cx, cy, r * 1.05);
    g.addColorStop(0, '#e8ebf8'); g.addColorStop(.5, '#cdd2ea'); g.addColorStop(.82, '#9da4c9'); g.addColorStop(1, '#7d84ae');
    x.fillStyle = g; x.beginPath(); x.ellipse(cx, cy, r, r * .94, 0, 0, 7); x.fill(); };

  sh.addColorStop(0, 'rgba(70,78,120,.35)'); sh.addColorStop(1, 'rgba(70,78,120,0)');

/* ---------- the Christmas season: now and then, a sleigh across the moon ---------- */
// Mid-November to Epiphany only, and rarely (the first a minute and a half in, then every ten to twenty minutes): a
// small silhouette, Santa's sleigh and four reindeer, crossing in front of the moon. Its own little canvas exists only
// while it flies.

function stepSleigh(now) {

  x.lineWidth = .7 * k; x.beginPath(); x.moveTo(-13 * k, -10 * k); x.lineTo(30 * k, -5 * k); x.stroke();

/* ---------- 2. windows: eased slots, each carrying its own drift ---------- */

// "area"), not the screen's edge behind them
let GY = null; const GB = () => Math.min(H, GY ?? H) - 6;
let gWant = null;
function stepWins(dt) {

/* ---------- 3. snow: flakes, clumps, drifts ---------- */
