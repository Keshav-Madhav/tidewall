<!doctype html>
<!--
  Garden Plan — a Tidewall theme. Your desktop is a landscape architect's planting plan, drawn in ink and watercolour:
  every window sits in a flowerbed edged with clipped box hedge and ringed by a gravel walk; walks join the beds; a
  pond sits in the widest lawn; trees fill whatever room is left, each as big as the space allows.

  The Ink Map recipe: the plan is ONE shader picture, drawn only while something in the layout is changing (windows
  ease to their new places, so beds, walks and trees grow, shrink and slide — nothing pops). The rest of the time the
  GPU does nothing at all. What lives in the garden (a gardener with a wheelbarrow, a few robins) are small pre-drawn
  pictures that the compositor slides around.
-->
<html>
<head>
<meta charset="utf-8">
<title>Garden Plan</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ece6d6; }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .sprite { position: fixed; left: 0; top: 0; pointer-events: none; will-change: transform; }
  .bird { transition: transform .22s cubic-bezier(.3,.7,.4,1), opacity .6s ease; }
  .bird.fly { transition: transform 1.1s cubic-bezier(.5,0,.7,.4), opacity 1.1s ease; }
  .bird.land { transition: transform 1.4s cubic-bezier(.2,.6,.3,1), opacity .9s ease; }
  #block { transition: transform 1.4s cubic-bezier(.45,0,.25,1), opacity .8s ease; }
  .ripple { position: fixed; left: 0; top: 0; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; box-sizing: border-box;
    border: 1px solid rgba(244,250,250,.95); pointer-events: none; will-change: transform, opacity; opacity: 0; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<script src="span.js"></script>
<script>

  for (const [fx, fy, fw, fh] of fr) for (let x = fx + 30; x <= fx + fw - 30 - bw; x += 40) cands.push([x, fy + fh - 30 - bh], [x, fy + 46]);
  for (const [fx, fy, fw, fh] of fr) for (let y = fy + 90; y <= fy + fh - 40 - bh; y += 40) for (let x = fx + 30; x <= fx + fw - 30 - bw; x += 60) cands.push([x, y]);

  // it stays put while its spot is clear; else it goes to the clear spot nearest where it is (it glided right across
  // the sheet when a corner earlier in the list came free). A short way it slides; further, it sinks here and rises there.
  clearTimeout(blockMv);

  const shown = block.style.opacity !== '0' && !!blockAt, far = !blockAt || Math.hypot(sp[0] - blockAt[0], sp[1] - blockAt[1]) > 300;
  blk.tx = sp[0]; blk.ty = sp[1];
  if (shown && !far) { blockAt = sp; blockTo(sp[0], sp[1]); blk.tl = 1; return; }

  if (shown) { blockSink(); blk.tl = 0; blk.tx = blk.x; blk.ty = blk.y; blockMv = setTimeout(rise, 900); } else rise();
}

/* ======================= the fountain: rings spreading from its jet (the one place you'd expect the water to move) ======================= */
// two pale rings, stepped with the gardeners at the calm rate (the plan itself stays a still picture)
const ripples = [0, 1].map(() => { const d = document.createElement('div'); d.className = 'ripple'; document.body.appendChild(d); return d; });

    d.style.transform = `translate3d(${(pond.x - OX).toFixed(1)}px,${(pond.y - OY).toFixed(1)}px,0) scale(${(r / 18).toFixed(3)})`; d.style.opacity = o.toFixed(2); });
}

/* ======================= loop: the plan is drawn only while it changes; the little lives go on ======================= */
let running = false, lastT = 0;
function wake(redraw = true) { if (redraw) dirty = true; if (!running && !paused) { running = true; lastT = 0; requestAnimationFrame(loop); } }

function loop0(now) {
  if (paused) { running = false; return; }
  const gap = lastT ? (now - lastT) / 1000 : 1 / 30, dt = Math.min(gap, .1); lastT = now;
  fpsEMA = fpsEMA ? fpsEMA * .95 + .05 / dt : 1 / dt;
  const moving = stepLayout(Math.min(gap, .5));                       // the plan eases in real time (it's exponential): a slow renderer isn't made to draw 30 frames of it
  if (moving) window.__twSettle && window.__twSettle(150);   // the plan easing to a new layout plays at the full rate until it has settled
  if (moving || dirty) { render(); dirty = false; }
  if (Span.leader()) { stepGardeners(dt, moving); stepBirds(dt); sendLife(now); }
  else applyLife();
  stepRipples(now);
  if (moving && blockAt && block.style.opacity !== '0') {               // a bed sliding under the title block: it steps aside at once
    const pad = 10, [bx, by] = blockAt; if (slots.some(s => s.alive && bx < s.x + s.w + BED + pad && bx + block._w > s.x - BED - pad && by < s.y + s.h + BED + pad && by + block._h > s.y - BED - pad)) blockSink();
  }
  requestAnimationFrame(loop);
}

/* ======================= boot + host protocol ======================= */
function build() {
  VW = innerWidth; VH = innerHeight; W = Span.uw; H = Span.uh; OX = Span.x; OY = Span.y; K = devicePixelRatio; worldShape();
  cv.width = Math.round(VW * K); cv.height = Math.round(VH * K);
  plan(); wake(); clearTimeout(blockT); blockT = setTimeout(placeBlock, 200);
  if (lastWinMsg) handle(lastWinMsg);                                  // the screen's scale may have changed
}

Span.on('cur', m => curAt(m.x, m.y, m.from));
Span.on('curoff', m => { if (curFrom === m.from) cur.on = false; });

  if (m.t === 'desk') { const k = [m.i, m.x, m.y, m.w, m.h, JSON.stringify(m.fr || [])].join('|'); if (k === deskKey) return; deskKey = k;
    Span.desk(m); SEED = Span.world ? 7 : m.i | 0;                    // one world: one garden (each display alone grows its own)
    for (const g of gardeners) { g.placed = false; g.path = null; } for (const b of birds) b.placed = false; remote = null; build(); return; }
  if (m.t === 'cursor') { curAt(m.x / K + OX, m.y / K + OY, -1); Span.post('cur', { x: cur.x, y: cur.y }); return; }
  if (m.t === 'cursorOff') { if (curFrom === -1) { cur.on = false; Span.post('curoff', {}); } return; }
  if (m.t === 'dicons') { const k = devicePixelRatio;                 // your desktop icons: a terrace for each cluster
    deskIc = (m.c || []).map(([l, t, r, b]) => ({ x: l / k + OX, y: t / k + OY, w: (r - l) / k, h: (b - t) / k, owner: '__icons' }));
    if (lastWinMsg) handle(lastWinMsg); return; }
  if (m.t === 'windows') { lastWinMsg = m; const K = devicePixelRatio;   // the scale as it is now
    setTargets(m.r.map(([l, t, r, b], i) => { const q = m.q && m.q[i];   // (q: a Stage Manager card's turned corners)
      return { x: l / K + OX, y: t / K + OY, w: (r - l) / K, h: (b - t) / K, owner: (m.n || [])[i] || '?', sm: !!(m.sm && m.sm[i]), q: q && q.length === 8 ? q.map((v, j) => v / K + (j % 2 ? OY : OX)) : null }; }).concat(deskIc), !!m.live);
    clearTimeout(blockT); blockT = setTimeout(placeBlock, m.live ? 1500 : 600);
  }

build();
let rz = null; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(build, 200); });
window.__dbg = () => `beds=${slots.length} walks=${segs.length} pond=${pond.life.toFixed(2)} gardeners=${gardeners.map(g => `${g.x | 0},${g.y | 0}`).join(' ')} birds=${birds.map(b => b.away > 0 ? 'away' : `${b.x | 0},${b.y | 0}`).join(' ')} ms=${fieldMs.toFixed(1)} run=${running}`;
const host = window.chrome && window.chrome.webview;
if (host) { host.addEventListener('message', ev => handle(JSON.parse(ev.data))); host.postMessage('ready'); }
else { handle({ t: 'windows', r: [[W * .3 * K, H * .3 * K, W * .62 * K, H * .66 * K]], n: ['A'] }); addEventListener('mousemove', e => handle({ t: 'cursor', x: e.clientX * K, y: e.clientY * K })); }
