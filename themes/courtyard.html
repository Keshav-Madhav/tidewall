<!doctype html>
<!--
  Courtyard — a Tidewall theme. A sunlit Mediterranean courtyard seen from straight above: terracotta octagons with
  glazed inserts, a limestone border along whitewashed walls, an olive tree in a stone planter, herbs in clay pots, a
  well, a bench, three wall lanterns, and a ginger cat asleep in whichever sunny patch is left.

  Your windows are panels floating a little above the floor. Each one casts a real shadow from the real sun at your
  place and time (long and golden in the morning, short and crisp at noon, long amber in the evening); at night the
  moon (its real position and phase) and the lanterns light the yard, and the windows cast soft lantern shadows too.
  Desktop icons cast little shadows of their own.

  How it's built (one WebGL2 canvas):
   · the floor is painted once by a shader into a texture (albedo + a height for the grout and tile bevels, so a low
     sun rakes across the tiles); props are drawn once in 2D (albedo + height + material); the olive crown is a
     leaf mask with mipmaps (its blur is the penumbra of the dappled shade);
   · SHADE: a low-resolution pass with every shadow worked out analytically — windows and icons are thin panels
     (the light-space translate of their rect), pots and the trunk are cylinders (a capsule whose penumbra widens with
     distance from the pot), the walls are half-planes, lanterns are point lights (rects projected toward the lamp).
     It runs only when something casts differently: a window moved, the sun moved (each minute, gliding), a resize;
   · COMPOSITE: lights the floor with sun / moon / sky / lantern from that pass, the crown and its swaying shadow,
     and the cat (an SDF that curls and uncurls) — while only the leaves sway, only their corner is redrawn.
  Rest: the leaves and the cat are the only things that move by themselves; with neither (night, the cat asleep)
  the page asks for no frames at all.
  Test hooks: ?t=<ISO time> freezes the clock, window.__twTime(iso, glideMs) sets it, window.__dbg() reports.
-->
<html>
<head>
<meta charset="utf-8">
<title>Courtyard</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8a4a32; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<script>
'use strict';
window.__opaque = true;
window.__twCalm = 12;                                   // the leaves drift slowly: 12 frames a second is plenty at rest
const Q = window.__twQ || { tier: 1, count: 1, sim: 1, fx: 1 };
let W = innerWidth, H = innerHeight, K = devicePixelRatio || 1, paused = false, fpsEMA = 0, shadeMs = 0, draws = 0, rafs = 0, partials = 0;
const cv = document.getElementById('gl');
const post = s => { try { webkit.messageHandlers.host.postMessage(s); } catch (_) { console.log(s); } };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ======================= where and when ======================= */
// the host passes the city of your time zone (no location permission); the website gets Greenwich
const SQ = new URLSearchParams(location.search);
const SITE = { name: SQ.get('site') || 'Greenwich', lat: parseFloat(SQ.get('lat')) || 51.48, lon: parseFloat(SQ.get('lon')) || 0,
  tz: SQ.get('tz') || (SQ.get('lat') ? Intl.DateTimeFormat().resolvedOptions().timeZone : 'Europe/London') };
let fixedT = SQ.get('t') ? Date.parse(SQ.get('t')) : NaN;          // a frozen clock, for screenshots
const clockNow = () => isFinite(fixedT) ? fixedT : Date.now();

/* ======================= the sun and the moon (after SunCalc, V. Agafonkin, BSD-2) ======================= */
const D2R = Math.PI / 180, J1970 = 2440588, J2000 = 2451545, OBL = D2R * 23.4397;
const toDays = ms => ms / 864e5 - .5 + J1970 - J2000;
const raOf = (l, b) => Math.atan2(Math.sin(l) * Math.cos(OBL) - Math.tan(b) * Math.sin(OBL), Math.cos(l));
const decOf = (l, b) => Math.asin(Math.sin(b) * Math.cos(OBL) + Math.cos(b) * Math.sin(OBL) * Math.sin(l));
const azOf = (Hh, phi, dec) => Math.atan2(Math.sin(Hh), Math.cos(Hh) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi));
const altOf = (Hh, phi, dec) => Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(Hh));
const sidereal = (d, lw) => D2R * (280.16 + 360.9856235 * d) - lw;
function sunCoords(d) { const M = D2R * (357.5291 + .98560028 * d), C = D2R * (1.9148 * Math.sin(M) + .02 * Math.sin(2 * M) + .0003 * Math.sin(3 * M));
  const L = M + C + D2R * 102.9372 + Math.PI; return { dec: decOf(L, 0), ra: raOf(L, 0) }; }
function moonCoords(d) { const L = D2R * (218.316 + 13.176396 * d), M = D2R * (134.963 + 13.064993 * d), F = D2R * (93.272 + 13.229350 * d);
  const l = L + D2R * 6.289 * Math.sin(M), b = D2R * 5.128 * Math.sin(F); return { ra: raOf(l, b), dec: decOf(l, b), dist: 385001 - 20905 * Math.cos(M) }; }
function sunPos(ms) { const lw = -SITE.lon * D2R, phi = SITE.lat * D2R, d = toDays(ms), c = sunCoords(d), Hh = sidereal(d, lw) - c.ra;
  return { az: azOf(Hh, phi, c.dec), alt: altOf(Hh, phi, c.dec) }; }
function moonPos(ms) { const lw = -SITE.lon * D2R, phi = SITE.lat * D2R, d = toDays(ms), c = moonCoords(d), Hh = sidereal(d, lw) - c.ra;
  let h = altOf(Hh, phi, c.dec); const hr = Math.max(h, 0); h += .0002967 / Math.tan(hr + .00312536 / (hr + .08901179));
  return { az: azOf(Hh, phi, c.dec), alt: h }; }
function moonIllum(ms) { const d = toDays(ms), s = sunCoords(d), m = moonCoords(d), sd = 149598000;
  const phi = Math.acos(Math.sin(s.dec) * Math.sin(m.dec) + Math.cos(s.dec) * Math.cos(m.dec) * Math.cos(s.ra - m.ra));
  const inc = Math.atan2(sd * Math.sin(phi), m.dist - sd * Math.cos(phi));
  const ang = Math.atan2(Math.cos(s.dec) * Math.sin(s.ra - m.ra), Math.sin(s.dec) * Math.cos(m.dec) - Math.cos(s.dec) * Math.sin(m.dec) * Math.cos(s.ra - m.ra));
  return { frac: (1 + Math.cos(inc)) / 2, phase: .5 + .5 * inc * (ang < 0 ? -1 : 1) / Math.PI }; }

/* ======================= the light: colour and strength follow the sun's elevation ======================= */
// linear RGB, already scaled by strength. Sun: what a flat floor receives. Sky: the fill in every shadow (blue by day).
const SUN_K0 = [[-1, [0, 0, 0]], [0, [.30, .09, .03]], [3, [1.10, .42, .13]], [6, [1.60, .78, .32]], [12, [2.05, 1.32, .78]],
  [20, [2.20, 1.66, 1.12]], [35, [2.32, 1.98, 1.52]], [90, [2.40, 2.14, 1.78]]];
const SKY_K = [[-90, [.010, .014, .030]], [-18, [.010, .014, .030]], [-12, [.016, .024, .055]], [-6, [.050, .070, .150]],
  [-3, [.100, .110, .210]], [0, [.180, .165, .230]], [3, [.240, .230, .290]], [6, [.300, .310, .390]], [12, [.360, .400, .520]],
  [20, [.400, .460, .620]], [35, [.420, .500, .680]], [90, [.430, .520, .700]]];
const SUN_K = SUN_K0.map(([e, c]) => [e, c.map(v => v * .46)]);
function keyAt(T, x) { if (x <= T[0][0]) return T[0][1]; for (let i = 1; i < T.length; i++) if (x <= T[i][0]) {
  const [a, ca] = T[i - 1], [b, cb] = T[i], t = smooth(0, 1, (x - a) / (b - a)); return ca.map((v, j) => lerp(v, cb[j], t)); } return T[T.length - 1][1]; }
const dirOf = az => [-Math.sin(az), Math.cos(az)];                    // toward the body, on screen (north up, east right)
function skyAt(ms) {
  const s = sunPos(ms), m = moonPos(ms), il = moonIllum(ms), se = s.alt / D2R, me = m.alt / D2R;
  const sE = Math.max(s.alt, 4 * D2R), mE = Math.max(m.alt, 4 * D2R);   // (a shadow can't grow without bound at the horizon)
  const night = smooth(-1, -9, se);
  const moonI = .09 * Math.pow(il.frac, 1.3) * smooth(-1, 8, me) * night;
  return { ms, se, me, frac: il.frac, phase: il.phase, saz: s.az / D2R,
    sd: dirOf(s.az), sCot: Math.cos(sE) / Math.sin(sE), sSin: Math.sin(sE), sCos: Math.cos(sE),
    md: dirOf(m.az), mCot: Math.cos(mE) / Math.sin(mE), mSin: Math.sin(mE), mCos: Math.cos(mE),
    sunC: keyAt(SUN_K, se), skyC: keyAt(SKY_K, se).map(v => v * .85), moonC: [.55 * moonI, .66 * moonI, .95 * moonI],
    lant: smooth(4, -5, se), sway: Q.fx ? smooth(-2, 5, se) : 0, expo: lerp(1, 1.3, night), night, sunOn: se > -1.2, moonOn: moonI > .002 };
}
// the clock as drawn glides between readings (a minute's tick, a wake from sleep, a test hook), so light never steps
let sky = null, glide = null;
function retime(ms, dur) {
  const from = sky ? sky.ms : ms;
  if (!sky || dur <= 0 || Math.abs(ms - from) < 1) { glide = null; sky = skyAt(ms); return; }
  glide = { from, to: ms, t0: performance.now(), dur };
}
function stepGlide(now) {
  if (!glide) return false;
  const u = clamp((now - glide.t0) / glide.dur, 0, 1), e = u * u * (3 - 2 * u);
  sky = skyAt(lerp(glide.from, glide.to, e)); if (u >= 1) glide = null; return true;
}
window.__twTime = (iso, ms = 0) => { fixedT = iso == null ? NaN : Date.parse(iso); retime(clockNow(), ms); shadeDirty = true; full = true; scheduleCatCheck(400); wake(); return clockNow(); };

/* ======================= the yard: everything that stands in it ======================= */
let AREA = null, bootAt = performance.now(), U = 1, L = null;   // L: the layout
function layout() {
  const top = AREA ? AREA[1] : 0, bot = AREA ? AREA[3] : H, hh = bot - top;
  U = clamp(Math.min(W, H) / 982, .75, 1.4);
  const u = U, WB = 14 * u, BAND = 64 * u;
  const X = f => W * f, Y = f => top + hh * f;
  const inX = (x, r) => clamp(x, WB + r + 4, W - WB - r - 4), inY = (y, r) => clamp(y, top + WB + r + 4, bot - WB - r - 4);
  const tree = { x: X(.77), y: Y(.33), R: 150 * u, zc: 150 * u };
  const pots = [], potA = { x: inX(X(.075), 34 * u), y: inY(Y(.80), 34 * u) }, potB = { x: inX(X(.30), 30 * u), y: inY(Y(.06), 30 * u) };
  pots.push({ x: potA.x, y: potA.y, r: 34 * u, h: 40 * u, kind: 'rosemary' });
  pots.push({ x: potA.x + 64 * u, y: potA.y + 26 * u, r: 26 * u, h: 32 * u, kind: 'basil' });
  pots.push({ x: potA.x + 10 * u, y: potA.y - 66 * u, r: 24 * u, h: 34 * u, kind: 'geranium' });
  pots.push({ x: potB.x, y: potB.y, r: 30 * u, h: 38 * u, kind: 'lavender' });
  if (Q.count >= 1) pots.push({ x: potB.x - 62 * u, y: potB.y + 8 * u, r: 22 * u, h: 30 * u, kind: 'basil' });
  const can = { x: potA.x + 84 * u, y: potA.y - 40 * u, r: 12 * u, h: 20 * u };
  const well = { x: X(.43), y: Y(.80), r: 46 * u, h: 30 * u };
  const bucket = { x: well.x + 54 * u, y: well.y - 26 * u, r: 11 * u, h: 18 * u };
  const bench = { x: X(.47) - 105 * u, y: top + WB + 20 * u, w: 210 * u, h: 50 * u, z: 26 * u };
  const planter = { x: tree.x - 62 * u, y: tree.y - 62 * u, w: 124 * u, h: 124 * u, z: 22 * u };
  const lamps = [{ x: WB + 9 * u, y: Y(.44), side: 'l' }, { x: W - WB - 9 * u, y: Y(.66), side: 'r' }, { x: X(.66), y: top + WB + 9 * u, side: 't' }];
  for (const l of lamps) { l.h = 100 * u; l.p = 1.4; }
  const cyl = [...pots, can, well, bucket, { x: tree.x, y: tree.y, r: 10 * u, h: tree.zc - 20 * u }];
  const boxes = [{ x: bench.x, y: bench.y, w: bench.w, h: bench.h, z: bench.z, grounded: false, rad: 7 * u }, { x: planter.x, y: planter.y, w: planter.w, h: planter.h, z: planter.z, grounded: true, rad: 8 * u }];
  L = { top, bot, WB, BAND, TILE: 58 * u, HW: 46 * u, tree, pots, can, well, bucket, bench, planter, lamps, cyl, boxes, winZ: 44, iconZ: 6 };
}

/* ======================= your windows (and icons): panels a little above the floor ======================= */
// Each tracked panel eases to where it is (snaps while you drag it, so its shadow tracks every frame), rises from the
// floor when it opens (its shadow slides out from under it) and sinks and shrinks to its middle when it closes.
let panels = [], liveUntil = 0, lastWinChange = 0, lastWinMsg = null, iconRects = [];
function setPanels(list, live) {
  const used = new Set(), next = [];
  for (const r of list) {
    let best = null, bs = 1e9;
    for (const p of panels) { if (used.has(p) || p.dying || p.icon !== r.icon) continue;
      const s = (p.n === r.n ? 0 : 250) + Math.hypot(p.tx + p.tw / 2 - r.x - r.w / 2, p.ty + p.th / 2 - r.y - r.h / 2) + Math.abs(p.tw - r.w) + Math.abs(p.th - r.h);
      if (s < bs) { bs = s; best = p; } }
    if (best && bs < (r.icon ? 160 : 900)) { used.add(best); Object.assign(best, { tx: r.x, ty: r.y, tw: r.w, th: r.h, n: r.n });
      if (live) Object.assign(best, { x: r.x, y: r.y, w: r.w, h: r.h }); next.push(best); }
    else { const z0 = r.icon ? L.iconZ : L.winZ; next.push({ x: r.x, y: r.y, w: r.w, h: r.h, tx: r.x, ty: r.y, tw: r.w, th: r.h, n: r.n, icon: r.icon, z: booted ? 0 : z0, zt: z0 }); }
  }
  for (const p of panels) if (!used.has(p)) { if (!p.dying) { p.dying = true; p.zt = 0; } next.push(p); }
  panels = next; shadeDirty = true; lastWinChange = performance.now();
}
function stepPanels(dt) {
  let moving = false; const k = 1 - Math.exp(-dt * 16), kz = 1 - Math.exp(-dt * 7);
  for (const p of panels) {
    if (p.dying) { const cx = p.x + p.w / 2, cy = p.y + p.h / 2; p.w *= 1 - kz; p.h *= 1 - kz; p.x = cx - p.w / 2; p.y = cy - p.h / 2; p.z += (0 - p.z) * kz; moving = true; continue; }
    for (const [a, b] of [['x', 'tx'], ['y', 'ty'], ['w', 'tw'], ['h', 'th']]) { const d = p[b] - p[a]; if (Math.abs(d) > .05) { p[a] += d * k; moving = true; } else p[a] = p[b]; }
    const dz = p.zt - p.z; if (Math.abs(dz) > .05) { p.z += dz * kz; moving = true; } else p.z = p.zt;
  }
  const n = panels.length; panels = panels.filter(p => !(p.dying && (p.w < 1.5 || p.h < 1.5 || p.z < .3)));
  return moving || panels.length !== n;
}

/* ======================= painting: the floor (once, by shader), the props (once, in 2D), the olive crown ======================= */
function paintProps() {
  const k = Math.min(K, 2), cw = Math.max(1, Math.round(W * k)), ch = Math.max(1, Math.round(H * k));
  const A = document.createElement('canvas'), B = document.createElement('canvas'); A.width = B.width = cw; A.height = B.height = ch;
  const a = A.getContext('2d'), b = B.getContext('2d'); a.scale(k, k); b.scale(k, k);
  const R = rng(7), u = U;
  const rgb = (r, g, bb, al = 1) => `rgba(${r * 255 | 0},${g * 255 | 0},${bb * 255 | 0},${al})`;
  const hm = (h, m = 0, ao = 1) => `rgb(${clamp(h, 0, 1) * 255 | 0},${m},${clamp(ao, 0, 1) * 255 | 0})`;   // height, material, ao
  const disc = (c, x, y, r, f) => { c.fillStyle = f; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); };
  const ell = (c, x, y, rx, ry, ang, f) => { c.fillStyle = f; c.beginPath(); c.ellipse(x, y, rx, ry, ang, 0, 7); c.fill(); };
  const radial = (c, x, y, r, stops) => { const g = c.createRadialGradient(x, y, 0, x, y, r); for (const [t, col] of stops) g.addColorStop(t, col); return g; };
  const F = 90, WATER = 170, EMIT = 255;                                    // materials: foliage, water, light

  // fallen olive leaves round the tree (flat on the floor)
  const T = L.tree;
  for (let i = 0; i < 46; i++) { const ang = R() * 6.283, r = T.R * (.5 + R() * .85), x = T.x + Math.cos(ang) * r, y = T.y + Math.sin(ang) * r;
    if (x < L.WB + 4 || x > W - L.WB - 4) continue; const g = .35 + R() * .25;
    ell(a, x, y, 5 * u, 1.4 * u, R() * 6.28, rgb(g * .9, g, g * .7, .9)); ell(b, x, y, 5 * u, 1.4 * u, 0, hm(.03)); }

  // the planter: a limestone box, soil, the old trunk
  { const p = L.planter, r = 8 * u;
    a.fillStyle = rgb(.83, .78, .67); a.beginPath(); a.roundRect(p.x, p.y, p.w, p.h, r); a.fill();
    for (let i = 0; i < 3; i++) { b.fillStyle = hm(.40 + i * .06); b.beginPath(); b.roundRect(p.x + i * 2 * u, p.y + i * 2 * u, p.w - i * 4 * u, p.h - i * 4 * u, r); b.fill(); }
    const m = 13 * u; a.fillStyle = rgb(.24, .17, .12); a.beginPath(); a.roundRect(p.x + m, p.y + m, p.w - 2 * m, p.h - 2 * m, 4 * u); a.fill();
    b.fillStyle = hm(.36, 0, .6); b.beginPath(); b.roundRect(p.x + m, p.y + m, p.w - 2 * m, p.h - 2 * m, 4 * u); b.fill();
    for (let i = 0; i < 70; i++) { const x = p.x + m + R() * (p.w - 2 * m), y = p.y + m + R() * (p.h - 2 * m), g = .3 + R() * .3;
      if (R() < .75) ell(a, x, y, 4 * u, 1.2 * u, R() * 6.28, rgb(g * .9, g, g * .7)); else disc(a, x, y, 2 * u, rgb(.12, .10, .14)); }
    // the trunk: gnarled, split in three low down
    for (let j = 0; j < 3; j++) { const an = j * 2.1 + .4; a.strokeStyle = rgb(.33, .28, .22); a.lineWidth = 11 * u; a.lineCap = 'round';
      a.beginPath(); a.moveTo(T.x, T.y); a.quadraticCurveTo(T.x + Math.cos(an) * 14 * u, T.y + Math.sin(an) * 10 * u, T.x + Math.cos(an + .5) * 30 * u, T.y + Math.sin(an + .5) * 30 * u); a.stroke();
      b.strokeStyle = hm(.9); b.lineWidth = 11 * u; b.lineCap = 'round'; b.beginPath(); b.moveTo(T.x, T.y); b.lineTo(T.x + Math.cos(an + .5) * 30 * u, T.y + Math.sin(an + .5) * 30 * u); b.stroke(); }
    disc(a, T.x, T.y, 14 * u, rgb(.36, .30, .24)); disc(b, T.x, T.y, 14 * u, radial(b, T.x, T.y, 14 * u, [[0, hm(1)], [1, hm(.8)]])); }

  // pots with herbs
  const pot = p => { const { x, y, r } = p;
    disc(a, x, y, r, radial(a, x, y, r, [[0, rgb(.74, .40, .24)], [.8, rgb(.76, .42, .26)], [1, rgb(.62, .32, .20)]]));
    disc(b, x, y, r, radial(b, x, y, r, [[0, hm(.50)], [.78, hm(.56)], [.9, hm(.58)], [1, hm(.40)]]));
    disc(a, x, y, r * .8, rgb(.22, .15, .10)); disc(b, x, y, r * .8, hm(.47, 0, .55));
    for (let i = 0; i < 30; i++) { const an = R() * 6.28, rr = Math.sqrt(R()) * r * .76; disc(a, x + Math.cos(an) * rr, y + Math.sin(an) * rr, .9 * u, rgb(.32, .25, .18)); }
    const leaf = (lx, ly, rx, ry, ang, col, h) => { ell(a, lx, ly, rx, ry, ang, col); ell(b, lx, ly, rx, ry, ang, hm(h, F)); };
    if (p.kind === 'rosemary') for (let i = 0; i < 190; i++) { const an = R() * 6.28, r0 = R() * r * .3, r1 = r * (.55 + R() * .5), g = .22 + R() * .12;
      a.strokeStyle = rgb(g * .95, g * 1.3, g * 1.05); a.lineWidth = 1.7 * u; a.beginPath(); a.moveTo(x + Math.cos(an) * r0, y + Math.sin(an) * r0); a.lineTo(x + Math.cos(an + .15) * r1, y + Math.sin(an + .15) * r1); a.stroke();
      b.strokeStyle = hm(.95 - r1 / r * .3, F); b.lineWidth = 1.7 * u; b.beginPath(); b.moveTo(x + Math.cos(an) * r0, y + Math.sin(an) * r0); b.lineTo(x + Math.cos(an + .15) * r1, y + Math.sin(an + .15) * r1); b.stroke();
      if (R() < .12) disc(a, x + Math.cos(an) * r1 * .9, y + Math.sin(an) * r1 * .9, 1.3 * u, rgb(.62, .68, .90)); }
    if (p.kind === 'basil') for (let i = 0; i < 26; i++) { const an = i * 2.4, rr = r * (.85 - i / 26 * .75), g = .5 + R() * .15;
      const lx = x + Math.cos(an) * rr, ly = y + Math.sin(an) * rr; leaf(lx, ly, 8 * u, 5.5 * u, an, rgb(.25 * g * 1.6, .52 * g * 1.5, .14 * g * 1.4), .7 + (1 - rr / r) * .3);
