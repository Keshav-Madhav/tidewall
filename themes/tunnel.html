<!doctype html>
<!--
  Wind Tunnel — a Tidewall theme. Your screen is the test section of a smoke tunnel: air streams in from the left,
  past a model, and a rake of smoke injectors draws the flow as fine white lines.

  The air is a real fluid simulation: a D2Q9 lattice Boltzmann solver on the GPU (with a Smagorinsky turbulence model so it
  stays stable at high Reynolds number). Nothing about the wake is animated by hand — the boundary layers, the shear
  layers peeling off the model, the vortices it sheds and the turbulence behind it all come out of the physics. The smoke
  is tracer particles carried by that computed flow, released continuously from the rake, exactly as in a real tunnel.

  The model is the theme's variant (themes/variants.json → "tunnel"). The cursor is a small steel ball the air flows
  around too, and so are your desktop icons; your windows don't touch the air.
-->
<html>
<head>
<meta charset="utf-8">
<title>Wind Tunnel</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #060708; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  #cap { position: fixed; left: 26px; bottom: 22px; font: 500 10.5px/1.4 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    letter-spacing: .16em; text-transform: uppercase; color: rgba(225, 232, 240, .26); pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<script type="importmap">{ "imports": { "three": "./lib/three/build/three.module.min.js" } }</script>
<canvas id="gl"></canvas>
<div id="cap"></div>
<script>
'use strict';
let W = innerWidth, H = innerHeight, K = devicePixelRatio, paused = false, fpsEMA = 0, fieldMs = 0;
let FB = null; function commit() { } function refresh() { }          // hooks the host calls on every theme; this one has nothing to commit
const P = { quality: 1 };                                            // read by the host's bench probe
const cv = document.getElementById('gl');
const post = s => { try { webkit.messageHandlers.host.postMessage(s); } catch (_) { console.log(s); } };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const cur = { x: -1e4, y: -1e4, on: false, t: 0 };
const VARIANT = new URLSearchParams(location.search).get('v') || 'x1';

/* ======================= the models (the menu's "Model") ======================= */
// Real objects, rendered in 3D with their own materials and textures: museum scans from the Smithsonian (CC0), NASA's
// public-domain models, a Poly Haven photoscan (CC0) and the Khronos concept car (CC BY 4.0) — see THIRD_PARTY_NOTICES.
// Each is rendered once, straight from the side or from above, into an image; the air flows around that image's exact
// silhouette. yaw turns the model about its up axis so its nose faces into the wind (left). The airfoil and cylinder
// are the engineering classics, computed exactly.
const MODELS = {
  x1:       { name: 'Bell X-1',                glb: 'x1',      view: 'side', yaw: -90, w: .36, h: .22 },
  shuttle:  { name: 'Space Shuttle Discovery', glb: 'shuttle', view: 'side', yaw: -90, w: .38, h: .26 },
  wright:   { name: '1903 Wright Flyer',       glb: 'wright',  view: 'top',  yaw: -90, w: .24, h: .4, exposure: .85, tint: 0xcdbb98, rough: .92 },   // the scan has shape but no colour: aged muslin and spruce
  x57:      { name: 'NASA X-57 Maxwell',       glb: 'x57',     view: 'top',  yaw: 0,   w: .30, h: .44, paint: 0xc4c9d0, exposure: .9 },
  car:      { name: 'Concept car',             glb: 'car',     view: 'side', yaw: -90, w: .34, h: .16 },
  cat:      { name: 'Cat (concrete statue)',   glb: 'cat',     view: 'side', yaw: -90, w: .26, h: .27 },
  apollo:   { name: 'Apollo 11 Command Module', glb: 'apollo', view: 'side', yaw: 0, roll: 180,   /* heat shield first, as it came home */   w: .26, h: .3 },
  fish:     { name: 'Barramundi',              glb: 'fish',    view: 'side', yaw: -90, w: .34, h: .2 },
  horse:    { name: 'Horse (bronze statue)',   glb: 'horse',   view: 'side', yaw: 0,   w: .3,  h: .32 },
  shark:    { name: 'Shark (bronze statue)',   glb: 'shark',   view: 'side', yaw: -90, w: .36, h: .3, clip: .46 },   // clip: the statue's stand is cut away below this height
  whale:    { name: 'Whale (bronze statue)',   glb: 'whale',   view: 'side', yaw: -90, w: .36, h: .3, clip: .5 },
  ray:      { name: 'Manta ray (bronze statue)', glb: 'ray',   view: 'top',  yaw: -45,   w: .3,  h: .36 },
  airfoil:  { name: 'NACA 2412 · α 12°', foil: { m: .02, p: .4, t: .12, aoa: 12 }, w: .3 },
  cylinder: { name: 'Cylinder', circle: true, h: .16 },
  none:     { name: 'Your desktop icons', none: true },                  // no model: the icons are what the air meets
};
const MODEL = MODELS[VARIANT] || MODELS.x1;
function foilPoints(f, n = 140) {
  // NACA 4-digit: camber line and thickness, chord 1 along +x (leading edge at 0), y up
  const up = [], lo = [];
  for (let i = 0; i <= n; i++) {
    const b = Math.PI * i / n, x = (1 - Math.cos(b)) / 2;      // cosine spacing: fine at the nose and tail
    const yt = 5 * f.t * (.2969 * Math.sqrt(x) - .126 * x - .3516 * x * x + .2843 * x ** 3 - .1036 * x ** 4);
    const yc = x < f.p ? f.m / (f.p * f.p) * (2 * f.p * x - x * x) : f.m / ((1 - f.p) ** 2) * ((1 - 2 * f.p) + 2 * f.p * x - x * x);
    const dy = x < f.p ? 2 * f.m / (f.p * f.p) * (f.p - x) : 2 * f.m / ((1 - f.p) ** 2) * (f.p - x), th = Math.atan(dy);
    up.push([x - yt * Math.sin(th), yc + yt * Math.cos(th)]); lo.push([x + yt * Math.sin(th), yc - yt * Math.cos(th)]);
  }
  const a = -f.aoa * Math.PI / 180;                              // nose up: the trailing edge drops
  return up.concat(lo.reverse()).map(([x, y]) => { const u = x - .25; return [u * Math.cos(a) - y * Math.sin(a), u * Math.sin(a) + y * Math.cos(a)]; });
}
function drawModel(ctx, cx, cy, sc) {
  // sc: pixels per screen-height unit at this canvas's resolution
  ctx.save(); ctx.fillStyle = '#fff';
  if (MODEL.circle) { ctx.beginPath(); ctx.arc(cx, cy, MODEL.h * sc / 2, 0, Math.PI * 2); ctx.fill(); }
  else if (MODEL.foil) {
    const pts = foilPoints(MODEL.foil), ch = MODEL.w * sc;
    ctx.beginPath(); pts.forEach(([x, y], i) => { const X = cx + x * ch, Y = cy - y * ch; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// The model, rendered once: a real 3D object with its own materials, lit like a tunnel model — a strong light sheet from
// above and in front, a dim cool rim from behind, and a soft studio environment for its reflections. Orthographic, so
// it is a true side or top view. Everything three.js used is released afterwards; only the picture is kept.
async function renderModel(dw, dh, mcx, mcy, scH) {
  const THREE = await import('three');
  const { GLTFLoader } = await import('./lib/three/examples/jsm/loaders/GLTFLoader.js');
  const { DRACOLoader } = await import('./lib/three/examples/jsm/loaders/DRACOLoader.js');
  const { RoomEnvironment } = await import('./lib/three/examples/jsm/environments/RoomEnvironment.js');
  const c = document.createElement('canvas'); c.width = dw; c.height = dh;
  const r = new THREE.WebGLRenderer({ canvas: c, alpha: true, antialias: true, premultipliedAlpha: false, preserveDrawingBuffer: true });
  r.setClearColor(0x000000, 0); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = MODEL.exposure || 1;
  const scene = new THREE.Scene(), pm = new THREE.PMREMGenerator(r);
  scene.environment = pm.fromScene(new RoomEnvironment(), .04).texture; scene.environmentIntensity = .5;
  const draco = new DRACOLoader().setDecoderPath('./lib/three/examples/jsm/libs/draco/gltf/');
  const gltf = await new GLTFLoader().setDRACOLoader(draco).loadAsync('./tunnel/models/' + MODEL.glb + '.glb');
  const root = gltf.scene;
  if (MODEL.paint !== undefined) root.traverse(o => { if (o.isMesh) o.material = new THREE.MeshPhysicalMaterial({ color: MODEL.paint, roughness: .5, metalness: .15, clearcoat: .5, clearcoatRoughness: .25 }); });   // bare CAD geometry: aircraft paint
  if (MODEL.tint !== undefined) root.traverse(o => { if (o.isMesh) for (const m of [].concat(o.material)) { m.color.setHex(MODEL.tint); m.roughness = MODEL.rough ?? m.roughness; m.metalness = 0; } });
  root.rotation.y = MODEL.yaw * Math.PI / 180;
  const pivot = new THREE.Group(); pivot.add(root); scene.add(pivot);
  if (MODEL.roll) pivot.rotation.z = MODEL.roll * Math.PI / 180;      // turned in the picture plane (side views)
  pivot.updateMatrixWorld(true);
  let box = new THREE.Box3().setFromObject(pivot);
  if (MODEL.clip) {                                                    // a statue: cut its stand away, and frame only what's left
    const cut = box.min.y + (box.max.y - box.min.y) * MODEL.clip, plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -cut), v = new THREE.Vector3();
    r.localClippingEnabled = true; box = new THREE.Box3();
    root.traverse(o => { if (!o.isMesh) return; for (const m of [].concat(o.material)) { m.clippingPlanes = [plane]; m.side = THREE.DoubleSide; }
      const pos = o.geometry.attributes.position; for (let i = 0; i < pos.count; i++) { v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld); if (v.y >= cut) box.expandByPoint(v); } });
  }
  const size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
  const top = MODEL.view === 'top', sw = size.x, sh2 = top ? size.z : size.y;
  const k = Math.min(MODEL.w * scH / sw, MODEL.h * scH / sh2), D = Math.max(size.x, size.y, size.z) * 4;   // pixels per metre
  const cam = new THREE.OrthographicCamera(-dw / 2 / k, dw / 2 / k, dh / 2 / k, -dh / 2 / k, D * .01, D * 3);
  const ox = (mcx - dw / 2) / k, oy = (mcy - dh / 2) / k;              // where on screen the model's centre goes
  if (top) { cam.up.set(0, 0, -1); cam.position.set(ctr.x - ox, ctr.y + D, ctr.z - oy); cam.lookAt(ctr.x - ox, ctr.y, ctr.z - oy); }
  else { cam.position.set(ctr.x - ox, ctr.y + oy, ctr.z + D); cam.lookAt(ctr.x - ox, ctr.y + oy, ctr.z); }
  // the lights ride with the camera: the light sheet from above-front-left, a cool rim from behind
  scene.add(cam);
  const key = new THREE.DirectionalLight(0xffffff, top ? 2.4 : 3.2); if (top) key.position.set(-.8, .5, .28); else key.position.set(-.35, .9, .6);   // seen from above, the light skims across it: texture shows cam.add(key); cam.add(key.target); key.target.position.set(0, 0, -1);
  const rim = new THREE.DirectionalLight(0xc4d2ff, 1.1); rim.position.set(.7, .5, -.8); cam.add(rim); cam.add(rim.target); rim.target.position.set(0, 0, -1);
  scene.add(new THREE.HemisphereLight(0x9aa4b4, 0x101114, .35));
  r.render(scene, cam);
  const out = document.createElement('canvas'); out.width = dw; out.height = dh; out.getContext('2d').drawImage(c, 0, 0);
  root.traverse(o => { if (!o.isMesh) return; o.geometry.dispose(); (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { for (const key in m) if (m[key] && m[key].isTexture) m[key].dispose(); m.dispose(); }); });
  pm.dispose(); draco.dispose(); r.dispose(); r.forceContextLoss();
  return out;
}

/* ======================= GL ======================= */
const gl = cv.getContext('webgl2', { antialias: false, premultipliedAlpha: true, alpha: false });
if (!gl.getExtension('EXT_color_buffer_float')) post('JSERR no float render targets');
// smoothing 32-bit float textures needs this extension: without it (some drivers; software renderers) a LINEAR float
// texture is incomplete and samples as zero, a black wall. Half floats are always filterable in WebGL2.
const FLOAT_LINEAR = !!gl.getExtension('OES_texture_float_linear');
// No GPU (a VM, a remote session, a blocklisted driver): WebGL runs on the CPU, so the air gets a grid a quarter the size.
const SOFT_GL = (() => { const x = gl.getExtension('WEBGL_debug_renderer_info'); return /SwiftShader|Basic Render|llvmpipe|softpipe|Software/i.test(x ? gl.getParameter(x.UNMASKED_RENDERER_WEBGL) : ''); })();
function sh(t, s, name) { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x);
  if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) { const e = gl.getShaderInfoLog(x); post('JSERR shader ' + name + ': ' + e); throw new Error(e); } return x; }
function prog(vs, fs, name) {
  const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs, name + '.vs')); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs, name + '.fs')); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) post('JSERR link ' + name + ' ' + gl.getProgramInfoLog(p));
  p.u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); p.u[info.name.replace(/\[0\]$/, '')] = gl.getUniformLocation(p, info.name); }
  return p;
}
const FSQ = `#version 300 es
out vec2 vUV; void main() { vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); vUV = p; gl_Position = vec4(p * 2. - 1., 0., 1.); }`;
const vao = gl.createVertexArray();

// ---- the air: D2Q9 lattice Boltzmann, stream + collide in one pass. Distributions f0..f8 live in three float textures:
//      A = f0 f1 f2 f3, B = f4 f5 f6 f7, C = f8 ux uy rho (the velocity and density ride along for everyone else to read)
const LB_COMMON = `#version 300 es
precision highp float; precision highp int;
const ivec2 C9[9] = ivec2[9](ivec2(0, 0), ivec2(1, 0), ivec2(0, 1), ivec2(-1, 0), ivec2(0, -1), ivec2(1, 1), ivec2(-1, 1), ivec2(-1, -1), ivec2(1, -1));
const float W9[9] = float[9](4. / 9., 1. / 9., 1. / 9., 1. / 9., 1. / 9., 1. / 36., 1. / 36., 1. / 36., 1. / 36.);
float feq(int i, float rho, vec2 u) { float cu = dot(vec2(C9[i]), u); return W9[i] * rho * (1. + 3. * cu + 4.5 * cu * cu - 1.5 * dot(u, u)); }
layout(location = 0) out vec4 oA; layout(location = 1) out vec4 oB; layout(location = 2) out vec4 oC;
void put(float f[9], vec2 u, float rho) { oA = vec4(f[0], f[1], f[2], f[3]); oB = vec4(f[4], f[5], f[6], f[7]); oC = vec4(f[8], u, rho); }
`;
const LB_INIT = prog(FSQ, LB_COMMON + `
uniform vec2 uIn;
void main() { float f[9]; for (int i = 0; i < 9; i++) f[i] = feq(i, 1., uIn); put(f, uIn, 1.); }`, 'lbinit');
const LB_STEP = prog(FSQ, LB_COMMON + `
uniform highp sampler2D uA, uB, uC, uMask; uniform ivec2 uN; uniform vec2 uIn; uniform float uTau, uCs, uSponge; uniform vec4 uBall;   // the cursor's ball: centre and radius in cells
uniform vec2 uBallV;                                                  // and its velocity
const int OPP[9] = int[9](0, 3, 4, 1, 2, 7, 8, 5, 6);
const int MIRY[9] = int[9](0, 1, 4, 3, 2, 8, 7, 6, 5);                 // the same direction with its vertical part reversed
float fget(ivec2 p, int i) { if (i < 4) return texelFetch(uA, p, 0)[i]; if (i < 8) return texelFetch(uB, p, 0)[i - 4]; return texelFetch(uC, p, 0).x; }
bool inBall(ivec2 p) { vec2 d = vec2(p) + .5 - uBall.xy; return dot(d, d) < uBall.z * uBall.z; }
bool solid(ivec2 p) { return texelFetch(uMask, p, 0).a > .5; }
void main() {
  ivec2 x = ivec2(gl_FragCoord.xy); float f[9];
  if (solid(x)) { for (int i = 0; i < 9; i++) f[i] = feq(i, 1., vec2(0.)); put(f, vec2(0.), 1.); return; }
  if (inBall(x)) { for (int i = 0; i < 9; i++) f[i] = feq(i, 1., uBallV); put(f, uBallV, 1.); return; }   // inside the ball the air moves with it, so it is exactly right when the ball moves on
  for (int i = 0; i < 9; i++) {
    ivec2 s = x - C9[i]; int ii = i;
    if (s.x < 0) { f[i] = feq(i, 1., uIn); continue; }                 // the inlet: steady air from the left
    if (s.x >= uN.x) s.x = uN.x - 1;                                    // the outlet: whatever leaves, leaves
    if (s.y < 0 || s.y >= uN.y) { ii = MIRY[i]; s.y = x.y; }            // the tunnel's walls: air slides along them
    if (solid(s)) { f[i] = fget(x, OPP[i]); continue; }                 // the model: air bounces straight back off it (no slip)
    if (inBall(s)) { f[i] = fget(x, OPP[i]) + 6. * W9[i] * dot(vec2(C9[i]), uBallV); continue; }   // the ball: bounce-back off a moving wall, so it pushes the air as it moves
    f[i] = fget(s, ii);
  }
  float rho = 0.; vec2 u = vec2(0.);
  for (int i = 0; i < 9; i++) { rho += f[i]; u += f[i] * vec2(C9[i]); }
  if (!(rho > .4 && rho < 2.5)) { rho = 1.; u = uIn; for (int i = 0; i < 9; i++) f[i] = feq(i, 1., uIn); }
  u /= rho; float ul = length(u); if (ul > .3) u *= .3 / ul;
  // turbulence the grid can't resolve: Smagorinsky raises the viscosity where the strain is high
  float pxx = 0., pyy = 0., pxy = 0., fe[9];
  for (int i = 0; i < 9; i++) { fe[i] = feq(i, rho, u); float d = f[i] - fe[i]; vec2 c = vec2(C9[i]); pxx += c.x * c.x * d; pyy += c.y * c.y * d; pxy += c.x * c.y * d; }
  float Q = sqrt(pxx * pxx + pyy * pyy + 2. * pxy * pxy);
  float tau = .5 * (uTau + sqrt(uTau * uTau + 18. * 1.41421 * uCs * uCs * Q / rho));
  for (int i = 0; i < 9; i++) f[i] -= (f[i] - fe[i]) / tau;
  // past the screen's edge the air is gently calmed back to the free stream, so eddies and pressure waves leave the
  // tunnel instead of reflecting off its end and back over the model
  float sg = max(.12 * smoothstep(uSponge, float(uN.x), float(x.x)), .06 * (1. - smoothstep(0., 22., float(x.x))));   // and at the inlet, so pressure pulses running upstream are absorbed too
  if (sg > 0.) { for (int i = 0; i < 9; i++) f[i] = mix(f[i], feq(i, 1., uIn), sg); }
  put(f, u, rho);
}`, 'lbstep');

// ---- the smoke: tracer particles. One row of the state texture per smoke line (and a few for the wand); the particles
//      in a row are released one after another, so each row is a continuous streakline from its injector.
const P_W = 2048;
const PT_STEP = prog(FSQ, `#version 300 es
precision highp float; precision highp int;
uniform highp sampler2D uS, uV, uMask; uniform vec2 uGrid; uniform float uT0, uT1, uSteps, uLife, uWandLife, uLineGap, uFlow; uniform int uLines; uniform vec3 uWand;
out vec4 o;
float hash(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
// the smoke feels the air averaged over about a cell, as real smoke does: it follows every eddy the grid resolves, but
// not the solver's grid-scale ripple, which would otherwise saw neighbouring filaments apart
vec2 vel(vec2 p) { vec2 g = 1. / uGrid; p *= g; return .25 * (texture(uV, p + vec2(.5, .5) * g).yz + texture(uV, p + vec2(-.5, .5) * g).yz + texture(uV, p + vec2(.5, -.5) * g).yz + texture(uV, p + vec2(-.5, -.5) * g).yz); }
void main() {
  ivec2 id = ivec2(gl_FragCoord.xy); vec4 s = texelFetch(uS, id, 0);
  bool wand = id.y >= uLines; float life = wand ? uWandLife : uLife, ph = (float(id.x) + .5) / ${P_W}. + fract(sin(float(id.y) * 91.7) * 4375.85);   // each line keeps its own timing
  float a0 = fract(uT0 / life + ph), a1 = fract(uT1 / life + ph);
  if (a1 < a0) {                                                      // its turn to be released again
    float j = hash(vec2(id) + uT1);
    if (wand) { s = uWand.z > .5 ? vec4(uWand.xy + (vec2(j, hash(vec2(id) * 1.7 + uT1)) - .5) * .08, 1., j) : vec4(-50., -50., 0., j); }
    else s = vec4(.6 + a1 * life * uFlow, (float(id.y) + .5) * uLineGap, 1., j);   // released at its own moment within the frame: an even line, not clumps
    o = s; return;
  }
  if (s.z <= 0.) { o = s; return; }
  // midpoint steps, four per frame: neighbouring smoke stays on its true path even through a tight vortex
  float h = uSteps * .25;
  for (int q = 0; q < 4; q++) { vec2 v1 = vel(s.xy), v2 = vel(s.xy + v1 * h * .5); s.xy += v2 * h; }
  if (s.x > uGrid.x + 2. || s.x < -2. || s.y < -2. || s.y > uGrid.y + 2.) s.z = 0.;
  else if (texelFetch(uMask, ivec2(s.xy), 0).a > .5) s.z = 0.;         // smoke can't be inside a solid (an icon dropped onto it, or a creep past a wall)
  o = s;
}`, 'ptstep');
// Each smoke line is drawn as what it physically is: a streakline, the curve through every bit of smoke released from
// one injector. Consecutive particles are joined by a hairline segment (an antialiased quad); where the flow stretches the
// smoke thin, the same smoke covers more length and the line dims — which is what turns torn filaments into a cloud.
const PT_DRAW = prog(`#version 300 es
precision highp float; precision highp int;
uniform highp sampler2D uS; uniform vec2 uRes; uniform float uCell, uK, uT, uLife, uWandLife, uRef, uW; uniform int uLines; uniform vec2 uSpan[8]; uniform int uNS;
out float vA, vD;
float ageOf(int j, int row, float life) { return fract(uT / life + (float(j) + .5) / ${P_W}. + fract(sin(float(row) * 91.7) * 4375.85)) * life; }
float h1(float x) { return fract(sin(x * 127.1) * 43758.5453); }
void main() {
  int seg = gl_InstanceID, c = gl_VertexID, row = seg / ${P_W}, k = seg - row * ${P_W}, k1 = (k + 1) % ${P_W};   // a ring: the last one's neighbour is the first
  vec4 a = texelFetch(uS, ivec2(k, row), 0), b = texelFetch(uS, ivec2(k1, row), 0);
  bool wand = row >= uLines; float life = wand ? uWandLife : uLife, ageA = ageOf(k, row, life), ageB = ageOf(k1, row, life);
