<!doctype html>
<!--
  Gallery — a Tidewall theme. Your desktop is a wall in a museum. Every window hangs in a real frame, lit by its own
  spotlight, with a brass label beneath it crediting the app as the artist. In the empty wall around them hang
  public-domain masterpieces from the Metropolitan Museum of Art (Open Access, CC0), which make room as you move things.
  After hours the house lights go down and only the spotlights stay on.

  Artwork: the wall, frames and brass plate were generated for this theme (Gemini); paintings: The Met, CC0.
  Nothing animates while nothing changes: it is laid out once per window move, and the page sits still in between.
-->
<html>
<head>
<meta charset="utf-8">
<title>Gallery</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d9cdc2; }
  /* the whole room is ONE layer: the wall and its dimness are its background, everything else is drawn inside it (each
     extra full-screen layer costs ~22 MB of graphics memory per display) */
  #room { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 120% 95% at 50% 38%, rgba(20,12,6,.24) 0%, rgba(20,12,6,.38) 70%, rgba(20,12,6,.5) 100%),   /* the room is a little dim: the spotlights do the lighting */
                url(gallery/wall.jpg) center bottom / cover no-repeat; }
  #night { position: absolute; inset: 0; pointer-events: none; background: #0b0806; opacity: 0; transition: opacity 6s ease; mix-blend-mode: multiply; display: none; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  .piece { position: absolute; }
  .shadow { position: absolute; transition: opacity .8s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,.35), 5px 12px 22px rgba(35,20,8,.30), 14px 30px 60px rgba(35,20,8,.20); }
  .frame { position: absolute; box-sizing: border-box; border-style: solid; background: #16120e; background-clip: padding-box; }
  .art { position: absolute; display: block; object-fit: cover; }
  /* the spotlight's fall on the canvas itself: warm at the top, gone by the middle (soft-light keeps the darks dark) */
  .glow { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light; background: linear-gradient(180deg, rgba(255,220,170,.34), rgba(255,220,170,0) 58%); }
  .mat { position: absolute; background: #f3eee4; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06), inset 1px 2px 4px rgba(0,0,0,.18); }
  .light { position: absolute; mix-blend-mode: screen; transition: opacity 1.2s ease; pointer-events: none;
    background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255,214,160,.85) 0%, rgba(255,214,160,.6) 34%, rgba(255,214,160,.22) 66%, rgba(255,214,160,0) 100%); }
  .plate { position: absolute; background: url(gallery/plate.png) center / 100% 100% no-repeat; box-sizing: border-box;
    filter: drop-shadow(1px 2px 2px rgba(30,18,6,.35)); display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; color: #3a2810; text-shadow: 0 1px 0 rgba(255,238,200,.55), 0 -1px 0 rgba(40,25,5,.18); transition: opacity .8s ease; }
  .plate .a { font: 600 8.5px/1.25 Baskerville, "Hoefler Text", Georgia, serif; letter-spacing: .18em; text-transform: uppercase; }
  .plate .t { font: italic 11px/1.22 Baskerville, "Hoefler Text", Georgia, serif; margin-top: 2px; max-width: 84%; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .plate .m { font: 8.5px/1.25 Baskerville, "Hoefler Text", Georgia, serif; opacity: .8; margin-top: 1px; max-width: 86%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .niche { position: absolute; border-radius: 6px; transition: all .6s ease;   /* a shallow alcove cut into the wall */
    background: linear-gradient(180deg, rgba(40,26,14,.16), rgba(40,26,14,.06) 30%, rgba(255,240,220,.05));
    box-shadow: inset 0 10px 18px -6px rgba(30,18,8,.45), inset 6px 0 14px -8px rgba(30,18,8,.3), inset -6px 0 14px -8px rgba(30,18,8,.22), inset 0 -2px 3px rgba(255,245,230,.35), 0 1px 0 rgba(255,245,230,.4); }
  .plinth { position: absolute; box-sizing: border-box; border-style: solid; border-width: 0; }
  .floorshadow { position: absolute; background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(30,18,8,.45), rgba(30,18,8,0) 70%); }
  .shelf { position: absolute; height: 9px; border-radius: 1px; background: linear-gradient(180deg, #fbf8f2 0%, #ece6db 55%, #cfc6b7 100%);
    box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 7px 10px -2px rgba(35,20,8,.32), 0 2px 3px rgba(35,20,8,.25); }
  .plate.sm .m, .plate.rail .m { display: none; }
  .plate.rail .a { font-size: 7px; } .plate.rail .t { font-size: 9px; margin-top: 0; -webkit-line-clamp: 1; }
  .soft { position: absolute; border-radius: 22px; box-shadow: 0 2px 4px rgba(0,0,0,.18), 4px 12px 26px rgba(35,20,8,.26); transition: all .6s ease; }
  .frame.win { transition: opacity .35s ease; }                        /* your windows' frames come and go with the window, never pop */
  .hung { transition: left 1.6s cubic-bezier(.45,0,.25,1), top 1.6s cubic-bezier(.45,0,.25,1), opacity 1.2s ease, transform 1.2s ease; }
</style>
</head>
<body>
<script src="span.js"></script>
<div id="room">
<!-- the spotlights light the wall round each frame, under it (screened over the paintings, they washed dark canvases
     milky and at night fogged them); after hours the wall and the shadows go dark, the lit works and their labels don't -->
<div class="layer" id="Lniche"></div>
<div class="layer" id="Lshadow"></div>
<div id="night"></div>
<div class="layer" id="Llight"></div>
<div class="layer" id="Lframe"></div>
<div class="layer" id="Lplate"></div>
</div>
<script>
'use strict';
let W = innerWidth, H = innerHeight, K = devicePixelRatio, paused = false, fpsEMA = 0, fieldMs = 0;
// one world across displays (span.js): W×H is the whole wall, OX/OY where this display sits on it
let OX = 0, OY = 0, FR = [[0, 0, W, H]];
function worldWall() {
  W = Span.uw; H = Span.uh; OX = Span.x; OY = Span.y; FR = Span.frames();
  const r = document.getElementById('room');
  if (Span.world) Object.assign(r.style, { inset: 'auto', left: -OX + 'px', top: -OY + 'px', width: W + 'px', height: H + 'px' });
  else Object.assign(r.style, { inset: '', left: '', top: '', width: '', height: '' });
}
// the display a box hangs on (by its centre), and whether the box lies wholly on it
const frameOf = b => { const cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2; return FR.find(([x, y, w, h]) => cx >= x && cy >= y && cx <= x + w && cy <= y + h) || null; };
const within = (b, F, m) => F && b[0] >= F[0] + m && b[1] >= F[1] + m && b[2] <= F[0] + F[2] - m && b[3] <= F[1] + F[3] - m;
// the skirting: on the lowest displays the wall meets the floor; higher up, a display's own bottom edge
const floorOf = F => !F ? H * .935 : F[1] + F[3] >= H - 2 ? H * .935 : F[1] + F[3] - 10;
const P = { quality: 1 }, cv = document.createElement('canvas');       // read by the host's bench probe
let FB = null; function commit() { } function refresh() { }          // hooks the host calls on every theme
const post = s => { try { webkit.messageHandlers.host.postMessage(s); } catch (_) { console.log(s); } };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const $ = (tag, cls, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; if (parent) parent.appendChild(e); return e; };
const L = { niche: document.getElementById('Lniche'), shadow: document.getElementById('Lshadow'), frame: document.getElementById('Lframe'), plate: document.getElementById('Lplate'), light: document.getElementById('Llight') };

/* ======================= frames ======================= */
// 9-slice assets (themes/gallery/frames.json): corners stay as photographed; plain mouldings stretch, carved ones repeat
let FRAMES = null;
function styleFrame(el, name, F) {
  const f = FRAMES[name], [t, r, b, l] = f.slice;
  el.style.borderWidth = `${F}px`;
  el.style.borderImage = `url(gallery/frame_${name}.png) ${t} ${r} ${b} ${l} / ${F}px ${F}px ${F}px ${F}px / 0 ${f.repeat}`;
}
// which frame each app hangs in
function frameFor(app) {
  const a = (app || '').toLowerCase();
  if (/terminal|iterm|ghostty|warp|alacritty|kitty|wezterm/.test(a)) return 'black';
  if (/code|cursor|xcode|zed|intellij|pycharm|webstorm|sublime|nova/.test(a)) return 'silver';
  if (/slack|discord|whatsapp|messages|telegram|signal|teams|zoom|facetime/.test(a)) return 'oak';
  if (/chrome|safari|zen|arc|firefox|brave|edge|opera|orion|dia/.test(a)) return 'gold';
  let h = 0; for (const c of a) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return ['gold', 'black', 'oak', 'silver'][h % 4];
}

/* ======================= labels ======================= */
// every window is a work in the collection: the app is the artist; the title and medium are the museum's opinion
const YEAR = new Date().getFullYear();
const LABELS = [
  [/zen|arc|chrome|safari|firefox|brave|edge|opera|orion|dia/, ['Forty Open Tabs', 'The Infinite Scroll', 'Study in Tabs'], 'Hypertext and cookies on glass'],
  [/slack/, ['Unread (Red Dot)', 'Thread, Unresolved'], 'Notifications on glass'],
  [/code|cursor|xcode|zed|intellij|pycharm|webstorm|sublime|nova/, ['Untitled (Merge Conflict)', 'Works on My Machine'], 'Syntax on glass'],
  [/terminal|iterm|ghostty|warp|alacritty|kitty|wezterm/, ['Blinking Cursor', 'Exit Code 0'], 'Monospace on black'],
  [/finder/, ['Folder Within a Folder', 'Downloads (Unsorted)'], 'Files, mostly untitled'],
  [/spotify|music/, ['On Repeat', 'Shuffle'], 'Sound, made visible'],
  [/messages|whatsapp|telegram|signal|discord/, ['Typing…', 'Seen'], 'Conversation, in progress'],
  [/mail|gmail|outlook|spark|superhuman/, ['Inbox (Never Zero)'], 'Correspondence'],
  [/notes|obsidian|notion|bear|craft|logseq/, ['Thoughts, Unfinished'], 'Ideas on glass'],
  [/figma|sketch|framer/, ['Frame 437', 'Final_v12_FINAL'], 'Vectors on canvas'],
  [/claude|chatgpt|gemini|t3|copilot/, ['Conversation with a Machine'], 'Language on glass'],
  [/calendar|fantastical|cron|notion calendar/, ['Back-to-Back'], 'Time, partitioned'],
  [/zoom|facetime|meet|teams/, ['You’re on Mute'], 'Faces in a grid'],
  [/linear|jira|asana|trello/, ['In Progress'], 'Tickets on glass'],
  [/system settings|system preferences/, ['Preferences'], 'Toggles and sliders'],
  [/activity monitor/, ['Everything Is Fine'], 'Graphs, rising'],
  [/preview|photos/, ['Still Life'], 'Pixels'],
];
function labelFor(app, nth) {
  const a = (app || '').toLowerCase();
  for (const [re, titles, medium] of LABELS) if (re.test(a)) return { artist: app, title: `${titles[nth % titles.length]}${nth >= titles.length ? ` No. ${nth + 1}` : ''}, ${YEAR}`, medium };
  return { artist: app || 'Artist unknown', title: `Untitled${nth ? ` No. ${nth + 1}` : ''}, ${YEAR}`, medium: 'Pixels on glass' };
}

/* ======================= a hung piece: shadow, frame (+ painting), spotlight, plate ======================= */
function makePiece(kind) {
  const p = { kind, shadow: $('div', 'shadow', L.shadow), frame: $('div', 'frame', L.frame), light: $('div', 'light', L.light), plate: $('div', 'plate', L.plate), style: null };
  p.plate.innerHTML = '<div class="a"></div><div class="t"></div><div class="m"></div>';
  if (kind === 'art') { for (const e of [p.shadow, p.frame, p.light, p.plate]) e.classList.add('hung'); }
  else p.frame.classList.add('win');
  return p;
}
// a window's piece arrives faded out and fades in (what it's laid out to show is its target)
function fadeIn(p) {
  const els = [p.shadow, p.frame, p.light, p.plate], want = els.map(e => e.style.opacity);
  for (const e of els) e.style.opacity = 0;
  requestAnimationFrame(() => requestAnimationFrame(() => { if (p.gone) return; els.forEach((e, i) => { if (e.style.opacity === '0') e.style.opacity = want[i]; }); p.plate.style.opacity = p.plateBox ? 1 : 0; }));
}
function removePiece(p, lift, quick) {
  const els = [p.shadow, p.frame, p.light, p.plate]; p.gone = true;
  // (quick: a window has come over it, so it is lifted up and out before the window's own frame has faded in)
  if (lift) { for (const e of els) { if (quick) e.style.transition = 'opacity .45s ease, transform .5s cubic-bezier(.4,0,.6,1)'; e.style.opacity = 0; e.style.transform = `translateY(${quick ? -22 : -14}px)`; } setTimeout(() => els.forEach(e => e.remove()), quick ? 600 : 1300); }
  // the window's gone: its light dims first, then its empty frame is taken down as a work is, lifted off its hook (a plain
  // fade through the light left a pale double-edged slab hanging there for most of a second)
  else { p.frame.style.background = 'none'; p.light.style.transition = 'opacity .3s ease'; p.light.style.opacity = 0;
    for (const e of [p.shadow, p.frame, p.plate]) { e.style.transition = 'opacity .45s ease .15s, transform .5s cubic-bezier(.4,0,.6,1) .15s'; e.style.opacity = 0; e.style.transform = 'translateY(-12px) scale(.985)'; }
    setTimeout(() => els.forEach(e => e.remove()), 750); }
}
// geometry: the inner rect is what shows (a window, or a painting); the frame wraps it; the plate hangs beside it
function frameWidth(w, h, kind) { return Math.round(clamp(Math.min(w, h) * (kind === 'art' ? .075 : .05), 16, 58)); }
const hit = (a, bs) => bs.some(b => a[0] < b[2] && a[2] > b[0] && a[1] < b[3] && a[3] > b[1]);
const FLOOR = F => floorOf(F);                                        // the skirting: nothing is hung below it
function setFrame(p, x, y, w, h, opt) {
  // the frame's lip tucks under the window's edge, far enough that its rounded corners (14 pt on a Mac, more on macOS 26)
  // show gilt in the corner, not the frame's dark back; the frame is made wider by as much, so as much of it shows as before
  const tuck = opt.kind === 'win' ? 8 : 0, F = opt.F + (opt.kind === 'win' ? 5 : 0);
  const fx = x - F + tuck, fy = y - F + tuck, fw = w + 2 * (F - tuck), fh = h + 2 * (F - tuck);
  if (p.style !== opt.style || p.F !== F) { styleFrame(p.frame, opt.style, F); p.style = opt.style; p.F = F; } p.Fv = F - tuck;   // (Fv: how much of it shows)
  Object.assign(p.frame.style, { left: fx + 'px', top: fy + 'px', width: fw + 'px', height: fh + 'px' });
  Object.assign(p.shadow.style, { left: fx + 'px', top: fy + 'px', width: fw + 'px', height: fh + 'px' });
  const lw = opt.small ? fw * 1.2 + 40 : fw * 1.35 + 140, lh = opt.small ? fh * 1.25 + 46 : fh * 1.4 + 160;   // the spotlight: brightest just above the frame's top, where the light lands (a small work's, its own size)
  Object.assign(p.light.style, { left: fx + fw / 2 - lw / 2 + 'px', top: fy + fh * .3 - lh / 2 + 'px', width: lw + 'px', height: lh + 'px', opacity: opt.lit });
  p.box = [fx, fy, fx + fw, fy + fh];
}
// a label goes where it fits: below the frame, else above, else beside it — never over anything else on the wall
function setPlate(p, label, claimed, frames = null, small = null) {
  p.plateBox = null;
  if (label) { const [a, t, m] = p.plate.children;                     // only when it changed: each write re-laid and repainted the label
    if (a.textContent !== label.artist) a.textContent = label.artist; if (t.textContent !== label.title) t.textContent = label.title; if (m.textContent !== label.medium) m.textContent = label.medium; }
  if (!label) { p.plate.style.opacity = 0; return; }
  const [fx, fy, fx1, fy1] = p.box, fw = fx1 - fx, g = 14, PF = frameOf(p.box) || [0, 0, W, H], X0 = PF[0], X1 = PF[0] + PF[2], Y0 = PF[1], Y1 = PF[1] + PF[3];
  if (small) {                                                         // a small work's card, where its footprint kept room for it
    const [pw, ph] = SMALL_PLATE, [px, py] = small === 'beside' ? [fx1 + 14, fy1 - (fy1 - fy) / 2 - ph / 2] : [(fx + fx1) / 2 - pw / 2, fy1 + 16];
    Object.assign(p.plate.style, { left: px + 'px', top: py + 'px', width: pw + 'px', height: ph + 'px', opacity: 1 });
    p.plate.classList.add('sm'); p.plateBox = [px, py, px + pw, py + ph]; return;
  }
  // a label must be nearer its own frame than any other, or nobody can tell whose it is (a window's plate sat right
  // under a painting's, and with many windows plates floated between them)
  const bd = (a, b) => Math.hypot(Math.max(b[0] - a[2], a[0] - b[2], 0), Math.max(b[1] - a[3], a[1] - b[3], 0));
  const mine = b => !frames || frames.every(o => bd(b, p.box) < bd(b, o) - 8);
  for (const sc of [1, .84, .72]) {
    const pw = clamp(fw * .3, 170, 240) * sc, ph = pw * .4, mid = clamp(fx + fw / 2 - pw / 2, X0 + 8, X1 - pw - 8);
    const cands = [[mid, fy1 + g], [mid, fy - g - ph], [fx1 + g, fy1 - ph], [fx - g - pw, fy1 - ph], [fx1 + g, fy], [fx - g - pw, fy]];
    for (const [px, py] of cands) {
      const b = [px, py, px + pw, py + ph];
      if (px < X0 + 8 || px + pw > X1 - 8 || py < Y0 + 8 || py + ph > FLOOR(PF) || hit(b, claimed) || !mine(b)) continue;
      glide(p, sc + ':' + cands.findIndex(c => c[0] === px && c[1] === py));
      Object.assign(p.plate.style, { left: px + 'px', top: py + 'px', width: pw + 'px', height: ph + 'px', opacity: 1, fontSize: '' });
      p.plate.classList.toggle('sm', sc < .8); p.plate.classList.remove('rail');
      p.plateBox = b; claimed.push([b[0] - 6, b[1] - 6, b[2] + 6, b[3] + 6]); return;
    }
  }
  // no room on the wall: a small plaque screwed to the frame's own bottom rail (or top rail), as museums do
  const F = p.Fv || 0, rh = Math.min(F - 8, 30);
  if (rh >= 24) {
    const rw = rh * 6.4, px = (fx + fx1) / 2 - rw / 2;
    for (const py of [fy1 - F / 2 - rh / 2, fy + F / 2 - rh / 2]) {
      const b = [px, py, px + rw, py + rh];
      if (px < X0 + 8 || px + rw > X1 - 8 || py < Y0 + 4 || py + rh > Y1 - 4 || hit(b, claimed.filter(c => !(c[0] >= fx - 6 && c[1] >= fy - 6 && c[2] <= fx1 + 6 && c[3] <= fy1 + 6))))   /* its own window and frame don't count */ continue;
      glide(p, 'rail:' + py);
      Object.assign(p.plate.style, { left: px + 'px', top: py + 'px', width: rw + 'px', height: rh + 'px', opacity: 1 });
      p.plate.classList.add('rail'); p.plateBox = b; claimed.push(b); return;
    }
  }
  p.plate.style.opacity = 0;                                           // nowhere it can hang without covering something: no label
}
// a window's label that has to move to another side of its frame (no room where it was) glides there, rather than
// jumping; while it stays on the same side it sits exactly where the frame is, drag or not
function glide(p, cand) {
  if (p.kind !== 'win') return;
  const now = performance.now();
  if (p.cand != null && p.cand !== cand && p.plate.style.opacity === '1') p.glideUntil = now + 450;
  p.cand = cand;
  const g = now < (p.glideUntil || 0);
  if (g !== !!p.gliding) { p.gliding = g; p.plate.style.transition = g ? 'opacity .8s ease, left .4s cubic-bezier(.45,0,.25,1), top .4s cubic-bezier(.45,0,.25,1), width .4s ease, height .4s ease' : ''; }
}
function place(p, x, y, w, h, opt) { setFrame(p, x, y, w, h, opt); setPlate(p, opt.label, opt.claimed || [], null, opt.small); }

/* ======================= your windows ======================= */
let wins = [];                                                         // one piece per window, matched by app and position
let niches = [], stands = [];
// Stage Manager's thumbnails move as one strip: they share one recessed niche and one label, never a frame each
let stripKey = null, standKey = null;
function stageStrip(list) {
  const key = JSON.stringify([list.filter(t => t.sm).map(t => [t.x, t.y, t.w, t.h]), FR, W, H]);
  if (key === stripKey) return;                                        // the same strip (most messages, while a window is dragged): it stays up
  stripKey = key;
  for (const n of niches) { n.el.remove(); n.plate.remove(); } niches = [];
  const groups = []; for (const t of list.filter(t => t.sm).sort((a, b) => a.x - b.x)) { const g = groups.find(g => Math.abs(g.cx - (t.x + t.w / 2)) < 60); if (g) g.items.push(t); else groups.push({ cx: t.x + t.w / 2, items: [t] }); }
  for (const g of groups) {
    const x0 = Math.max(4, Math.min(...g.items.map(t => t.x)) - 16), y0 = Math.max(4, Math.min(...g.items.map(t => t.y)) - 18), x1 = Math.max(...g.items.map(t => t.x + t.w)) + 16, y1 = Math.min(FLOOR(frameOf([g.items[0].x, g.items[0].y, g.items[0].x + g.items[0].w, g.items[0].y + g.items[0].h])) - 4, Math.max(...g.items.map(t => t.y + t.h)) + 18);
    const el = $('div', 'niche', L.niche); Object.assign(el.style, { left: x0 + 'px', top: y0 + 'px', width: x1 - x0 + 'px', height: y1 - y0 + 'px' });
    const plate = $('div', 'plate', L.plate);
    plate.innerHTML = '<div class="a">Stage Manager</div><div class="t">In Reserve</div><div class="m">' + g.items.length + ' work' + (g.items.length > 1 ? 's' : '') + ' awaiting display</div>';
    niches.push({ el, plate, box: [x0, y0, x1, y1], n: g.items.length });
  }
}
// desktop widgets are objects, not pictures: a widget near the floor stands on a museum plinth; one higher up sits on a slim
// wall shelf. A plinth needs a clear column down to the floor (nothing else in the way), or it becomes a shelf.
const isWidget = t => /notification cent/i.test(t.app);
function standWidgets(widgets, all) {
  const PL = FRAMES.plinth;
  // a widget's plinth needs a clear column down to the floor; whether each one has it is all the other windows decide
  const column = t => { const WF = frameOf([t.x, t.y, t.x + t.w, t.y + t.h]), low = !WF || WF[1] + WF[3] >= H - 2, floorY = low ? H * .978 : -1e9;
    const pw = t.w * 1.08, colX0 = t.x + t.w / 2 - pw / 2; return [colX0, t.y + t.h + 2, colX0 + pw, floorY]; };
  const key = JSON.stringify([widgets.map(t => [t.x, t.y, t.w, t.h, all.some(o => o !== t && hit([o.x, o.y, o.x + o.w, o.y + o.h], [column(t)]))]), FR, W, H]);
  if (key === standKey) return;                                        // the same stands as now: they stay up
  standKey = key;
  for (const s of stands) if (!s.icon) s.els.forEach(e => e.remove()); stands = stands.filter(s => s.icon);   // (the icon shelves stay up: shelveIcons keeps them)
  for (const t of widgets) {

/* ======================= your desktop icons: a shelving unit in a wall recess ======================= */
// each cluster of icons sits in a shallow alcove, with a shelf board under every row of icons (the icon stands on it,

let deskIc = [], deskIcons = [];
let shelfKey = '';
function shelveIcons() {

  for (const s of stands) if (s.icon) s.els.forEach(e => e.remove()); stands = stands.filter(s => !s.icon);

  const units = deskIc.map(c => ({ b: [c.x - 14, c.y - 12, c.x + c.w + 14, c.y + c.h + 14], cs: [c] }));

    const al = $('div', 'niche', L.niche); Object.assign(al.style, { left: x0 + 'px', top: y0 + 'px', width: x1 - x0 + 'px', height: y1 - y0 + 'px' }); els.push(al);
    // a row is the icons whose images line up (labels of one or two lines end at different heights): one shelf under it
    const mine = deskIcons.filter(r => cs.some(c => r.x >= c.x - 1 && r.x + r.w <= c.x + c.w + 1 && r.y >= c.y - 1 && r.y + r.h <= c.y + c.h + 1)).sort((a, b) => a.iy - b.iy), rows = [];

    for (const { b } of rows) { const sh = $('div', 'shelf', L.niche); Object.assign(sh.style, { left: x0 + 6 + 'px', top: Math.round(b) + 1 + 'px', width: x1 - x0 - 12 + 'px' }); els.push(sh); }
    stands.push({ els, box: [x0, y0, x1, y1 + 10], icon: true });

}

/* ======================= the collection: masterpieces hung in the free wall ======================= */
let ART = [], hung = [], DESK = { i: 0, n: 1 };
const ART_FRAME = { 45434: 'black', 437654: 'silver', 438817: 'silver', 436532: 'oak' };   // the Hokusai print gets a black frame and a mat
function boxes(m = 36) {                                               // where nothing may hang: windows (with their frames and plates), plus a margin
  const out = [];

  for (const s of stands) out.push([s.box[0] - m, s.box[1] - m, s.box[2] + m, s.box[3] + m]);
  for (const r of lastAll) out.push([r.x - m, r.y - m, r.x + r.w + m, r.y + r.h + m]);
  for (const c of wins) { out.push([c.box[0] - m, c.box[1] - m, c.box[2] + m, c.box[3] + m]); if (c.plateBox) out.push([c.plateBox[0] - m, c.plateBox[1] - m, c.plateBox[2] + m, c.plateBox[3] + m]); }
  return out;
}
// the whole footprint of a hung painting of height h at (x, y): frame + plate below it (a small work's plate is a small
// card, below it or, in a low strip, beside it)
const SMALL_PLATE = [122, 49];
function footprint(art, x, y, h, small = null) {

  const fw = w + 2 * (F + mat), fh = h + 2 * (F + mat), [pw, ph] = small ? SMALL_PLATE : [clamp(fw * .3, 170, 240), clamp(fw * .3, 170, 240) * .4];

  return { w, h, F, mat, fw, fh, small, box: [Math.min(x0, x0 + fw / 2 - pw / 2), y0, Math.max(x0 + fw, x0 + fw / 2 + pw / 2), y0 + fh + 16 + ph] };

// big works first; where none fits, the small ones museums hang in narrow places (studies, prints, miniatures), with

function bestSpot(art, obstacles, F, obsSmall) {

function order() {                                                     // which works are on show: a different selection each day

/* ======================= after hours ======================= */
function houseLights() {
  const hr = new Date().getHours() + new Date().getMinutes() / 60;
  const night = hr >= 22 || hr < 6.5 ? 1 : hr >= 20 ? (hr - 20) / 2 : hr < 8 ? 1 - (hr - 6.5) / 1.5 : 0;
  const n = document.getElementById('night'); n.style.display = night > 0 ? 'block' : 'none'; n.style.opacity = (night * .72).toFixed(3);   // gone entirely by day: no layer for it   // the wall goes dark; the spotlights (above it) stay on
}

/* ======================= host protocol ======================= */
let settle = null, lastAll = [], lastRaw = [], deskKey = '';
const toWorld = t => Object.assign({}, t, { x: t.x + OX, y: t.y + OY });
const handle = m => {
  if (m.t === 'desk') { const k = [m.i, m.n, m.x, m.y, JSON.stringify(m.fr || [])].join('|'); if (k === deskKey) return; deskKey = k;
    Span.desk(m); worldWall(); DESK = Span.world ? { i: 0, n: 1 } : m;                 // one wall: every display hangs from the same collection
    for (const h of hung) removePiece(h.p, false); hung = []; setWindows(lastAll = lastRaw.map(toWorld)); hangCollection(); return; }
  if (m.t === 'pause') { paused = !!m.v; return; }

    const R = list => (list || []).map(([l, t, r, b]) => ({ x: l / K + OX, y: t / K + OY, w: (r - l) / K, h: (b - t) / K }));
    deskIc = R(m.c); deskIcons = R(m.r).map((r, k) => { const im = (m.i || [])[k]; return Object.assign(r, { iy: im ? (im[1] + im[3]) / 2 / K + OY : r.y }); });   // (iy: the image's middle)
    setWindows(lastAll); clearTimeout(settle); settle = setTimeout(hangCollection, 350); return; }

    lastAll = lastRaw.map(toWorld); liftCovered(); setWindows(lastAll); liftCovered();
    clearTimeout(settle); settle = setTimeout(hangCollection, m.live ? 900 : 200);   // re-hang once you've stopped moving things
  }

function setTargets() { }
async function boot() {
  [FRAMES, ART] = await Promise.all([fetch('gallery/frames.json').then(r => r.json()), fetch('gallery/art/art.json').then(r => r.json())]);
  houseLights(); setInterval(houseLights, 60e3); setWindows(lastAll);
  // a new day, a new selection: the works on the wall are taken down gently and the day's hang goes up (it used to wait
  // for a window to move)

addEventListener('resize', () => { K = devicePixelRatio; if (Span.world) worldWall(); else { W = innerWidth; H = innerHeight; FR = [[0, 0, W, H]]; } hangCollection(); });
