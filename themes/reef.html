<!doctype html>
<!--
  Koi Reef — a Tidewall theme. A sunlit lagoon seen from above: pale rippled sand under clear turquoise
  water, caustics dancing on the floor. Every window grows a fringe of coral reef (brain and table corals,
  staghorn, anemones with clownfish, giant clams, urchins, starfish) that slides with it, grows in when a
  window opens and recedes when it closes. Koi cruise the open water; reef fish school along the reefs.
  Your cursor is a hand in the water: moving it trails ripples and scatters the reef fish; rest it and the
  koi come to nibble at it.
  Everything is drawn in WebGL: corals are painted once into an albedo + normal atlas and lit live; the
  water is a ripple simulation that refracts the floor and focuses the caustics.
-->
<html>
<head>
<meta charset="utf-8">
<title>Koi Reef</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a9fb0; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  /* your desktop icons float on lily pads; the koi swim beneath them */
  .pad { position: fixed; left: 0; top: 0; pointer-events: none; background-size: 100% 100%; will-change: transform;
         animation: padsway var(--dur, 11s) ease-in-out infinite alternate;
         /* a moved icon's pad drifts over to it; a new one opens out of the water, a gone one sinks back */
         transition: opacity .9s ease, scale .9s ease, translate 1.6s cubic-bezier(.45, 0, .25, 1), width 1.2s ease, height 1.2s ease; }
  @keyframes padsway { from { rotate: calc(var(--r) - 2.5deg); } to { rotate: calc(var(--r) + 2.5deg); } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<script src="span.js"></script>
<script>
'use strict';
let W = innerWidth, H = innerHeight, K = devicePixelRatio, paused = false, fpsEMA = 0, fieldMs = 0;
// one world across displays (span.js): W×H is the whole lagoon, OX/OY where this display sits in it, SW×SH its size
let OX = 0, OY = 0, SW = innerWidth, SH = innerHeight, walls = [];
const worldU = p => { if (p.u.uWO) gl.uniform2f(p.u.uWO, OX, OY); if (p.u.uWS) gl.uniform2f(p.u.uWS, W, H); };
const P = { quality: 2 };
const cv = document.getElementById('gl');
let FB = null; function commit() { } function refresh() { }
const post = s => { try { webkit.messageHandlers.host.postMessage(s); } catch (_) { console.log(s); } };
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hashStr = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const h2 = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
function vnoise(x, y) { const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy, ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = h2(ix, iy), b = h2(ix + 1, iy), c = h2(ix, iy + 1), d = h2(ix + 1, iy + 1); return (a + (b - a) * ux) * (1 - uy) + (c + (d - c) * ux) * uy; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function sdBox(px, py, x0, y0, x1, y1) { const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, dx = Math.abs(px - cx) - (x1 - x0) / 2, dy = Math.abs(py - cy) - (y1 - y0) / 2;
  return Math.hypot(Math.max(dx, 0), Math.max(dy, 0)) + Math.min(Math.max(dx, dy), 0); }

/* ======================= GL plumbing ======================= */
const gl = cv.getContext('webgl2', { antialias: false, premultipliedAlpha: true, alpha: false });
const hasFloat = !!gl.getExtension('EXT_color_buffer_float');
function sh(t, s, name) { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x);
  if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) { const e = gl.getShaderInfoLog(x); post('JSERR shader ' + name + ': ' + e); throw new Error(e); } return x; }
function prog(vs, fs, name) {
  const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs, name + '.vs')); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs, name + '.fs')); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) post('JSERR link ' + name + ' ' + gl.getProgramInfoLog(p));
  p.u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); p.u[info.name.replace(/\[0\]$/, '')] = gl.getUniformLocation(p, info.name); }
  return p;
}
function tex(w, h, internal, format, type, filter, mip) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mip ? gl.LINEAR_MIPMAP_LINEAR : filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  t.w = w; t.h = h; return t;
}
function fbo(...ts) {
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  ts.forEach((t, i) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0));
  gl.drawBuffers(ts.map((_, i) => gl.COLOR_ATTACHMENT0 + i));
  const st = gl.checkFramebufferStatus(gl.FRAMEBUFFER); if (st !== gl.FRAMEBUFFER_COMPLETE && !gl.isContextLost()) post('JSERR fbo incomplete ' + st);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); return f;
}
const emptyVao = gl.createVertexArray();

const VS_FULL = `#version 300 es
out vec2 vUV; void main() { vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); vUV = p; gl_Position = vec4(p * 2. - 1., 0., 1.); }`;
const NOISE = `
float hash(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash2(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
float noise(vec2 p) { vec2 i = floor(p), f = fract(p), u = f * f * (3. - 2. * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y); }
float fbm(vec2 p) { float v = 0., a = .5; for (int i = 0; i < 5; i++) { v += a * noise(p); p = mat2(1.6, 1.2, -1.2, 1.6) * p + 3.1; a *= .5; } return v / .97; }
float fbm3(vec2 p) { float v = 0., a = .5; for (int i = 0; i < 3; i++) { v += a * noise(p); p = mat2(1.6, 1.2, -1.2, 1.6) * p + 3.1; a *= .5; } return v / .875; }
const vec3 LIGHT = vec3(-.4472, -.5367, .7155);       // sun high in the top-left (screen y points down)
`;
// water: what the lagoon does to light on its way down to a surface at depth D (0..1)
const WATER = `
vec3 water(vec3 c, float D) { vec3 T = exp(-D * vec3(2.7, .62, .44)); return c * T + vec3(.0, .25, .34) * (1. - exp(-D * 1.8)); }
`;

// spurs and grooves along a reef's edge (px it reaches out, or in where negative): the same sum of waves in the shader
// that grows the rock and on the CPU that picks where coral grows, so the corals stay on their rock
const SPUR_GLSL = `
float spur(vec2 p) { float s = sin(p.x * .021 + 1.3 * sin(p.y * .013 + .7)) * cos(p.y * .019 + 1.1 * sin(p.x * .012 + 2.1)); return 30. * max(s, 0.) - 10. * max(-s, 0.); }
`;
const spur = (x, y) => { const s = Math.sin(x * .021 + 1.3 * Math.sin(y * .013 + .7)) * Math.cos(y * .019 + 1.1 * Math.sin(x * .012 + 2.1)); return 30 * Math.max(s, 0) - 10 * Math.max(-s, 0); };

/* ---------- 1. sand (painted once per size) ---------- */
const SAND = prog(VS_FULL, `#version 300 es
precision highp float; uniform vec2 uWO, uWS; in vec2 vUV; out vec4 o; uniform vec2 uRes; uniform float uK; uniform vec4 uMd[8]; uniform int uNM;
${NOISE}
// one blade per 5px cell, rooted at a random point and lying downstream (+x in the current's frame)
vec4 seagrass(vec2 p, float dens, float s) {
  const float CS = 3.2;
  vec2 g = p / CS, ig = floor(g); float best = -1., tipf = 0., shade = 0., cov = 0.;
  for (int j = -4; j <= 4; j++) for (int i = -7; i <= 1; i++) {
    vec2 c = ig + vec2(i, j); float hs = hash(c + s);
    if (hs > dens) continue;
    vec2 a = (c + hash2(c + s + 3.)) * CS;
    float len = 9. + 13. * hash(c + s + 7.), bend = (hash(c + s + 9.) - .5) * 1.1;
    float an = (hash(c + s + 11.) - .5) * 1.1, ca = cos(an), sa = sin(an);            // each blade lies its own way
    vec2 d0 = p - a, d = vec2(d0.x * ca + d0.y * sa, -d0.x * sa + d0.y * ca); float t = clamp(d.x / len, 0., 1.);
    float yc = (bend * t + .08 * sin(t * 3. + hs * 6.)) * len * .35;
    float w = mix(.95, .5, t), dist = abs(d.y - yc);
    if (d.x < -1. || d.x > len + 1.) continue;
    float a1 = 1. - smoothstep(w - .6, w + .6, dist);
    if (a1 > 0. && hs > best) { best = hs; tipf = t; shade = (d.y - yc) / w; cov = a1; }
  }
  return vec4(cov, tipf, shade, best);
}
float sandH(vec2 p) {
  vec2 w = vec2(fbm3(p * .0032 + 1.7), fbm3(p * .0032 + 9.1));
  vec2 q = p + (w - .5) * 220.;
  float ph = dot(q, vec2(.82, .57)) / 30. * 6.2832 + fbm3(p * .011) * 2.6;
  float rip = pow(.5 + .5 * sin(ph), 1.7);
  float amp = .35 + .65 * smoothstep(.3, .72, fbm3(p * .0021 + 4.));
  return rip * amp + fbm(p * .045) * .4;
}
void main() {
  vec2 p = vec2(vUV.x, 1. - vUV.y) * uRes + uWO;
  float e = .6, h = sandH(p), hx = sandH(p + vec2(e, 0)), hy = sandH(p + vec2(0, e));
  vec3 n = normalize(vec3(-(hx - h) / e * 2.6, -(hy - h) / e * 2.6, 1.));
  float dif = dot(n, LIGHT);
  vec3 base = vec3(.95, .91, .80) * (.93 + .1 * fbm(p * .0016 + 3.));
  base = mix(base, vec3(.80, .79, .64), smoothstep(.6, .82, fbm(p * .0035 + 2.)) * .35);   // a faint film of algae
  vec2 dp = floor(p * uK); float g = hash(dp), g2 = hash(dp + 71.3);
  base *= .9 + .2 * g;                                                                      // single grains
  if (g2 > .986) base = mix(base, vec3(1.), .55); if (g2 < .007) base *= .62;
  base *= .95 + .1 * (noise(p * .55) * .5 + noise(p * 1.4) * .5);
  // pebbles and bits of shell
  vec2 c = floor(p / 46.), f = p / 46. - c; vec2 pt = hash2(c + 5.); float pr = hash(c + 17.);
  if (pr > .9) { vec2 d = (f - pt) * 46.; float rad = 2.4 + 3.5 * hash(c + 3.); float dd = length(d * vec2(1., 1.3)) / rad;
    if (dd < 1.) { float hh = sqrt(1. - dd * dd); vec3 pc = pr > .96 ? vec3(.98, .96, .93) : mix(vec3(.55, .52, .46), vec3(.78, .74, .66), hash(c + 8.));
      float pl = dot(normalize(vec3(d / rad * .9, hh)), LIGHT); base = mix(base, pc * (.55 + .6 * pl), smoothstep(1., .85, dd)); }
    else if (dd < 1.8) base *= 1. - .18 * (1. - smoothstep(1., 1.8, dd)) * step(0., d.x + d.y); }       // tiny contact shadow
  vec3 col = base * (.5 + .7 * dif / LIGHT.z * .72);
  // seagrass beds: a dark mat of blades with soft, ragged edges
  for (int i = 0; i < 8; i++) { if (i >= uNM) break;
    vec4 md = uMd[i]; float m = 1. - length(p - md.xy) / md.z + (fbm(p * .011 + md.w) - .5) * 1.1 + (fbm(p * .022 + md.w + 4.) - .5) * .55;   // (a finer second wobble: no blobby, straight-sided bed)
    if (m < -.2) continue;
    float dens = clamp(.15 + m * 2.2, 0., 1.);
    mat2 R = mat2(cos(.45), -sin(.45), sin(.45), cos(.45));      // into the current's frame
    vec2 q = R * (p - md.xy);
    float matA = smoothstep(-.15, .35, m);
    vec3 mat = vec3(.31, .40, .23) * (.85 + .3 * fbm(p * .05 + md.w));                   // (a living green mat, not a dark stain)
    col = mix(col, mat, matA * .9);                                                   // the mat the blades root in
    vec4 b = seagrass(q, dens, md.w);
    if (b.x > 0.) {
      vec3 bc = mix(vec3(.25, .36, .17), vec3(.48, .55, .30), smoothstep(.2, 1., b.y)) * (.8 + .4 * hash(vec2(b.w * 91.)));
      bc *= .85 + .2 * (1. - abs(b.z));                                             // each blade is a little rounded
      if (hash(vec2(b.w * 37.)) > .85) bc = mix(bc, vec3(.62, .58, .42), .55);         // some old, sun-bleached
      col = mix(col, bc, b.x * mix(.55, .9, matA));
    }
  }
  o = vec4(col, noise(p * .25));
}`, 'sand');

/* ---------- 2. corals: painted once into an albedo + normal atlas (8 x 4 cells) ---------- */
const CELL = 256, ACOLS = 8, AROWS = 5;
// [type, variant]   types: 0 brain 1 table 2 knob 3 staghorn 4 anemone 5 clam 6 urchin 7 star 8 tubes 9 leather 10 zoanthids
const CELLS = [[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2],[3,0],[3,1],[3,2],[4,0],[4,1],[4,2],[5,0],[5,1],[5,2],[6,0],[6,1],[7,0],[7,1],[7,2],[8,0],[8,1],[8,2],[9,0],[9,1],[9,2],[10,0],[10,1],[10,2],
  [11,0],[11,1],[11,2],[12,0],[12,1],[13,0],[14,0],[14,1]];   // 11 seagrass 12 rubble 13 sea cucumber 14 sand dollar / cowrie
const PAINT = prog(VS_FULL, `#version 300 es
precision highp float;
layout(location = 0) out vec4 oA; layout(location = 1) out vec4 oN;
uniform int uType[40]; uniform int uVar[40];
${NOISE}
float px;
float capsule(vec2 p, vec2 a, vec2 b, out float tt) { vec2 pa = p - a, ba = b - a; tt = clamp(dot(pa, ba) / dot(ba, ba), 0., 1.); return length(pa - ba * tt); }
float edgeR(vec2 q, float s, float base, float amp, float lobes, float lamp) {
  float a = atan(q.y, q.x); vec2 cs = vec2(cos(a), sin(a));
  return base + amp * (noise(cs * 1.6 + s) - .5) * 2. + lamp * sin(a * lobes + s);
}
void brain(int va, float s, vec2 q, out float h, out float m, out vec3 al, out float gs) {
  float r = length(q), R = edgeR(q, s, .8, .06, 3., .03), t = r / R;
  m = 1. - smoothstep(1. - 2. * px, 1., t);
  float dome = sqrt(max(1. - t * t, 0.));
  vec2 w = q * 2.3 + s; w += (vec2(fbm(w * .7 + 1.), fbm(w * .7 + 7.)) - .5) * 2.3;
  float k = abs(fract(fbm(w) * 8.5) - .5) * 2.;
  float groove = 1. - smoothstep(.05, .5, k);
  h = dome * .6 - groove * .07 * smoothstep(0., .3, dome);
  vec3 ridge = va == 0 ? vec3(.80, .67, .42) : va == 1 ? vec3(.66, .62, .44) : vec3(.86, .62, .50);
  vec3 valley = va == 0 ? vec3(.40, .34, .20) : va == 1 ? vec3(.34, .36, .22) : vec3(.48, .30, .25);
  al = mix(ridge, valley, groove * .85) * (.9 + .2 * noise(q * 42. + s));
  gs = .25;
}
void table(int va, float s, vec2 q, out float h, out float m, out vec3 al, out float gs) {
  float r = length(q), a = atan(q.y, q.x), R = edgeR(q, s, .86, .075, 7., .012), t = r / R;
  m = 1. - smoothstep(1. - 2. * px, 1., t);
  float rad = sin(a * 120. + fbm(q * 2.5 + s) * 18.);
  float bump = noise(q * 60. + s);
  h = .3 + .05 * (1. - t) + .04 * smoothstep(.8, .96, t) * (1. - smoothstep(.96, 1., t)) + .007 * rad + .012 * bump;
  vec3 base = va == 0 ? vec3(.52, .48, .34) : va == 1 ? vec3(.80, .72, .58) : vec3(.62, .58, .46);
  vec3 rim = va == 0 ? vec3(.66, .72, .62) : va == 1 ? vec3(.90, .74, .70) : vec3(.70, .78, .78);
  al = mix(base, rim, smoothstep(.8, .98, t) * .8) * (.9 + .04 * rad + .1 * bump);
  al = mix(al * .8, al, smoothstep(0., .45, t));
  gs = .2;
}
void knob(int va, float s, vec2 q, out float h, out float m, out vec3 al, out float gs) {
  float r = length(q), R = edgeR(q, s, .84, .07, 4., .03), t = r / R, env = sqrt(max(1. - t * t, 0.));
  m = 1. - smoothstep(1. - 2. * px, 1., t);
  vec2 g = q * 5.6 + s, ig = floor(g); float hb = 0.;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 c = ig + vec2(i, j), pt = c + .2 + .6 * hash2(c + s); float rr = .52 + .2 * hash(c + s + 3.), d = length(g - pt);
    hb = max(hb, sqrt(max(rr * rr - d * d, 0.)) / rr * (.7 + .3 * hash(c + 9. + s)));
  }
  h = env * .45 + hb * .14 * smoothstep(0., .3, env);
  vec3 tip = va == 0 ? vec3(.95, .64, .72) : va == 1 ? vec3(.92, .86, .62) : vec3(.66, .58, .38);
  vec3 gap = va == 0 ? vec3(.42, .22, .28) : va == 1 ? vec3(.42, .38, .24) : vec3(.26, .24, .15);
  al = mix(gap, tip, smoothstep(0., .62, hb)) * (.9 + .18 * noise(q * 64.));
  gs = .3;
}
void stag(int va, float s, vec2 q, out float h, out float m, out vec3 al, out float gs) {
  float best = 0., tipf = 0., dmin = 1e3;
  for (int i = 0; i < 9; i++) {
    float fi = float(i), th = hash(vec2(fi, s)) * 6.2832;
    vec2 a0 = (hash2(vec2(fi + 7., s)) - .5) * .7;
    vec2 dir = vec2(cos(th), sin(th));
    float len = .32 + .3 * hash(vec2(fi * 1.3, s + 5.));
    vec2 mid = a0 + dir * len * .5 + vec2(-dir.y, dir.x) * (hash(vec2(fi, s + 2.)) - .5) * .18;
    vec2 b0 = a0 + dir * len;
    for (int k = 0; k < 4; k++) {
      float sgn = k == 2 ? 1. : -1.;
      float th2 = th + sgn * (.5 + .4 * hash(vec2(fi + float(k), s + 9.)));
      vec2 A = k == 0 ? a0 : k == 1 ? mid : mid, B = k == 0 ? mid : k == 1 ? b0 : mid + vec2(cos(th2), sin(th2)) * len * .45;
      if (k == 3) { A = mix(mid, b0, .5); B = A + vec2(cos(th - sgn * .7), sin(th - sgn * .7)) * len * .35; }
      float tt, d = capsule(q, A, B, tt);
      float along = k == 0 ? tt * .5 : k == 1 ? .5 + tt * .5 : .55 + tt * .45;
      float rad = mix(.075, .048, along);
      float b = sqrt(max(rad * rad - d * d, 0.)) / rad;
      float hh = .2 + .25 * along + .08 * hash(vec2(fi, float(k) + s)) + b * rad * 1.4;
      if (b > 0. && hh > best) { best = hh; tipf = along; }
      dmin = min(dmin, d - rad);
    }
  }
  m = 1. - smoothstep(-2. * px, 0., dmin); h = best;
  vec3 base = va == 0 ? vec3(.58, .47, .33) : va == 1 ? vec3(.62, .58, .48) : vec3(.78, .69, .50);
  vec3 tip = va == 0 ? vec3(.70, .52, .86) : va == 1 ? vec3(.52, .72, .94) : vec3(.97, .92, .78);
  al = mix(base, tip, smoothstep(.7, 1., tipf)) * (.88 + .2 * noise(q * 75. + s));
  gs = .3;
}
void anem(int va, float s, vec2 q, out float h, out float m, out vec3 al, out float gs) {
  float r = length(q), a = atan(q.y, q.x), best = 0., tipf = 0., dm = 1e3;
  for (int j = 0; j < 3; j++) {
    float N = 22. + float(j) * 6., off = float(j) * .37, ac = (a / 6.2832 + .5) * N + off;
    for (int k = -1; k <= 1; k++) {
      float id = floor(ac) + float(k), idw = mod(id, N), hs = hash(vec2(idw + float(j) * 50., s));
      float L = (.58 + .34 * hs) * (1. - float(j) * .13);
      float ca = ((id + .5 - off) / N - .5) * 6.2832, bend = (hash(vec2(idw, s + float(j) + 3.)) - .5) * .7;
      float da = a - (ca + bend * r); da = mod(da + 3.14159, 6.28318) - 3.14159;
      float lat = da * r, along = r - .15, len = L - .15, tt = clamp(along / len, 0., 1.);
      float d = length(vec2(lat, along - len * tt));
      float rad = va == 1 ? mix(.045, .075, smoothstep(.55, 1., tt)) : mix(.055, .04, tt);
      float b = sqrt(max(rad * rad - d * d, 0.)) / rad;
      float hh = .2 + .09 * float(j) + .12 * tt + b * rad * 1.5;
      if (b > 0. && hh > best) { best = hh; tipf = tt; }
      dm = min(dm, d - rad);
    }
  }
  vec3 base = va == 0 ? vec3(.74, .62, .46) : va == 1 ? vec3(.44, .55, .34) : vec3(.46, .30, .60);
  vec3 tip = va == 0 ? vec3(.97, .38, .72) : va == 1 ? vec3(.86, .50, .40) : vec3(.93, .84, .97);
