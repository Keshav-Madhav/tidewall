  Stokes drag, heat that crosses only a blob's surface, a bulb under a tapered glass base and a cold cap, budding

  shapes that stretch, flatten and wobble. Air bubbles rise through the oil at their own Stokes speed and steer
  around the wax; fine specks hang in it. The lamp sits behind your windows; the cursor warms the wax near it.

    gl.bufferData(gl.ARRAY_BUFFER, dArr.subarray(0, m), gl.DYNAMIC_DRAW); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, m / 4); gl.disable(gl.BLEND); }
}

/* ======================= loop: fixed small physics steps ======================= */
// colour combinations (the menu's "Colours"): oil centre, oil edge, the dark beyond, bulb light, wax, light through the wax's rim
const PALETTES = {
  red:     { OilHi: [1, .16, .1],   OilLo: [.46, .02, .04], OilDeep: [.08, 0, .01],   Bulb: [1, .42, .2],  Wax: [.018, .008, .01], Rim: [1, .3, .15] },
  magenta: { OilHi: [1, .12, .55],  OilLo: [.42, .02, .26], OilDeep: [.07, 0, .05],   Bulb: [1, .4, .7],   Wax: [.016, .006, .014], Rim: [1, .3, .6] },
  blue:    { OilHi: [.12, .45, 1],  OilLo: [.03, .1, .42],  OilDeep: [.0, .01, .07],  Bulb: [.4, .7, 1],   Wax: [.008, .01, .02], Rim: [.35, .6, 1] },
  purple:  { OilHi: [.62, .2, 1],   OilLo: [.2, .03, .45],  OilDeep: [.03, 0, .08],   Bulb: [.75, .45, 1], Wax: [.012, .006, .02], Rim: [.7, .4, 1] },
  amber:   { OilHi: [1, .58, .08],  OilLo: [.48, .2, .02],  OilDeep: [.08, .03, 0],   Bulb: [1, .75, .35], Wax: [.02, .012, .006], Rim: [1, .65, .25] },
  green:   { OilHi: [.45, 1, .1],   OilLo: [.1, .4, .03],   OilDeep: [.01, .07, .0],  Bulb: [.7, 1, .4],   Wax: [.008, .016, .006], Rim: [.6, 1, .3] },
  classic: { OilHi: [.5, .2, .85],  OilLo: [.2, .06, .4],   OilDeep: [.04, .01, .08], Bulb: [1, .6, .35],  Wax: [1, .38, .06], Rim: [1, .8, .35] },
  mint:    { OilHi: [.05, .45, .5], OilLo: [.01, .17, .22], OilDeep: [0, .03, .05],   Bulb: [.5, .9, .85], Wax: [.45, 1, .75], Rim: [.85, 1, .9] },
  mono:    { OilHi: [.97, .95, .9], OilLo: [.62, .6, .57],  OilDeep: [.16, .15, .14], Bulb: [1, .97, .9],  Wax: [.02, .02, .022], Rim: [.9, .85, .75] },
};
const PAL = PALETTES[new URLSearchParams(location.search).get('v') || 'red'] || PALETTES.red;
document.body.style.background = `rgb(${PAL.OilLo.map(v => Math.round(v * 255)).join(',')})`;
const STEP = 1 / 120;
let running = false, lastT = 0, acc = 0;
function wake() { if (!running && !paused) { running = true; lastT = 0; requestAnimationFrame(loop); } }
function loop(now) { try { loop0(now); } catch (e) { running = false; post('JSERR loop ' + e.message + ' ' + (e.stack || '').split('\n')[0]); setTimeout(wake, 1000); } }
function loop0(now) {
  if (paused) { running = false; return; }
  if (lastT && now - lastT < 15.5) { requestAnimationFrame(loop); return; }
  const dt = lastT ? Math.min((now - lastT) / 1000, .1) : 1 / 60; lastT = now;
  fpsEMA = fpsEMA ? fpsEMA * .95 + .05 / dt : 1 / dt;
  const t0 = performance.now();
  acc += dt; let n = 0; while (acc >= STEP && n < 16) { step(STEP); acc -= STEP; n++; } if (n === 16) acc = 0;
  stepBubbles(dt);
  // the glow of the warmed oil under the hand: comes up over a second, dies away over two, trails the hand a little
  { const on = cur.on && performance.now() - cur.t < 8000; glow.a = clamp(glow.a + (on ? dt : -dt / 2), 0, 1);
    if (on) { if (glow.a <= dt) { glow.x = cur.x; glow.y = cur.y; } else { glow.x += (cur.x - glow.x) * Math.min(1, dt * 4); glow.y += (cur.y - glow.y) * Math.min(1, dt * 4); } } }
  fieldMs = fieldMs * .9 + (performance.now() - t0) * .1;
  render();
  requestAnimationFrame(loop);
}

/* ======================= boot + host protocol ======================= */
function build() { W = innerWidth; H = innerHeight; K = devicePixelRatio; buildTargets(); makeWax(); for (let t = 0; t < 70; t += STEP) step(STEP); makeSpecks(); bubbles = []; }
const handle = m => {
  if (m.t === 'pause') { paused = !!m.v; if (!paused) wake(); return; }
  if (m.t === 'cursor' && m.w) { cur.on = false; return; }             // over one of your windows (dragging it by its title bar, say): you're working, not warming the wax hidden behind it
  if (m.t === 'cursor') { const x = m.x / K, y = m.y / K; if (Math.hypot(x - cur.x, y - cur.y) > 1) cur.t = performance.now(); cur.x = x; cur.y = y; cur.on = true; return; }
  if (m.t === 'cursorOff') { cur.on = false; return; }
  if (m.t === 'windows') { if (m.live) liveUntil = performance.now() + 250; }
};
try { build(); } catch (e) { post('JSERR boot ' + e.message + ' ' + (e.stack || '').split('\n')[0]); }
wake();
// A new display size (another screen, a scaling change, the Dock appearing) keeps the lamp as it is, stretched to fit:
// every blob keeps its share of the wax (volume scales with the area, so the total stays exactly the lamp's), and only
// the GL targets and the specks are made again. (Rebuilding swapped the whole lamp for a fresh one in a frame.)
function refit() {
  const ow = W, oh = H; W = innerWidth; H = innerHeight; K = devicePixelRatio;
  if (!blobs.length || !(ow > 0 && oh > 0)) { build(); return; }
  const sx = W / ow, sy = H / oh, sa = sx * sy;
  WAX_V = W * H * WAX_FRAC;
  for (const b of blobs) { b.x *= sx; b.y *= sy; b.V *= sa; b.budTarget *= sa; if (b.ox !== undefined) b.ox *= sx; if (b.cx !== undefined) { b.cx *= sx; b.cy *= sy; } }
  for (const b of bubbles) { b.x *= sx; b.y *= sy; }
  for (const s of specks) { s.x *= sx; s.y *= sy; }
  const want = Math.round(W * H / 9000);                                  // (more glass, a few more specks, easing in)
  for (let i = want; i < specks.length; i++) specks[i].die = true;      // (less glass: the spare ones ease out)
  while (specks.length < want) specks.push({ x: Math.random() * W, y: Math.random() * H, r: .7 + Math.random() * 1.1, a: .25 + Math.random() * .5, p: Math.random() * 100, v: 0 });
  buildTargets();
}
let rz = null; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(refit, 250); });
window.__dbg = () => { const tot = blobs.reduce((s, b) => s + b.V, 0) / WAX_V, aloft = blobs.filter(b => !b.rest).length;
  return `run=${running} fps=${fpsEMA | 0} ms=${fieldMs.toFixed(2)} blobs=${blobs.length} aloft=${aloft} volume=${tot.toFixed(4)} bubbles=${bubbles.length}`; };
const host = window.chrome && window.chrome.webview;
if (host) { host.addEventListener('message', ev => handle(JSON.parse(ev.data))); host.postMessage('ready'); }
else addEventListener('mousemove', e => handle({ t: 'cursor', x: e.clientX * K, y: e.clientY * K }));
</script>
