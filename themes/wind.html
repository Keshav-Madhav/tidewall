<!doctype html>
<!--
  Wind Map — a Driftland theme. The real surface wind over India, live.
  Hourly 10 m wind from Open-Meteo (free, no key; only a fixed grid of lat/lon points over the region is sent)
  is traced by ~32k particles as fine fading streaks, exactly as the data says. The base map is a quiet chart:
  Natural Earth coastlines, hand-inked relief from a real elevation grid (contours, mountain marks, range names),
  a graticule, the seas and cities. Paper by day, ink-blue by night, following the real sun over New Delhi.
  Your windows don't disturb the wind: each one is a weather station, reading the real wind where it sits
  (a standard wind barb, km/h, the nearest place). The cursor reads the wind under it when it rests.
-->
<html>
<head>
<meta charset="utf-8">
<title>Wind Map</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ece6d9; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  #cap { inset: auto auto 0 0; width: 420px; height: 96px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="cap"></canvas>
<script>
'use strict';
window.__noMask = true;
let W = innerWidth, H = innerHeight, K = devicePixelRatio, paused = false, fpsEMA = 0, fieldMs = 0;
const P = { quality: 2 };
const cv = document.getElementById('gl');
let FB = null; function commit() { } function refresh() { }
const post = s => { try { webkit.messageHandlers.host.postMessage(s); } catch (_) { console.log(s); } };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const D2R = Math.PI / 180;
const VARIANT = new URLSearchParams(location.search).get('v') || 'IND';   // the region, chosen in the menu
let WORLD = null, COUNTRY = null, HOME = { lat: 28.6139, lon: 77.2090, name: 'New Delhi' };
const SERIF = '"Iowan Old Style", "Hoefler Text", Baskerville, Georgia, serif';

/* ======================= the chart: an equirectangular view framed on the chosen country ======================= */
let PJ = null;
function project() {
  const [b0, b1, b2, b3] = COUNTRY ? COUNTRY.bb : [68.17, 8.08, 97.34, 35.5];
  let latC = (b1 + b3) / 2; const lonC = (b0 + b2) / 2, k = Math.cos(clamp(latC, -70, 70) * D2R);
  // fit the country (with a margin) to the screen's shape, true to scale at the centre latitude
  // several displays: one map laid across the whole desk (fitted to the screen the country sits on), each screen
  // drawing its own part; the wind data covers the whole desk and is fetched once, shared between the screens
  const UW = DESK.uw || W, UH = DESK.uh || H, FW = DESK.n > 1 ? (DESK.mw || W) : UW, FH = DESK.n > 1 ? (DESK.mh || H) : UH;   // every screen fits the map to the main display, so they all agree
  let latSpan = Math.max((b3 - b1) * 1.36, (b2 - b0) * 1.24 * k * FH / FW, 9) * UH / FH;
  latSpan = Math.min(latSpan, 150);
  if (DESK.n <= 1) latC = clamp(latC, -84 + latSpan / 2, 84 - latSpan / 2);
  const lonSpan = Math.min(359, UW / UH * latSpan / Math.cos(clamp(latC, -70, 70) * D2R));
  // the country is centred on the main desk (the middle screen of three), not on the gap between screens
  const midX = DESK.n > 1 ? (DESK.mx ?? UW / 2) : UW / 2, lon0 = lonC - midX / UW * lonSpan;
  const midY = DESK.n > 1 ? (DESK.my ?? UH / 2) : UH / 2, lat1 = latC + midY / UH * latSpan;
  PJU = { lon0, lon1: lon0 + lonSpan, lat0: lat1 - latSpan, lat1 };
  PJ = { lon0: PJU.lon0 + DESK.x / UW * lonSpan, lon1: PJU.lon0 + (DESK.x + W) / UW * lonSpan,

  // the grid, padding included, stays under ~540 points (the free API allows 600 locations a minute)
  GS = [.25, .5, .75, 1, 1.25, 1.5, 2, 2.5, 3, 4, 5, 6].find(v => { const g = gridSpec(v); return g.nx * g.ny <= 540; }) || 6;
}
const X = lon => (lon - PJ.lon0) / (PJ.lon1 - PJ.lon0) * W, Y = lat => (PJ.lat1 - lat) / (PJ.lat1 - PJ.lat0) * H;
const LON = x => PJ.lon0 + x / W * (PJ.lon1 - PJ.lon0), LAT = y => PJ.lat1 - y / H * (PJ.lat1 - PJ.lat0);

/* ======================= live wind ======================= */
let GS = 2.5, PJU = null, DESK = { x: 0, y: 0, uw: 0, uh: 0, i: 0, n: 1 }, deskSeen = null;
const deskKnown = new Promise(r => { deskSeen = r; setTimeout(r, 900); });                         // data grid spacing (degrees), set per country by project()
const GS_cur = () => GS;
const VS = 9;                         // drawn speed: px/s per m/s of real wind
let DATA = null, dataNote = 'waiting for live wind…', fetching = false, nextFetchAt = 0;
function gridSpec(gs) {
  const GS = gs || GS_cur();
  const lo0 = Math.floor((PJU.lon0 - 1) / GS) * GS, lo1 = Math.ceil((PJU.lon1 + 1) / GS) * GS;
  const la0 = Math.floor((PJU.lat0 - 1) / GS) * GS, la1 = Math.ceil((PJU.lat1 + 1) / GS) * GS;
  return { lo0, la0, gs: GS, nx: Math.round((lo1 - lo0) / GS) + 1, ny: Math.round((la1 - la0) / GS) + 1 };
}
const gridKey = g => `${g.lo0},${g.la0},${g.gs},${g.nx},${g.ny}`;
async function fetchWind() {
  const g = gridSpec(), lats = [], lons = [];
  const num = v => String(+v.toFixed(2));                     // compact: "31.25", "130", not "31.25" padded
  for (let j = 0; j < g.ny; j++) for (let i = 0; i < g.nx; i++) { lats.push(num(g.la0 + j * GS)); lons.push(num((((g.lo0 + i * GS) + 540) % 360) - 180)); }
  // a few requests of ≤180 points each, so no URL grows past the server's 8 KB limit
  const arr = [];
  for (let k = 0; k < lats.length; k += 180) {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats.slice(k, k + 180).join(',')}&longitude=${lons.slice(k, k + 180).join(',')}` +
      `&hourly=wind_speed_10m,wind_direction_10m&wind_speed_unit=ms&timeformat=unixtime&past_hours=3&forecast_hours=20&timezone=auto`;
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) { let why = ''; try { why = (await r.json()).reason || ''; } catch (_) { } throw new Error('HTTP ' + r.status + ' ' + why); }
    const js = await r.json(); for (const o of (Array.isArray(js) ? js : [js])) arr.push(o);
  }
  if (arr.length !== g.nx * g.ny) throw new Error('grid mismatch ' + arr.length);
  const times = arr[0].hourly.time, nt = times.length, n = g.nx * g.ny;
  const u = new Array(nt * n), v = new Array(nt * n);
  arr.forEach((loc, k) => {
    const s = loc.hourly.wind_speed_10m, d = loc.hourly.wind_direction_10m;
    for (let t = 0; t < nt; t++) {
      const sp = s[t] == null ? 0 : s[t], dir = (d[t] == null ? 0 : d[t]) * D2R;   // meteorological: the direction it blows FROM
      u[t * n + k] = -sp * Math.sin(dir); v[t * n + k] = -sp * Math.cos(dir);    // east, north components (m/s)
    }
  });
  // the local clock: from the grid point nearest the capital
  let best = 0, bd = 1e9; arr.forEach((loc, k) => { const d = (loc.latitude - HOME.lat) ** 2 + (loc.longitude - HOME.lon) ** 2; if (d < bd) { bd = d; best = k; } });
  return { g, key: gridKey(g), times, u, v, fetched: Date.now(), tz: { off: arr[best].utc_offset_seconds || 0, abbr: arr[best].timezone_abbreviation || '' } };
}
function loadCache() {
  try { const c = JSON.parse(localStorage.getItem('driftland-wind-' + VARIANT) || 'null'); if (c && c.key === gridKey(gridSpec())) return c; } catch (_) { }
  return null;
}
function saveCache(d) { try { localStorage.setItem('driftland-wind-' + VARIANT, JSON.stringify(d)); } catch (_) { } }
// the free API's daily allowance resets at midnight UTC: once it's spent, wait for that instead of asking again and again
const untilTomorrow = () => { const d = new Date(); d.setUTCHours(24, 5, 0, 0); return d.getTime(); };
async function maybeFetch() {
  const now = Date.now();
  if (fetching || now < nextFetchAt) return;
  if (DESK.i > 0) { const c = loadCache(); if (c && (!DATA || c.fetched > DATA.fetched)) { DATA = c; buildTarget(); drawCaption(); }   // another screen fetched it
    if (now < bootAt + DESK.i * 45e3) return; }                     // let the first screen fetch for everyone
  const end = DATA ? DATA.times[DATA.times.length - 1] * 1000 : 0;
  const stale = !DATA || now - DATA.fetched > 6 * 3600e3 || now > end - 2 * 3600e3;   // every 6 h: ~2,200 of the free API's 10,000 daily locations
  if (!stale) return;
  fetching = true;
  try { DATA = await fetchWind(); saveCache(DATA); nextFetchAt = now + 20 * 60e3; buildTarget(); drawCaption(); }
  catch (e) { nextFetchAt = /daily/i.test(e.message) ? untilTomorrow() : now + (DATA ? 10 * 60e3 : 65e3 + Math.random() * 20e3);   // no wind yet (e.g. the API's per-minute limit): try again in about a minute
    post('JSERR wind fetch ' + e.message); dataNote = DATA ? 'offline · showing the last forecast' : 'offline · waiting for live wind'; drawCaption(); }
  fetching = false;
}
// wind (m/s, east/north) at a place and time, from the hourly grid: bilinear in space, linear in time
function sampleWind(lon, lat, tSec, out) {
  const D = DATA, g = D.g, n = g.nx * g.ny, T = D.times;
  let ti = 0; while (ti < T.length - 2 && T[ti + 1] <= tSec) ti++;
  const ft = clamp((tSec - T[ti]) / (T[ti + 1] - T[ti]), 0, 1);
  const gs = g.gs || GS, fx = clamp((lon - g.lo0) / gs, 0, g.nx - 1.001), fy = clamp((lat - g.la0) / gs, 0, g.ny - 1.001);
  const ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy;
  const cr = (a, b, c, d, t) => b + .5 * t * (c - a + t * (2 * a - 5 * b + 4 * c - d + t * (3 * (b - c) + d - a)));
  const at = (A, o, i, j) => A[o + clamp(j, 0, g.ny - 1) * g.nx + clamp(i, 0, g.nx - 1)];
  const bic = (A, o) => { const r = []; for (let j = -1; j <= 2; j++) r.push(cr(at(A, o, ix - 1, iy + j), at(A, o, ix, iy + j), at(A, o, ix + 1, iy + j), at(A, o, ix + 2, iy + j), tx));
    return cr(r[0], r[1], r[2], r[3], ty); };

/* ======================= GL ======================= */
const gl = cv.getContext('webgl2', { antialias: false, premultipliedAlpha: true, alpha: false });

  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) post('JSERR fbo incomplete'); gl.bindFramebuffer(gl.FRAMEBUFFER, null); return f; }
const vao = gl.createVertexArray();
const VS_FULL = `#version 300 es
out vec2 vUV; void main() { vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); vUV = p; gl_Position = vec4(p * 2. - 1., 0., 1.); }`;
// the fluid grid: one cell per CELL css px, stored in screen orientation (y down) with velocities in px/s
const CELL = 8;
const SIM = `
uniform vec2 uGrid; uniform float uCell, uDt; uniform vec2 uRes;
uniform vec4 uR[32]; uniform vec2 uRV[32]; uniform int uN;
vec2 cellP() { return vec2(gl_FragCoord.x, uGrid.y - gl_FragCoord.y) * uCell; }
vec2 uvOf(vec2 p) { return vec2(p.x / (uCell * uGrid.x), 1. - p.y / (uCell * uGrid.y)); }
float solid(vec2 p, out vec2 vel) {
  vel = vec2(0.);
  for (int i = 0; i < 32; i++) { if (i >= uN) break; vec4 r = uR[i];
    if (p.x > r.x - 3. && p.x < r.z + 3. && p.y > r.y - 3. && p.y < r.w + 3.) { vel = uRV[i]; return 1.; } }
  return 0.;

`;
// particles: one texel each (x, y, age, life), stepped through the flow on the GPU
const PW = 256, PH = 128, NP = PW * PH;
const PSTEP = prog(VS_FULL, `#version 300 es
precision highp float; out vec4 o; uniform sampler2D uP, uT; uniform float uSeed;
${SIM}
float hash(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }

  vec2 pos = s.xy, wv; float age = s.z, life = s.w;

  vec2 mid = pos + v * uDt * .5; pos += texture(uT, uvOf(mid)).xy * uDt;
  age += uDt;

    for (int k = 0; k < 6; k++) {
      pos = vec2(hash(gl_FragCoord.xy + uSeed * 17.31 + float(k) * 3.7), hash(gl_FragCoord.yx * 1.37 + uSeed * 9.17 + float(k) * 5.3)) * uRes;
      if (solid(pos, wv) < .5) break;

// a streak segment per particle per frame, from where it was to where it is, anti-aliased, into the trail buffer
const SEG = prog(`#version 300 es
uniform sampler2D uP0, uP1; uniform vec2 uRes; uniform float uHW, uDt;
out float vD; out float vA; out float vS;
void main() {
  int id = gl_InstanceID; ivec2 c = ivec2(id % ${PW}, id / ${PW});
  vec4 a = texelFetch(uP0, c, 0), b = texelFetch(uP1, c, 0);

  float side = (gl_VertexID & 1) == 0 ? -1. : 1., end = gl_VertexID < 2 ? 0. : 1.;
  vec2 p = mix(a.xy, b.xy, end) + nrm * side * uHW + dir * (end * 2. - 1.) * uHW;

  vS = clamp(speed / 120., 0., 1.);
  float life = smoothstep(0., .7, b.z) * (1. - smoothstep(b.w - 1., b.w, b.z));
  vA = skip ? 0. : life * smoothstep(2., 9., speed) * (.16 + .84 * smoothstep(9., 75., speed)) * .7;   // calm air whispers, strong wind stands out   // still air leaves no speckle
  gl_Position = vec4(p.x / uRes.x * 2. - 1., 1. - p.y / uRes.y * 2., 0., 1.);
}`, `#version 300 es
precision highp float; in float vD; in float vA; in float vS; out vec4 o;
void main() { float a = vA * (1. - smoothstep(.35, 1., abs(vD))); o = vec4(a, a * vS, 0., a); }`, 'seg');
const FADE = prog(VS_FULL, `#version 300 es
precision highp float; out vec4 o; void main() { o = vec4(0.); }`, 'fade');
const COMP = prog(VS_FULL, `#version 300 es
precision highp float; in vec2 vUV; out vec4 o;
uniform sampler2D uTrail, uMap; uniform vec3 uBg, uLand, uLine, uFast, uGrat, uInk; uniform float uK, uDayF;
float hash(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
void main() {

/* ---------- targets ---------- */
let GW = 1, GH = 1, Tt = null, trailT, trailF, mapT = null, Ptx = [], Pfx = [], pi = 0, vi = 0, pj = 0;
const fmtF = [gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT];

// the real wind on the fluid grid (px/s, y down), for the current minute
const tgtBuf = { a: null };

  const n = GW * GH; if (!tgtBuf.a || tgtBuf.a.length !== n * 2) tgtBuf.a = new Float32Array(n * 2);
  const A = tgtBuf.a, out = [0, 0], tSec = Date.now() / 1000;
  for (let j = 0; j < GH; j++) {
    const y = (j + .5) * CELL, lat = LAT(y), row = GH - 1 - j;          // texture rows run bottom-up
    for (let i = 0; i < GW; i++) {
      const x = (i + .5) * CELL;

      else { out[0] = -1.6 + .8 * Math.sin(y * .004 + 1); out[1] = -1.2 + .7 * Math.cos(x * .003); }   // a gentle stand-in until data arrives

/* ---------- the base chart, painted once: R ink (coast, cities, labels), G land, B graticule ---------- */
let COAST = null, ELEV = null, LABEL_BOXES = [];
// real elevation, a global 0.25° grid (from the AWS Terrain Tiles, built once and shipped with the theme), cubic-interpolated
function elevAt(lon, lat) {

// relief, inked by hand: wobbly contours, little shaded peaks where the land rises, stippled desert, range names
function drawRelief(y) {
  if (!ELEV) return;

  const jit = (x, z) => [(vn(x * .09, z * .09) - .5) * 1.6, (vn(x * .09 + 40, z * .09) - .5) * 1.6];
