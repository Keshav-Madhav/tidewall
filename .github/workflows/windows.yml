name: Windows
# Builds Tidewall for Windows and runs it hands-off on a real Windows desktop, wall by wall (two windows, a glide,
# pictures of the desktop and the wall, frame times through the glide), on Windows Server 2022 and 2025 (the desktop
# layer changed with 24H2). GitHub's runners have no GPU: frame rates here are a floor, not the real thing.
on:
  push:
    branches: [windows]
    paths: [windows/**, themes/**, .github/workflows/windows.yml]
  workflow_dispatch:
    inputs:
      walls:
        description: Walls to run, comma-separated (empty = all)
        required: false
        default: ''
permissions:
  contents: read
jobs:
  build-and-run:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          dotnet publish windows/Tidewall.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:TidewallVersion=$v -o out/Tidewall
          Copy-Item windows/Tidewall.ico out/Tidewall/
          Copy-Item -Recurse themes out/Tidewall/themes
      - name: A bigger screen
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Run every wall hands-off
        shell: pwsh
        run: |
          $bad = 0
          $walls = 'inkmap','railway','garden','estate','gallery','celestial','snow','lava','wind','reef','tunnel','meadow','beach'
          if ('${{ inputs.walls }}') { $walls = '${{ inputs.walls }}'.Split(',') }
          foreach ($t in $walls) {
            New-Item -ItemType Directory -Force "test-out/$t" | Out-Null
            # (no GPU here: WebGL runs on the CPU, and Wind Tunnel's model and fluid need a minute to make a first picture)
            $settle = if ($t -eq 'tunnel') { '60' } else { '9' }
            $p = Start-Process -FilePath out/Tidewall/Tidewall.exe -ArgumentList '--test',"test-out/$t",'--log',"test-out/$t/tidewall.log",'--theme',$t,'--clear-desk','--settle',$settle -PassThru
            if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Host "$t did not finish in 180 s"; $bad++ }
            $log = "test-out/$t/tidewall.log"
            $done = Select-String -Path $log -Pattern 'TEST DONE' -Quiet
            $crash = Select-String -Path $log -Pattern 'CRASH|JSERR' | Where-Object { $_.Line -notmatch 'JSERR (wind fetch|wx) ' }
            Write-Host "== $t done=$done"; Select-String -Path $log -Pattern 'ready on|probe . wall|JSERR|CRASH|console|NOTE' | ForEach-Object { $_.Line }
            if (-not $done -or $crash) { $bad++ }
          }
          if ($bad) { Write-Host "$bad wall(s) failed"; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-${{ matrix.os }}
          path: test-out
