name: Build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Tidewall.app
        run: ./build.sh
      - name: Check every page's scripts parse
        run: tools/check-pages.sh
      - name: Zip
        run: ditto -c -k --keepParent build/Tidewall.app Tidewall.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Tidewall
          path: Tidewall.zip
