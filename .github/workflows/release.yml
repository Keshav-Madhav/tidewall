name: Release
# Runs when tools/release.sh pushes a version tag. Two jobs, so the update key never shares a machine with the build:
#   build:   (environment "codesign": Tidewall's code-signing certificate, v* tags only) builds the release app, signs
#            it with that certificate (the same identity every release, so macOS keeps Tidewall's permissions across
#            updates), zips it, and checks the zip exactly the way the app's updater will. The certificate alone can't
#            ship anything: installed copies take only what the update key signed.
#   publish: (environment "release": the key lives there, and only v* tags may use it) signs update.json with
#            tools/update-sign.swift, verifies it against the app's public keys, and publishes the release. It runs
#            none of the repo's build scripts, and keeps no git credentials on disk.
# Installed copies read releases/latest/download/update.json, so publishing the release IS shipping the update.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    environment: codesign
    env:
      # the certificate's SHA-1 (public: assets/tidewall-signing-cert.pem). A release must carry exactly this identity
      SIGN_SHA1: 1873ADEDF0C5887F95CACECD56B3083687235F7A
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          persist-credentials: false
      - name: Check the version
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$(tr -d ' \n' < VERSION)" = "$v" ] || { echo "::error::tag $GITHUB_REF_NAME but VERSION says $(cat VERSION)"; exit 1; }
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no ## [$v] section"; exit 1; }
      - name: Load the signing certificate (a throwaway keychain, gone with the runner)
        env:
          TIDEWALL_SIGN_P12: ${{ secrets.TIDEWALL_SIGN_P12 }}
          TIDEWALL_SIGN_PASS: ${{ secrets.TIDEWALL_SIGN_PASS }}
        run: |
          [ -n "$TIDEWALL_SIGN_P12" ] && [ -n "$TIDEWALL_SIGN_PASS" ] || { echo "::error::the TIDEWALL_SIGN_P12 / TIDEWALL_SIGN_PASS secrets are missing from the codesign environment"; exit 1; }
          kc="$RUNNER_TEMP/sign.keychain-db"; kp=$(openssl rand -hex 24)
          security create-keychain -p "$kp" "$kc"; security set-keychain-settings -lut 1800 "$kc"; security unlock-keychain -p "$kp" "$kc"
          (umask 077; echo "$TIDEWALL_SIGN_P12" | base64 -D > "$RUNNER_TEMP/sign.p12")
          security import "$RUNNER_TEMP/sign.p12" -k "$kc" -P "$TIDEWALL_SIGN_PASS" -T /usr/bin/codesign -f pkcs12 >/dev/null
          rm -f "$RUNNER_TEMP/sign.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" >/dev/null
          # codesign finds the private key only through the search list (the runner's own, thrown away with it)
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$kc" | grep -q "$SIGN_SHA1" || { echo "::error::the certificate in the secret isn't $SIGN_SHA1"; exit 1; }
          echo "TIDEWALL_SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"
      - name: Build the release app
        run: RELEASE=1 TIDEWALL_SIGN_ID="$SIGN_SHA1" ./build.sh && bash tools/check-pages.sh
      - name: Unload the signing certificate
        if: always()
        run: '[ -z "${TIDEWALL_SIGN_KEYCHAIN:-}" ] || security delete-keychain "$TIDEWALL_SIGN_KEYCHAIN" || true'
      - name: Zip, and check it the way the updater will
        run: |
          v="${GITHUB_REF_NAME#v}"; z="Tidewall-${GITHUB_REF_NAME}.zip"
          ditto -c -k --keepParent build/Tidewall.app "$z"
          mkdir check && ditto -x -k "$z" check
          a=check/Tidewall.app
          [ "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' $a/Contents/Info.plist)" = app.tidewall ] || { echo "::error::bundle id"; exit 1; }
          [ "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' $a/Contents/Info.plist)" = "$v" ] || { echo "::error::bundle version"; exit 1; }
          codesign --verify --deep --strict "$a" || { echo "::error::code signature doesn't verify after the zip round trip"; exit 1; }
          sha1=$(echo "$SIGN_SHA1" | tr 'A-F' 'a-f')
          codesign --verify -R="identifier \"app.tidewall\" and certificate root = H\"$sha1\"" "$a" || { echo "::error::not signed with Tidewall's certificate (macOS would ask everyone for its permissions again)"; exit 1; }
          lipo -archs $a/Contents/MacOS/Tidewall | grep -q arm64 && lipo -archs $a/Contents/MacOS/Tidewall | grep -q x86_64 || { echo "::error::not universal"; exit 1; }
          awk -v v="$v" '$0 ~ "^## \\[?"v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
      - name: Make patches from the last few releases (only what changed; each checked the way the updater applies it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the newest previous release first (it's the "patch" copies 1.2.2-1.2.5 read); copies on 1.2.6 and later
          # find their own version in "patches". Any problem with one: no patch from it, and those copies fetch the
          # whole zip as before
          : > patch-from.txt
          prevs=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=20" --jq '[.[] | select(.draft|not) | select(.prerelease|not) | .tag_name] | .[]' | sed 's/^v//' | grep -vxF "${GITHUB_REF_NAME#v}" | head -4) || prevs=""
          [ -n "$prevs" ] || { echo "no previous release: no patches"; exit 0; }
          n=0
          for prev in $prevs; do
            # copies before 1.2.6 read only the first patch: a later one from such a version would never be used
            n=$((n + 1)); if [ $n -gt 1 ] && [ "$(printf '%s\n%s\n' "$prev" 1.2.6 | sort -V | head -1)" != 1.2.6 ]; then echo "no patch from $prev (it reads only the first)"; continue; fi
            if ! curl -fsSL -o "prev-$prev.zip" "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$prev/Tidewall-v$prev.zip"; then echo "::warning::couldn't fetch $prev: no patch from it"; continue; fi
            if ! { mkdir "prev-$prev" && ditto -x -k "prev-$prev.zip" "prev-$prev"; }; then echo "::warning::couldn't unpack $prev: no patch from it"; rm -rf "prev-$prev" "prev-$prev.zip"; continue; fi
            p="Tidewall-${GITHUB_REF_NAME}-patch-from-$prev.zip"
            if python3 tools/make-patch.py "prev-$prev/Tidewall.app" check/Tidewall.app "$p"; then echo "$prev" >> patch-from.txt
            else echo "::warning::the patch from $prev didn't check out: no patch from it"; rm -f "$p"; fi
            rm -rf "prev-$prev" "prev-$prev.zip"
          done
          echo "patches from: $(tr '\n' ' ' < patch-from.txt)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: release
          path: |
            Tidewall-${{ github.ref_name }}.zip
            Tidewall-${{ github.ref_name }}-patch-from-*.zip
            patch-from.txt
            notes.md
          if-no-files-found: warn
          retention-days: 3

  windows:
    # Tidewall for Windows (x64 and Arm64): Setup.exe and the update packages, made with Velopack on this Mac runner.
    # The last release's packages come down first, so updates from it are small deltas.
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9   # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Velopack
        run: dotnet tool install -g vpk --version 1.2.161
      - name: Installers and update packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          for rid in win-x64 win-arm64; do
            vpk "[win]" download github --repoUrl "https://github.com/${GITHUB_REPOSITORY}" --channel $rid --token "$GH_TOKEN" --outputDir windows/Releases/$rid || echo "no earlier $rid release: a full package only"
          done
          windows/pack.sh "$v" win-x64 win-arm64
          mkdir upload && cp windows/Releases/*/Tidewall-*-Setup.exe windows/Releases/*/Tidewall-$v-*.nupkg windows/Releases/*/releases.*.json windows/Releases/*/RELEASES-* upload/
          ls -la upload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: windows
          path: upload/*
          retention-days: 3

  publish:
    needs: [build, windows]
    runs-on: macos-15
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2 (only the signer and the public keys are used)
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/update-sign.swift
            Sources/Update/Updater.swift
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: windows
          path: windows
      - name: Sign the update
        env:
          TIDEWALL_UPDATE_KEY: ${{ secrets.TIDEWALL_UPDATE_KEY }}
        run: |
          [ -n "$TIDEWALL_UPDATE_KEY" ] || { echo "::error::the TIDEWALL_UPDATE_KEY secret is missing from the release environment"; exit 1; }
          v="${GITHUB_REF_NAME#v}"; z="Tidewall-${GITHUB_REF_NAME}.zip"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$z"
          # the release app's code-signature hash, read here from the zip itself (it pins every file in the bundle)
          mkdir c && ditto -x -k "$z" c
          cd_hash=$(codesign -dv --verbose=4 --arch arm64 c/Tidewall.app 2>&1 | sed -n 's/^CDHash=//p')   # (the slice every copy compares)
          [ -n "$cd_hash" ] || { echo "::error::no code-signature hash"; exit 1; }
          set -- "$z" "$v" "$url" notes.md "$cd_hash"
          zips=()
          if [ -f patch-from.txt ]; then while read -r prev; do [ -n "$prev" ] || continue; pz="Tidewall-${GITHUB_REF_NAME}-patch-from-$prev.zip"
            set -- "$@" "$pz" "$prev" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$pz"; zips+=("$pz"); done < patch-from.txt; fi
          swift tools/update-sign.swift sign "$@" > update.json
          pub=$(sed -n 's/.*static let publicKeys = \["\([^"]*\)".*/\1/p' Sources/Update/Updater.swift)
          swift tools/update-sign.swift verify "$z" update.json "$pub" ${zips[@]+"${zips[@]}"}   # the app will accept it
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("Tidewall-${GITHUB_REF_NAME}.zip" update.json)
          for f in Tidewall-${GITHUB_REF_NAME}-patch-from-*.zip; do if [ -f "$f" ]; then files+=("$f"); fi; done   # (a release may have no patch)
          for f in windows/*; do files+=("$f"); done                    # Windows: the two installers and their update feed
          gh release create "$GITHUB_REF_NAME" "${files[@]}" -R "$GITHUB_REPOSITORY" \
            --title "Tidewall ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
