name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Tidewall.app
        run: |
          sed -i '' "s/^VERSION=.*/VERSION=${GITHUB_REF_NAME#v}/" build.sh
          ./build.sh
      - name: Zip
        run: ditto -c -k --keepParent build/Tidewall.app "Tidewall-${GITHUB_REF_NAME}.zip"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"v {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" "Tidewall-${GITHUB_REF_NAME}.zip" --title "Tidewall ${GITHUB_REF_NAME#v}" --notes "${notes:-See CHANGELOG.md}"
