name: Website
# Builds the website (tools/build-site.sh: site/ plus the walls it runs, from themes/) and publishes it to GitHub Pages
# whenever any of it changes on main. Pages must be set to "GitHub Actions" in the repo's settings.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - themes/inkmap.html
      - themes/companion.js
      - themes/span.js
      - themes/ui/thumbs/**
      - tools/build-site.sh
      - .github/workflows/site.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: bash tools/build-site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
